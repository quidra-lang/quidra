          test -f "$OUT/results/finalization.json"
          test -f "$OUT/raw/sample.json"
          test -f "$OUT/work/agents/worker-a/result.json"
          test -f "$OUT/work/root/commands/cmd-a/result.json"
          test -f "$OUT/import_manifest.json"
