name: native-performance

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/native-performance.yml"
      - "src/**"
      - "include/**"
      - "CMakeLists.txt"
      - "tests/performance_regressions.py"
      - "benchmark/**"

concurrency:
  group: native-performance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  micro:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: brew install curl libpng jpeg-turbo libtiff webp go
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DQUIDRA_WARNINGS_AS_ERRORS=ON -DCMAKE_PREFIX_PATH="$(brew --prefix curl);$(brew --prefix libpng);$(brew --prefix jpeg-turbo);$(brew --prefix libtiff);$(brew --prefix webp)"
      - name: Build Quidra
        run: cmake --build build --parallel
      - name: Toolchain preflight
        run: |
          clang++ --version
          rustc --version
          go version
          build/quidra --version
      - name: Historical native micro workloads
        env:
          QUIDRA_BIN: ${{ github.workspace }}/build/quidra
        run: |
          python3 "benchmark/2026-09-17-7677581(latest)/scripts/run_micro_suite.py" \
            --configs quidra_native,quidra_interpreter,cpp,rust,go \
            --repeats 5 --warmups 2 --timeout 1800 \
            --out "${RUNNER_TEMP}/native-micro.json"
      - name: Prepare current-capability Quidra sources
        run: |
          python3 - <<'PY'
          import os, shutil

          source=os.path.join(
              os.environ["GITHUB_WORKSPACE"],
              "benchmark", "2026-09-17-7677581(latest)")
          target=os.path.join(os.environ["RUNNER_TEMP"], "current-micro")
          shutil.copytree(source,target)

          quidra=os.path.join(target,"micro","src","quidra")

          def replace(name, old, new):
              path=os.path.join(quidra,name)
              text=open(path).read()
              if old not in text:
                  raise SystemExit(f"{name}: current-capability transform anchor missing")
              with open(path,"w") as f:
                  f.write(text.replace(old,new,1))

          # MB03: fixed-width XOR now exists; remove the historical bit-serial
          # synthesis from the hot loop without changing the pinned algorithm.
          replace(
              "mb03.qui",
              "        s_xor = exclusive_or(s_xor, x)\n",
              "        s_xor = s_xor XOR x\n")

          # MB08: explicit checked bin -> UTF-8 text conversion now exists.
          replace(
              "mb08.qui",
              """        string[] pieces = array(size, fill = "")
                  for i in range(0, size)
                      pieces[i] = glyphs[int(data[i])]
                  string s = pieces.join("")
          """,
              """        string s = ""
                  match string.from_utf8(data)
                      string decoded
                          s = decoded
                      error problem
                          print("MB08 UTF-8 decode failed: {problem}")
                          process.exit(1)
          """)

          # MB10: string append is linear for a sole-owned accumulator, so the
          # historical million-element string[] staging array is no longer needed.
          replace(
              "mb10.qui",
              """        string[] rows = []
                  for i in range(0, count)
                      state = (state * 48271) % 2147483647
                      string[] fields = [i.string(), " ", state.string(), enter]
                      string line = fields.join("")
                      rows = rows.append(line)
                      written_bytes += len(line)
                  write_text(name, rows.join(""))
          """,
              """        string content = ""
                  for i in range(0, count)
                      state = (state * 48271) % 2147483647
                      string[] fields = [i.string(), " ", state.string(), enter]
                      string line = fields.join("")
                      content = content + line
                      written_bytes += len(line)
                  write_text(name, content)
          """)

          # MB11: Map.remove is now part of the standard deterministic container.
          replace(
              "mb11.qui",
              "        IntMap counts = IntMap()\n",
              "        map.Map<int, int> counts = map.Map<int, int>()\n")
          path=os.path.join(quidra,"mb11.qui")
          text=open(path).read().replace("counts.put(","counts.set(")
          old="        map_check = counts.checksum(1000003)\n"
          new="""        int[] checksum_keys = counts.keys()
                  int[] checksum_values = counts.values()
                  map_check = 0
                  for i in range(0, len(checksum_keys))
                      map_check = (map_check + checksum_keys[i] % 1000003 * checksum_values[i]) % 1000003
          """
          if old not in text:
              raise SystemExit("mb11.qui: checksum transform anchor missing")
          with open(path,"w") as f:
              f.write(text.replace(old,new,1))
          PY
      - name: Current-capability native micro workloads
        env:
          QUIDRA_BIN: ${{ github.workspace }}/build/quidra
        run: |
          python3 "${RUNNER_TEMP}/current-micro/scripts/run_micro_suite.py" \
            --configs quidra_native,cpp,rust,go \
            --repeats 5 --warmups 2 --timeout 1800 \
            --out "${RUNNER_TEMP}/current-native-micro.json"
      - name: Summarize measurements
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, statistics
          path=os.path.join(os.environ["RUNNER_TEMP"],"native-micro.json")
          if not os.path.exists(path):
              print("native-micro.json was not produced")
              raise SystemExit(0)
          data=json.load(open(path))
          rows=[]
          by={}
          display_name={
              "quidra_interpreter": "quidra_compile_execute",
          }
          for r in data["results"]:
              cfg=display_name.get(r["config"],r["config"])
              if r.get("status")!="ok":
                  rows.append((cfg,r["workload"],r.get("status"),None,None,None,None,None))
                  continue
              t=r["timing"]
              rep=t["representative"]
              row=(cfg,r["workload"],"ok",rep["wall_seconds"],rep["peak_rss_bytes"],r["build"]["wall_seconds"],r.get("artifact_size_bytes"),t["first_run_wall_seconds"])
              rows.append(row)
              by.setdefault(cfg,[]).append(rep["wall_seconds"])
          header="| config | workload | status | wall s | peak RSS MiB | compile s | artifact KiB | first run s |\n|---|---|---:|---:|---:|---:|---:|---:|"
          lines=[header]
          for cfg,wl,status,wall,rss,comp,size,first in rows:
              if status!="ok":
                  lines.append(f"| {cfg} | {wl} | {status} | - | - | - | - | - |")
              else:
                  lines.append(f"| {cfg} | {wl} | {status} | {wall:.4f} | {rss/1048576:.1f} | {comp:.4f} | {size/1024:.1f} | {first:.4f} |")
          lines.append("\n> Historical config `quidra_interpreter` invokes `quidra run`; the summary labels it `quidra_compile_execute` because it includes compile+link+execute and is not an interpreter/REPL measurement.")
          lines.append("\n## Mean wall time across 11 workloads")
          for cfg,vals in by.items():
              lines.append(f"- {cfg}: {statistics.mean(vals):.4f} s")
          text="\n".join(lines)+"\n"
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f: f.write(text)
          PY
      - name: Summarize current-capability measurements
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, statistics
          path=os.path.join(os.environ["RUNNER_TEMP"],"current-native-micro.json")
          if not os.path.exists(path):
              print("current-native-micro.json was not produced")
              raise SystemExit(0)
          data=json.load(open(path))
          rows=[]
          by={}
          per_workload={}
          for r in data["results"]:
              cfg=r["config"]
              wl=r["workload"]
              if r.get("status")!="ok":
                  rows.append((cfg,wl,r.get("status"),None,None,None,None,None))
                  continue
              t=r["timing"]
              rep=t["representative"]
              wall=rep["wall_seconds"]
              rows.append((cfg,wl,"ok",wall,rep["peak_rss_bytes"],r["build"]["wall_seconds"],r.get("artifact_size_bytes"),t["first_run_wall_seconds"]))
              by.setdefault(cfg,[]).append(wall)
              per_workload.setdefault(wl,{})[cfg]=wall

          lines=[
              "\n## Current-capability equivalent-source measurements",
              "",
              "Historical benchmark files are untouched. Only the temporary Quidra copy replaces obsolete forced substitutions with capabilities present on this commit.",
              "",
              "| config | workload | status | wall s | peak RSS MiB | compile s | artifact KiB | first run s |",
              "|---|---|---:|---:|---:|---:|---:|---:|",
          ]
          for cfg,wl,status,wall,rss,comp,size,first in rows:
              if status!="ok":
                  lines.append(f"| {cfg} | {wl} | {status} | - | - | - | - | - |")
              else:
                  lines.append(f"| {cfg} | {wl} | {status} | {wall:.4f} | {rss/1048576:.1f} | {comp:.4f} | {size/1024:.1f} | {first:.4f} |")
          lines.append("\n### Quidra wall-time ratio to median C++/Rust/Go")
          for wl in sorted(per_workload):
              values=per_workload[wl]
              peers=[values[cfg] for cfg in ("cpp","rust","go") if cfg in values]
              if "quidra_native" in values and peers:
                  ratio=values["quidra_native"]/statistics.median(peers)
                  lines.append(f"- {wl}: {ratio:.2f}x")
          lines.append("\n### Mean wall time across 11 workloads")
          for cfg,vals in by.items():
              lines.append(f"- {cfg}: {statistics.mean(vals):.4f} s")
          text="\n".join(lines)+"\n"
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write(text)
          PY
      - name: Preserve raw measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-micro-${{ github.sha }}
          path: |
            ${{ runner.temp }}/native-micro.json
            ${{ runner.temp }}/current-native-micro.json
          if-no-files-found: warn
