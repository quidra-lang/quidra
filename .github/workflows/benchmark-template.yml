          (root / "raw" / "sc-canonical-leaf-ids.txt").write_text(
              "\n".join(ids) + "\n"
          )
          assert len(ids) == 440, len(ids)
          PY
          while IFS= read -r ID; do
            AGENT="worker-$ID"
            python benchmark/template/scripts/benchmark.py task-start --workspace "$TMP" --id "$ID"
            python benchmark/template/scripts/benchmark.py task-apply --workspace "$TMP" --id "$AGENT" \
