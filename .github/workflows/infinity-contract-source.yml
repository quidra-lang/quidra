          rep('tensor<real32> multiplication overflow (deferred GPU check','tensor<real32> subtraction produced NaN (deferred GPU check')
          edit('docs/spec/language.md',[
          ('and so is a fixed-width real division of a constant by a constant zero.','and so is a real constant expression that produces NaN, including `0.0 / 0.0`.'),
          ("No `real32` or `real64` value, scalar or tensor element, is NaN or an infinity: an operation whose result would be one stops the program (`REAL_OVERFLOW`: `real64 multiplication overflow`, `tensor<real32> addition overflow`; a division by zero, `0.0 / 0.0` included, is `DIVISION_BY_ZERO`: `real32 division by zero`), and a constant real expression that overflows, or divides by a constant zero, is a compile-time error.","Signed infinities are valid real values, but NaN is never observable. Real overflow, nonzero real division by zero, and zero to a negative real power may produce infinity. An indeterminate operation stops the program (`NONFINITE_RESULT`: `real64 multiplication produced NaN`, `tensor<real32> subtraction produced NaN`; zero divided by zero is `DIVISION_BY_ZERO`: `real32 division by zero`). Constant expressions enforce the same rules at compile time; finite out-of-range literals and range-checked casts still fail."),
          ("A gradient that a backward pass delivers is tested the same way (`tensor<real32> gradient overflow`), and so is a real tensor a package function writes (`NONFINITE_RESULT`), unless the package declares that its kernels test what they write.","A delivered gradient and a real tensor a package function writes are likewise validated against NaN (`NONFINITE_RESULT`); infinity is allowed. A package may waive Core's output scan only by declaring that it validates NaN itself or preserves NaN-free inputs, including infinite inputs."),
          ('`real.parse` reads decimals and fractions (`1/3`, `-2/5`), not symbolic text.','`real.parse` reads decimals, fractions (`1/3`, `-2/5`) and signed infinity (`inf`, `-inf`, `∞`, `-∞`), not symbolic text. Exact infinities print as `∞` and `-∞`; fixed-width infinities print as `inf` and `-inf`.'),
          ("a NaN or an infinity stops the program at the call with `NONFINITE_RESULT` (`extern 'f' produced a non-finite real64 value`), since no Quidra real value is ever non-finite.","NaN stops the program at the call with `NONFINITE_RESULT` (`extern 'f' produced a NaN real64 value`); signed infinities cross unchanged."),
          ('A `real32` or `real64` argument from C must be finite: the entry point tests it before the function runs, and a NaN or an infinity stops the program with `NUMERIC_CONVERSION`','A `real32` or `real64` argument from C may be infinite but not NaN: the entry point checks before the function runs, and NaN stops the program with `NUMERIC_CONVERSION`')])
          name='docs/spec/numeric-and-bin.md';s=texts[name];a=s.index('## No NaN or infinity');b=s.index('## Complex numbers',a)
          texts[name]=s[:a]+'''## Signed infinity without NaN

          The real types (`real16`, `real16b`, `real32`, `real64` and exact `real`)
          admit signed infinity, written `inf` and `-inf`. Exact `real` displays these
          values as `∞` and `-∞`; fixed-width types display `inf` and `-inf`. The same
          spellings are used by printing, interpolation and `.string()`.

          Real overflow, nonzero real division by zero and zero to a negative real
          power may produce infinity. NaN is never observable: an indeterminate
          operation such as `inf - inf`, `0 * inf` or `inf / inf` fails with
          `NONFINITE_RESULT`, while `0.0 / 0.0` fails with `DIVISION_BY_ZERO`.
          Undefined powers, including `0 ^ 0` and a negative real base with a
          fractional exponent, retain `POWER_DOMAIN`.

          A constant expression follows the same rules in its concrete type:

          ```quidra
          real64 big = 1.0e308 * 10.0 // inf: arithmetic overflow is allowed
          real64 invalid = 0.0 / 0.0 // compile-time error: indeterminate division
          ```

          Finite out-of-range literals and finite narrowing conversions still fail;
          an already infinite real value preserves its sign in real-family conversions.
          Infinity cannot convert to an integer. Parsing accepts `inf` and `-inf`,
          rejects NaN, and retains range checks for finite text. Exact `real.parse`
          also accepts `∞` and `-∞`. Signed zero and subnormal behavior is unchanged;
          fixed-width `-0.0` prints with its sign and compares equal to `0.0`.

          Arrays, tensor elements, delivered gradients and native package outputs
          obey this policy. CPU tensor checks report the first failing logical element;
          GPU checks stay on the device and report at the next synchronization point.
          Merged checks must report the same first indeterminate operation, at its
          own location, as unmerged checks. An intermediate NaN cannot be hidden by a
          later operation such as raising it to zero.

          '''+s[b:]
          edit(name,[('`0 ^ 0`, a zero base with a negative exponent, a negative integer exponent,','`0 ^ 0`, a negative integer exponent,'),
          ("algorithm. A result, or an intermediate value of `/`, that is not finite\nstops the program like a real overflow (`REAL_OVERFLOW`,\n`com32 multiplication overflow`), and a divisor `0.0 + 0.0i` is","algorithm. A NaN result, or a NaN intermediate value of `/`, stops the\nprogram (`NONFINITE_RESULT`, `com32 multiplication produced NaN`);\ninfinite parts are valid. A divisor `0.0 + 0.0i` remains"),
          ('Integer widening whose source range is fully contained in the destination is infallible.','Already infinite values retain their sign in real-family conversions; they cannot convert to an integer. Integer widening whose source range is fully contained in the destination is infallible.')])
          edit('docs/spec/diagnostics.md',[
          ('- a fixed-width real operation (`+`, `-`, `*`, `/`, `^`) whose result is not finite: an overflow (`REAL_OVERFLOW`) or a division by zero (`DIVISION_BY_ZERO`);','- a real operation that produces NaN (`NONFINITE_RESULT`), or zero/zero division (`DIVISION_BY_ZERO`); real overflow to infinity is permitted;'),
          ('No value of a fixed-width real type (`real32`, `real64`) that a program can observe, scalar or tensor element, is NaN or an infinity: an operation that would produce one stops the program instead, so `print` and string interpolation never see such a value.','Real values, scalar or tensor elements, may be infinite but never NaN. Indeterminate arithmetic stops at the operation before NaN can be printed or consumed.'),
          ('| `DIVISION_BY_ZERO` | Integer division or remainder, or an exact `real` division, by a divisor that is zero at run time: `division by zero`. A fixed-width real division by zero (`0.0 / 0.0` included): `real64 division by zero` (reason `REAL_ZERO_DIVISOR`; the JSON report carries `type`). |','| `DIVISION_BY_ZERO` | Integer division or remainder by zero, exact real zero/zero, or complex division by zero. Fixed-width real zero/zero reports `real64 division by zero` (reason `REAL_ZERO_DIVISOR`; JSON carries `type`). Nonzero real division by zero produces signed infinity instead. |'),
          ("| `NONFINITE_RESULT` | A real value that code outside Quidra made is NaN or an infinity: the result of an `extern` function, reported at the call (`extern 'f' produced a non-finite real64 value`; reason `EXTERN_RESULT`), or a real tensor a package function wrote through a `&` argument (`package operation f produced a non-finite real32 value`; reason `PACKAGE_OPERATION`), reported at the call, or at the user's statement when the package's own kernel reports it. The JSON report carries `type` and `operation` (the function's name). |","| `NONFINITE_RESULT` | NaN from a real or complex operation (`real64 multiplication produced NaN`), delivered gradient, `extern` result (`extern 'f' produced a NaN real64 value`; reason `EXTERN_RESULT`), or native package output (`package operation f produced a NaN real32 value`; reason `PACKAGE_OPERATION`). It names the producing operation or call; JSON carries `type` and `operation`. Signed infinities do not trigger this diagnostic. |"),
          ('or a NaN or an infinity that C passes to an `export "C"` function','or a NaN that C passes to an `export "C"` function'),
          ('the base is 0 and the exponent 0 or negative (`0 ^ 0 is undefined`, `0 ^ a negative exponent is undefined`)','the base and exponent are both zero (`0 ^ 0 is undefined`)')])
          name='docs/spec/diagnostics.md'
          texts[name]='\n'.join('| `REAL_OVERFLOW` | Retained in the diagnostic catalog for compatibility. Ordinary real arithmetic overflow now produces infinity rather than this error; indeterminate results use `NONFINITE_RESULT`. Range-checked conversions retain their conversion errors. |' if x.startswith('| `REAL_OVERFLOW` |') else x for x in texts[name].splitlines())+'\n'
          edit('docs/spec/llm-guide.md',[
          ('No `real32` or `real64` value, scalar or tensor element, is NaN or an infinity: an operation that would produce one (an overflow, a division by zero) stops the program, so never test for `nan` or `inf`.','Signed infinities are valid real values, but NaN is forbidden. Real overflow, nonzero division by zero and zero to a negative real power may produce infinity; indeterminate operations fail. Use `inf` and `-inf` explicitly. Exact `real` prints `∞`/`-∞`, fixed-width types `inf`/`-inf`. Finite out-of-range literals and narrowing casts remain errors.'),
          ('that is NaN or an infinity stops the program where it enters.','that is NaN stops the program where it enters; signed infinities cross unchanged.')])
          name='docs/packages.md';s=texts[name];a=s.index('- Non-finite values:');b=s.index('- Scratch from',a)
          texts[name]=s[:a]+'''- NaN validation: real values may be infinite but never NaN. Core validates
            tensors and tensor arrays written through native `&` arguments and reports
            `NONFINITE_RESULT` for NaN, at the call or the next GPU synchronization.
            A package may waive this scan using `qcore_op_register_flags` with
            `QCORE_OP_VALIDATES_NAN` when its kernels check outputs, or
            `QCORE_OP_NAN_PRESERVING` when NaN-free inputs, including infinities, imply
            NaN-free outputs. `QCORE_OP_VALIDATES_NONFINITE` remains an alias of the
            validation flag. The legacy `QCORE_OP_FINITE_PRESERVING` flag is accepted
            but does not waive checks: finite-input preservation says nothing about
            infinite inputs. CPU kernels can report invalid outputs through
            `qcore_tensor_report_status`; GPU kernels use deferred status slots.
            The runtime counter retains its historical name `finite_validations`.
          '''+s[b:]
          for name,(before,after,blob) in records.items():
              data=texts[name].encode('utf-8')
              assert hashlib.sha256(data).hexdigest()==after, ('result mismatch',name)
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==blob, name
              Path(name).write_bytes(data)
              if name.endswith('.sh'): subprocess.run(['bash','-n',name],check=True)
          Path('contract-results/sources.json').write_text(json.dumps(records,indent=2)+'\n')
          subprocess.run(['git','diff','--check'],check=True)
          PY
      - name: Execute complete regression suites and native infinity cases
        run: |
          set -euo pipefail
          compiler="$GITHUB_WORKSPACE/build-gpu-contracts/quidra"
          for name in runtime_diagnostics c_export half_precision complex stdlib nonfinite; do
            args=()
            case "$name" in
              c_export) args=(clang++) ;;
              runtime_diagnostics|stdlib) args=("$GITHUB_WORKSPACE") ;;
            esac
            if bash "tests/${name}_tests.sh" "$compiler" "${args[@]}" > "contract-results/$name.log" 2>&1; then
              echo "PASS $name" | tee -a contract-results/summary.log
            else
              tail -n 80 "contract-results/$name.log"
              exit 1
            fi
          done
          python3 tests/infinity_tests.py "$compiler" --report contract-results/language.json > contract-results/language.log
          grep -Fx '124/124 passed; 0 failed' contract-results/language.log
          python3 tests/metadata_ssot_tests.py
      - name: Store verified blobs without moving a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,urllib.request
          for name,(before,after,blob) in json.loads(Path('contract-results/sources.json').read_text()).items():
              data=Path(name).read_bytes()
              assert hashlib.sha256(data).hexdigest()==after, name
              expected=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert expected==blob, name
              request=urllib.request.Request('https://api.github.com/repos/quidra-lang/quidra/git/blobs',data=json.dumps({'content':data.decode('utf-8'),'encoding':'utf-8'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(request,timeout=60) as response: stored=json.load(response)
              assert stored['sha']==expected, name
              print(name,expected)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infinity-contract-source
          path: contract-results/
          retention-days: 7
          if-no-files-found: error
