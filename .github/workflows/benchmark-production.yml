name: benchmark-production

# Paid inference is triggered only by an explicit request on the disposable
# benchmark branch. develop never starts this workflow. The operator creates
# benchmark from the develop snapshot to evaluate, then changes
# benchmark/.run-production on that branch.
on:
  push:
    branches: [benchmark]
    paths:
      - "benchmark/.run-production"

permissions:
  contents: write

concurrency:
  group: benchmark-production
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      BENCHMARK_IMAGE: quidra-benchmark/runtime:production
      BENCHMARK_MODEL: claude-sonnet-5
      # Sized against the token envelope benchmark.py plan reports for the frozen
      # manifest, so the guard covers a complete run rather than stopping it
      # partway. It remains a soft ceiling: the gateway refuses the next request
      # once estimated spend reaches it, so it caps overspend, it does not
      # authorize this much.
      BENCHMARK_BUDGET_USD: "100.0"
      # Dependency-ready work units kept in flight at once. The first paid run
      # dispatched one unit at a time and spent its whole window on 182
      # attempts, most of them one ninety-second provider call; six workers on
      # a four-vCPU runner keep the provider busy while compile bursts and the
      # host-timed micro suite (which runs between batches, alone) still fit.
      BENCHMARK_CONCURRENCY: "6"

    steps:
      - uses: actions/checkout@v4
        with:
          # Freeze the exact commit that triggered this run. If benchmark moves
          # while the job is queued, we must not silently evaluate the newer tip.
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Attach the disposable branch to the frozen trigger commit
        run: git checkout -B benchmark "$GITHUB_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Confirm paid-run contract
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$ANTHROPIC_API_KEY" || {
            echo "::error::Repository secret ANTHROPIC_API_KEY is not configured."
            exit 1
          }
          evaluation="$(sed -n 's/^evaluation:[[:space:]]*//p' benchmark/.run-production | tail -n 1 | xargs)"
          [ -n "$evaluation" ] || evaluation="all"
          case "$evaluation" in
            all|semantic_compression|llm_learnability|language_quality|ecosystem|llm_proficiency) ;;
            *) echo "::error::Invalid benchmark evaluation in benchmark/.run-production: $evaluation"; exit 1 ;;
          esac
          # A rehearsal names work units and runs them alone through the real
          # image, gateway and provider under a hard one-dollar guard. It is how
          # a change to the paid path is tried on one packet or one agent unit
          # before a run that could spend a hundred dollars.
          units="$(sed -n 's/^units:[[:space:]]*//p' benchmark/.run-production | tail -n 1 | tr ',' ' ' | xargs)"
          budget="$(sed -n 's/^budget_usd:[[:space:]]*//p' benchmark/.run-production | tail -n 1 | xargs)"
          if [ -n "$units" ]; then
            for unit in $units; do
              case "$unit" in
                *[!A-Za-z0-9._-]*) echo "::error::Invalid work unit id in benchmark/.run-production: $unit"; exit 1 ;;
              esac
            done
            [ -n "$budget" ] || budget="1.0"
            python - "$budget" <<'PY'
          import sys
          budget = float(sys.argv[1])
          if not 0 < budget <= 1.0:
              raise SystemExit("::error::a rehearsal's budget_usd must be within (0, 1.0]")
          PY
            echo "BENCHMARK_BUDGET_USD=$budget" >> "$GITHUB_ENV"
            echo "paid rehearsal units: $units (guard $budget USD)"
            # A rehearsal prepares only its own evaluation. Preparing everything
            # would also run the Language Quality mechanical measurement, which
            # takes about six hours on a hosted runner and ended rehearsal 3 at
            # the job's deadline before its one paid unit could finish.
            if [ "$evaluation" = "all" ]; then
              evaluation="$(python - $units <<'PY'
          import sys
          prefixes = {
              "learnability-": "llm_learnability", "sc-": "semantic_compression",
              "proficiency-": "llm_proficiency", "ecosystem-": "ecosystem", "lq-": "language_quality",
          }
          found = set()
          for unit in sys.argv[1:]:
              for prefix, evaluation in prefixes.items():
                  if unit.startswith(prefix):
                      found.add(evaluation)
                      break
              else:
                  raise SystemExit(f"::error::cannot tell which evaluation work unit {unit} belongs to")
          if len(found) != 1:
              raise SystemExit("::error::a rehearsal's units must belong to one evaluation")
          print(found.pop())
          PY
          )"
              echo "rehearsal prepares only: $evaluation"
            fi
          elif [ -n "$budget" ]; then
            python - "$budget" <<'PY'
          import sys
          budget = float(sys.argv[1])
          if not 0 < budget <= 150.0:
              raise SystemExit("::error::budget_usd must be within (0, 150]")
          PY
            echo "BENCHMARK_BUDGET_USD=$budget" >> "$GITHUB_ENV"
          fi
          echo "BENCHMARK_UNITS=$units" >> "$GITHUB_ENV"
          short_sha="$(git rev-parse --short=7 HEAD)"
          run_id="$(date -u +%F)-${short_sha}-gh${GITHUB_RUN_NUMBER}"
          echo "RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "EVALUATED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "BENCHMARK_EVALUATION=$evaluation" >> "$GITHUB_ENV"
          echo "paid benchmark scope: $evaluation"

      - name: Prove the paid request shape before spending on the run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Everything before this point has run against the deterministic fake
          # provider, so the request this benchmark actually sends has never been
          # tried. A malformed one fails identically on call 1 and call 1160;
          # finding out here costs a fraction of a cent instead of an image build,
          # a planning pass and a partial run.
          python benchmark/template/scripts/production_run.py provider-smoke \
            --model "$BENCHMARK_MODEL" \
            --budget-usd 0.50 \
            --output "$RUNNER_TEMP/provider-smoke.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(
              Path(os.environ["RUNNER_TEMP"], "provider-smoke.json").read_text()
          )
          assert report["ok"], report.get("failed_checks")
          spent = report["spend"]["estimated_cost_usd"]
          print(f"smoke spend: ${spent:.4f} over {report['spend']['paid_inference_calls']} calls")
          # A smoke test that somehow cost real money is itself a finding.
          assert spent < 0.10, f"the smoke test spent {spent} USD"
          PY

      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Build and verify the pinned ten-language image
        run: |
          python benchmark/template/runtime/check_pins.py
          python benchmark/template/scripts/sandbox_launcher.py build-image \
            --target toolchains --image "$BENCHMARK_IMAGE"
          python benchmark/template/scripts/sandbox_launcher.py doctor \
            --image "$BENCHMARK_IMAGE"

      - name: Stage evaluated snapshot
        run: |
          python benchmark/template/scripts/benchmark.py init \
            --source-repo "$GITHUB_WORKSPACE" \
            --sandbox-mode container \
            --run-id "$RUN_ID" \
            --provider anthropic-messages \
            --model "$BENCHMARK_MODEL"

      - name: Deterministic preparation without paid inference
        run: |
          scope_args=()
          if [ "$BENCHMARK_EVALUATION" != "all" ]; then
            scope_args=(--evaluation "$BENCHMARK_EVALUATION")
          fi
          python benchmark/template/scripts/sandbox_launcher.py run \
            --source-repo "$GITHUB_WORKSPACE" \
            --image "$BENCHMARK_IMAGE" \
            --provider fake \
            -- python3 /quidra-benchmark/template/scripts/benchmark.py prepare "${scope_args[@]}"

      - name: Freeze trusted task network policy and spend ceilings
        run: |
          scope_args=()
          if [ "$BENCHMARK_EVALUATION" != "all" ]; then
            scope_args=(--evaluation "$BENCHMARK_EVALUATION")
          fi
          unit_args=()
          for unit in $BENCHMARK_UNITS; do unit_args+=(--unit "$unit"); done
          python benchmark/template/scripts/production_run.py policy \
            --workspace "$GITHUB_WORKSPACE/.quidra-benchmark" \
            --model "$BENCHMARK_MODEL" \
            --output "$RUNNER_TEMP/task-policy.json" \
            "${scope_args[@]}" "${unit_args[@]}"

      - name: Run paid production benchmark
        id: paid_benchmark
        timeout-minutes: 330
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          scope_args=()
          if [ "$BENCHMARK_EVALUATION" != "all" ]; then
            scope_args=(--evaluation "$BENCHMARK_EVALUATION")
          fi
          unit_args=()
          for unit in $BENCHMARK_UNITS; do unit_args+=(--unit "$unit"); done
          python benchmark/template/scripts/sandbox_launcher.py run \
            --source-repo "$GITHUB_WORKSPACE" \
            --image "$BENCHMARK_IMAGE" \
            --provider anthropic-messages \
            --model "$BENCHMARK_MODEL" \
            --budget-usd "$BENCHMARK_BUDGET_USD" \
            --network-policy disabled \
            --task-policy "$RUNNER_TEMP/task-policy.json" \
            --gateway-log-out "$RUNNER_TEMP/gateway-audit.jsonl" \
            -- python3 /quidra-benchmark/template/scripts/production_run.py run \
               --workspace /quidra-benchmark \
               --max-wall-seconds 18900 \
               --concurrency "$BENCHMARK_CONCURRENCY" \
               "${scope_args[@]}" "${unit_args[@]}"

      - name: Record API usage and estimated cost
        if: always()
        run: |
          # Both stay in RUNNER_TEMP and reach the workflow artifact only. The
          # gateway audit is trusted-side evidence the scored workspace must never
          # contain, and this step runs after the sandbox has already finalized:
          # copying anything in here would add files to the retained set after the
          # privacy gate and finalization that are supposed to cover it.
          python benchmark/template/scripts/production_run.py cost-report \
            --log "$RUNNER_TEMP/gateway-audit.jsonl" \
            --output "$RUNNER_TEMP/api-cost.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path(os.environ["RUNNER_TEMP"], "api-cost.json").read_text())
          print(
              f"spend: ${report['estimated_cost_usd']:.2f} over {report['paid_inference_calls']} calls; "
              f"uncached in {report['input_tokens']}, cache read {report['cache_read_input_tokens']}, "
              f"cache write {report['cache_creation_input_tokens']}, out {report['output_tokens']}, "
              f"empty completions {report['empty_completions']}, errors {report['gateway_errors']}"
          )
          for task, entry in list(report["by_task"].items())[:15]:
              print(f"  {entry['estimated_cost_usd']:7.2f}  {entry['calls']:4} calls  "
                    f"{entry['empty_completions']:3} empty  {task}")
          PY

      - name: Snapshot the workspace before import discards it
        if: always()
        run: |
          # post-run imports the retained set of the finished run and deletes the
          # workspace. A unit that ended blocked has its evidence outside that set
          # (work/attempts holds every retried attempt's directory), and a run that
          # failed before finalizing has no retained set at all. Either way the
          # workspace is the only record of what went wrong, so it is archived
          # here, into RUNNER_TEMP, before anything discards it.
          if [ -d .quidra-benchmark ]; then
            tar -czf "$RUNNER_TEMP/workspace-evidence.tgz" \
              --ignore-failed-read \
              -C .quidra-benchmark \
              run.json results raw prompts work/agents work/attempts \
              work/root/manifest.json work/root/ledger.json \
              work/root/plans work/root/commands 2>/dev/null || true
            ls -la "$RUNNER_TEMP/workspace-evidence.tgz" || true
          fi

      - name: Checkpoint validated cache
        if: always()
        run: |
          set -euo pipefail
          echo "CHECKPOINT_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "BENCHMARK_BRANCH_MOVED_DURING_RUN=0" >> "$GITHUB_ENV"
          if [ ! -f .quidra-benchmark/work/root/ledger.json ]; then
            echo "No frozen ledger exists; there is nothing safe to checkpoint."
            exit 0
          fi

          python benchmark/template/scripts/benchmark.py checkpoint-cache \
            --source-repo "$GITHUB_WORKSPACE" \
            | tee "$RUNNER_TEMP/cache-checkpoint.json"

          git add -f benchmark/cache
          if git diff --cached --quiet; then
            echo "No new certified cache records."
            exit 0
          fi

          git fetch origin benchmark
          origin_head="$(git rev-parse origin/benchmark)"
          if [ "$origin_head" != "$EVALUATED_SHA" ]; then
            echo "BENCHMARK_BRANCH_MOVED_DURING_RUN=1" >> "$GITHUB_ENV"
            echo "::warning::benchmark moved independently during the run; cache is committed locally and preserved in the workflow artifact instead of racing another writer."
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "Checkpoint certified benchmark cache for ${EVALUATED_SHA:0:7}"
            echo "CHECKPOINT_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
            exit 0
          fi

          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Checkpoint certified benchmark cache for ${EVALUATED_SHA:0:7}"
          git push origin HEAD:benchmark
          echo "CHECKPOINT_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Decide whether this is a publishable complete run
        if: always() && env.BENCHMARK_EVALUATION == 'all' && env.BENCHMARK_UNITS == ''
        run: |
          set -euo pipefail
          echo "BENCHMARK_PUBLISH_RESULT=0" >> "$GITHUB_ENV"
          status=".quidra-benchmark/results/primary_status.json"
          if [ ! -f "$status" ]; then
            echo "No Primary status exists; preserve evidence/cache only."
            exit 0
          fi
          if python - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path(".quidra-benchmark/results/primary_status.json").read_text())
          evaluations = status.get("evaluations") or {}
          expected = {
              "semantic_compression", "llm_learnability", "language_quality",
              "ecosystem", "llm_proficiency",
          }
          missing = sorted(expected - set(evaluations))
          incomplete = {
              name: (evaluations.get(name) or {}).get("status")
              for name in sorted(expected)
              if (evaluations.get(name) or {}).get("status") != "COMPLETE"
          }
          print(json.dumps({"missing": missing, "incomplete": incomplete}, indent=2))
          if missing or incomplete:
              raise SystemExit(3)
          PY
          then
            echo "BENCHMARK_PUBLISH_RESULT=1" >> "$GITHUB_ENV"
            echo "All five Primary evaluations are COMPLETE; this run is publishable."
          else
            echo "Run is not fully COMPLETE; keep certified cache and workflow artifact, but do not create a formal benchmark/<run-id> result."
          fi

      - name: Import the finished run
        if: success() && env.BENCHMARK_EVALUATION == 'all' && env.BENCHMARK_UNITS == '' && env.BENCHMARK_PUBLISH_RESULT == '1'
        run: |
          # Only a fully COMPLETE five-Primary run becomes a formal repository
          # result. Partial/blocked attempts remain available in the workflow
          # artifact and their validated units are still checkpointed to cache.
          python benchmark/template/scripts/benchmark.py post-run \
            --source-repo "$GITHUB_WORKSPACE"
          test -f "benchmark/$RUN_ID/import_manifest.json"

      - name: Push the result to the isolated benchmark branch
        if: success() && env.BENCHMARK_EVALUATION == 'all' && env.BENCHMARK_UNITS == '' && env.BENCHMARK_PUBLISH_RESULT == '1'
        run: |
          git fetch origin benchmark
          if [ "$BENCHMARK_BRANCH_MOVED_DURING_RUN" = "1" ]; then
            echo "::warning::benchmark moved independently during the run; the imported run is preserved as an artifact instead of racing another writer."
            exit 0
          fi
          if [ "$(git rev-parse origin/benchmark)" != "$CHECKPOINT_HEAD" ]; then
            echo "::warning::benchmark moved after the cache checkpoint; the imported run is preserved as an artifact instead of racing another writer."
            exit 0
          fi
          # -f: the repository ignores *.o, *.ll, __pycache__ and similar, and a
          # retained agent directory legitimately contains such files. Dropping
          # them silently would leave import_manifest.json listing hashes of
          # files absent from the commit.
          git add -f "benchmark/$RUN_ID" benchmark/cache benchmark/template/prompts
          python - <<'PY'
          import json, os, subprocess
          run_id = os.environ["RUN_ID"]
          manifest = json.load(open(f"benchmark/{run_id}/import_manifest.json"))
          listed = set(manifest.get("retained_files_sha256", {}))
          staged = set(
              p[len(f"benchmark/{run_id}/"):] for p in subprocess.check_output(
                  ["git", "ls-files", "--cached", f"benchmark/{run_id}"], text=True
              ).split()
          )
          missing = sorted(listed - staged)
          assert not missing, f"retained files not staged: {missing[:10]}"
          PY
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Add benchmark summary and certified cache for ${EVALUATED_SHA:0:7}"
          git push origin HEAD:benchmark

      - name: Preserve run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ env.RUN_ID }}
          if-no-files-found: ignore
          retention-days: 30
          path: |
            ${{ runner.temp }}/workspace-evidence.tgz
            benchmark/${{ env.RUN_ID }}
            benchmark/cache
            benchmark/template/prompts
            ${{ runner.temp }}/api-cost.json
            ${{ runner.temp }}/gateway-audit.jsonl
            ${{ runner.temp }}/provider-smoke.json
            ${{ runner.temp }}/task-policy.json
            ${{ runner.temp }}/cache-checkpoint.json
