          import json
          data = json.loads(Path(".benchmark-template-test/work/root/ledger.json").read_text())
          assert data["units"]["ecosystem-gates--part-1"]["status"] == "PENDING"
          assert data["units"]["ecosystem-gates--part-1"]["attempts"] == 1
          PY

          # A terminal blocker must propagate through dependent work instead of
          # leaving the evaluation permanently PENDING.
          python benchmark/template/scripts/benchmark.py ledger-update \
            --workspace "$TMP" --id ecosystem-gates--part-1 --status BLOCKED \
            --blocker "synthetic CI infrastructure blocker" \
