          ("fails divide16b DIVISION_BY_ZERO 'real16b division by zero' '3:7'",'''[[ "$("$QUIDRA" run "$TMP/divide16b.qui")" == "inf" ]]
          cat > "$TMP/nan16.qui" <<'QUI'
