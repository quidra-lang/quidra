          rep('// Writes `value` into every element; the third element becomes +infinity','// Writes `value` into every element; the third element becomes NaN')
          rep('? std::numeric_limits<float>::infinity() : value;','? std::numeric_limits<float>::quiet_NaN() : value;')
          assert texts[name].count('produced a non-finite real32 value')==2
