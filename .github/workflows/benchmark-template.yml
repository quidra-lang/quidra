          ).strip())
          sentinel_path = sentinel_raw if sentinel_raw.is_absolute() else source / sentinel_raw
          sentinel_path.write_text(json.dumps(sentinel, indent=2, sort_keys=True) + "\n")
          PY

          MOVED_REPO="$PWD/.benchmark-post-run-repo-moved"
