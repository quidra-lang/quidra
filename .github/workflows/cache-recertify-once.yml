name: cache-recertify-once

on:
  workflow_dispatch:
  push:
    branches: [develop]
    # Re-run the no-provider recertification whenever the compatibility
    # contract itself changes. Cache/prompt commits produced below are excluded,
    # so the checkpoint push cannot recursively trigger this workflow.
    # workflow_dispatch also supports a clean retry after develop moves mid-run.
    paths:
      - ".github/workflows/cache-recertify-once.yml"
      - "benchmark/template/scripts/benchmark.py"
      - "benchmark/template/scripts/production_run.py"
      - "benchmark/template/scripts/audit_proficiency_legacy.py"
      - "benchmark/template/scripts/adversarial_measure.py"
      - "benchmark/template/scripts/micro_measure.py"
      - "benchmark/template/config/cache_policy.json"
      - "benchmark/template/config/primary.json"
      - "benchmark/template/config/work_plan_templates.json"
      - "benchmark/template/methodology-assets/semantic_compression/**"
      - "benchmark/template/methodology-assets/ecosystem/**"
      - "docs/**"
      - "benchmark/template/environment/environment.json"
      - "benchmark/template/runtime/**"

permissions:
  contents: write
  actions: read

concurrency:
  group: cache-recertify-once
  cancel-in-progress: true

jobs:
  certified-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      BENCHMARK_IMAGE: quidra-benchmark/runtime:production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Build and verify pinned benchmark image
        run: |
          python benchmark/template/runtime/check_pins.py
          python benchmark/template/scripts/sandbox_launcher.py build-image --target toolchains --image "$BENCHMARK_IMAGE"
          python benchmark/template/scripts/sandbox_launcher.py doctor --image "$BENCHMARK_IMAGE"

      - name: Initialize clean recertification workspace
        run: |
          set -euo pipefail
          short_sha="$(git rev-parse --short=7 HEAD)"
          python benchmark/template/scripts/benchmark.py init \
            --source-repo "$GITHUB_WORKSPACE" \
            --sandbox-mode container \
            --run-id "cache-recertify-${short_sha}" \
            --provider anthropic-messages \
            --model claude-sonnet-5

      - name: Recover retained paid evidence without provider calls
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          evidence_root="$RUNNER_TEMP/legacy-evidence"
          recovered_cache="$RUNNER_TEMP/recovered-cache"
          mkdir -p "$evidence_root" "$recovered_cache"

          recover_evidence() {
            run_id="$1"
            workflow_run="$2"
            artifact_name="$3"
            snapshot="$4"
            artifact_id="$(
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${workflow_run}/artifacts" \
                --jq ".artifacts[] | select(.name == \"${artifact_name}\") | .id" \
                | head -n 1
            )"
            test -n "$artifact_id" || {
              echo "::error::artifact not found: ${artifact_name} (run ${workflow_run})"
              exit 1
            }
            zip="$evidence_root/${artifact_id}.zip"
            tgz="$evidence_root/${artifact_id}.tgz"
            dst="$evidence_root/${run_id}"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$zip"
            unzip -p "$zip" '_temp/workspace-evidence.tgz' > "$tgz"
            rm -rf "$dst"
            mkdir -p "$dst"
            tar -xzf "$tgz" -C "$dst"

            # Some paid runs were made from commits that still exist in GitHub's
            # object store but are no longer ancestors of develop. A normal
            # fetch-depth: 0 checkout therefore may not contain the commit object.
            # Recover the exact public source archive by immutable SHA instead of
            # treating missing branch ancestry as a scientific cache miss.
            if ! git cat-file -e "${snapshot}^{commit}" 2>/dev/null; then
              source_tgz="$evidence_root/${snapshot}.source.tgz"
              source_dir="$evidence_root/source-${snapshot}"
              rm -rf "$source_dir"
              mkdir -p "$source_dir"
              gh api \
                -H "Accept: application/vnd.github+json" \
                "repos/${GITHUB_REPOSITORY}/tarball/${snapshot}" \
                > "$source_tgz"
              tar -xzf "$source_tgz" -C "$source_dir"
              source_root="$(
                find "$source_dir" -mindepth 1 -maxdepth 1 -type d -print -quit
              )"
              test -n "$source_root"
              test -d "$source_root/benchmark/template"
              mkdir -p "$dst/template" "$dst/repo"
              cp -a "$source_root/benchmark/template/." "$dst/template/"
              cp -a "$source_root/." "$dst/repo/"
            fi

            python benchmark/template/scripts/benchmark.py cache-promote-evidence \
              --source-repo "$GITHUB_WORKSPACE" \
              --evidence "$dst" \
              --snapshot "$snapshot" \
              | tee "$evidence_root/${run_id}.promotion.json"

            # Older paid trial records can predate scored-output-cap
            # certification even when their retained traces prove that the cap
            # never truncated a completion. Add only that mechanical
            # certification from the exact retained agent_trace.json; the
            # result bytes and historical fingerprint stay unchanged.
            python benchmark/template/scripts/benchmark.py cache-annotate-caps \
              --source-repo "$GITHUB_WORKSPACE" \
              --evidence "$dst" \
              | tee "$evidence_root/${run_id}.cap-annotation.json"
          }

          recover_proficiency_workspace() {
            run_id="$1"
            workflow_run="$2"
            artifact_name="$3"
            snapshot="$4"
            artifact_id="$(
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${workflow_run}/artifacts" \
                --jq ".artifacts[] | select(.name == \"${artifact_name}\") | .id" \
                | head -n 1
            )"
            test -n "$artifact_id" || {
              echo "::error::artifact not found: ${artifact_name} (run ${workflow_run})"
              exit 1
            }

            zip="$evidence_root/${artifact_id}.zip"
            tgz="$evidence_root/${artifact_id}.workspace.tgz"
            dst="$evidence_root/${run_id}"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$zip"
            unzip -p "$zip" 'workspace.tgz' > "$tgz"

            # The handoff also carries the cumulative private paid-call store.
            # Preserve it for the free partial-paid-import preflight below so
            # incomplete Zig/TypeScript/Quidra work is priced from already-paid
            # calls rather than from zero. This is only state hydration; no
            # provider is contacted.
            paid_tgz="$evidence_root/${artifact_id}.paid-state.tgz"
            unzip -p "$zip" 'paid-state.tgz' > "$paid_tgz"
            mkdir -p "$RUNNER_TEMP/benchmark-paid-state"
            tar -xzf "$paid_tgz" -C "$RUNNER_TEMP/benchmark-paid-state"

            rm -rf "$dst"
            mkdir -p "$dst"
            # benchmark-primary handoffs package .quidra-benchmark as the archive root.
            tar -xzf "$tgz" -C "$dst" --strip-components=1

            python benchmark/template/scripts/benchmark.py \
              cache-recover-proficiency-attempts \
              --evidence "$dst" \
              | tee "$evidence_root/${run_id}.proficiency-recovery.json"

            python benchmark/template/scripts/benchmark.py cache-promote-evidence \
              --source-repo "$GITHUB_WORKSPACE" \
              --evidence "$dst" \
              --snapshot "$snapshot" \
              | tee "$evidence_root/${run_id}.promotion.json"

            python benchmark/template/scripts/benchmark.py cache-annotate-caps \
              --source-repo "$GITHUB_WORKSPACE" \
              --evidence "$dst" \
              | tee "$evidence_root/${run_id}.cap-annotation.json"
          }

          recover_evidence \
            "2026-09-22-56f2c65-gh3" \
            35720020334 \
            "benchmark-2026-09-22-56f2c65-gh3" \
            56f2c65cf938edce1de6f038148cf660eba9dd2b
          recover_evidence \
            "2026-09-23-1231af5-gh12" \
            35806610661 \
            "benchmark-2026-09-23-1231af5-gh12" \
            1231af5b6bdb6e525a303e2d79307d016f3bcc36
          recover_evidence \
            "2026-09-23-fce5cfa-gh16" \
            35815934646 \
            "benchmark-2026-09-23-fce5cfa-gh16" \
            fce5cfa731cbf735dca4200257d4c54e084aacc4
          recover_evidence \
            "2026-09-23-61f50c1-gh22" \
            35849683595 \
            "benchmark-2026-09-23-61f50c1-gh22" \
            61f50c1a8c1518f6d6abcb9b1468e4a9e0aa0610
          # Run #24 contains complete Proficiency attempts that the old validator
          # incorrectly returned to PENDING after reading a sanitized verification
          # field that intentionally omitted the terminal verdict. Re-run only
          # current deterministic validation over immutable archived attempts.
          recover_proficiency_workspace \
            "2026-09-25-3c20e44-gh24" \
            36132696324 \
            "benchmark-2026-09-25-3c20e44-gh24-llm-proficiency" \
            3c20e44444aa2b11a9ebbaf9a357b2658982e4b3

          # Older certified trial records predate scored-cap annotations. The
          # retained agent traces already contain the exact cap, stop reasons,
          # and output-token usage, so attach that evidence without inference or
          # changing result/fingerprint bytes. This must happen before hydration;
          # otherwise a scientifically identical record is rejected solely for
          # missing migration-era metadata.
          for run_id in \
            "2026-09-22-56f2c65-gh3" \
            "2026-09-23-1231af5-gh12" \
            "2026-09-23-fce5cfa-gh16" \
            "2026-09-23-61f50c1-gh22"
          do
            python benchmark/template/scripts/benchmark.py cache-annotate-caps \
              --source-repo "$GITHUB_WORKSPACE" \
              --evidence "$evidence_root/$run_id" \
              | tee "$evidence_root/$run_id.cap-annotation.json"
          done

          # Bind the reviewed Language Quality component judgments to the
          # exact retained paid evidence now present in benchmark/cache. This
          # performs no inference/provider call and fails closed if any reviewed
          # language/program/rubric Git input moved since adjudication.
          python benchmark/template/scripts/benchmark.py \
            cache-bind-language-quality-snapshot \
            --source-repo "$GITHUB_WORKSPACE" \
            | tee "$evidence_root/language-quality-snapshot-binding.json"

          # Classify the union of Git-tracked cache and every certifiable record
          # recovered from retained paid artifacts.
          set +e
          python benchmark/template/scripts/benchmark.py cache-impact \
            --source-repo "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/cache-impact-before.json" >/dev/null
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then exit "$rc"; fi
          cat "$RUNNER_TEMP/cache-impact-before.json"

          # The benchmark target itself must remain the original clean commit.
          # Copy recovered cache into the already initialized trusted workspace,
          # bind run.json to those exact bytes, save the legacy source records for
          # provenance, then restore the checkout before any certification step.
          rsync -a benchmark/cache/ "$GITHUB_WORKSPACE/.quidra-benchmark/cache/"
          rsync -a benchmark/cache/ "$recovered_cache/"
          # actions/checkout intentionally follows the latest develop rather than
          # pinning the event SHA. A test-only commit can land while an earlier
          # run is queued, so bind the workspace to the commit we actually
          # checked out. The final push step independently rechecks origin/develop
          # and fails closed when benchmark-scientific inputs moved.
          checkout_sha="$(git rev-parse HEAD)"
          python benchmark/template/scripts/benchmark.py refresh-cache-snapshot \
            --source-repo "$GITHUB_WORKSPACE" \
            --expected-commit "$checkout_sha"
          git restore --source=HEAD --staged --worktree -- \
            benchmark/cache benchmark/template/prompts
          git clean -fd -- benchmark/cache benchmark/template/prompts
          test -z "$(git status --porcelain=v1 -- benchmark/cache benchmark/template/prompts)"

      - name: Prepare, hydrate and checkpoint without provider calls
        run: |
          set -euo pipefail

          # This is the same deterministic prepare/hydrate path used immediately
          # before production. The provider is fake; no paid inference can occur.
          python benchmark/template/scripts/sandbox_launcher.py run \
            --source-repo "$GITHUB_WORKSPACE" \
            --image "$BENCHMARK_IMAGE" \
            --provider fake \
            -- python3 /quidra-benchmark/template/scripts/benchmark.py prepare

          cp "$GITHUB_WORKSPACE/.quidra-benchmark/results/cache_status.json" \
            "$RUNNER_TEMP/recertification-cache-status.json"

          python benchmark/template/scripts/benchmark.py partial-paid-import \
            --workspace "$GITHUB_WORKSPACE/.quidra-benchmark" \
            --store "$RUNNER_TEMP/benchmark-paid-state" \
            | tee "$RUNNER_TEMP/recertification-partial-paid-import.json"

          python benchmark/template/scripts/production_run.py budget-plan \
            --workspace "$GITHUB_WORKSPACE/.quidra-benchmark" \
            --model claude-sonnet-5 \
            --available-usd 150 \
            --safety-multiplier 1.25 \
            --smoke-reserve-usd 0 \
            --output "$RUNNER_TEMP/recertification-budget-plan.json" \
            > "$RUNNER_TEMP/recertification-budget-plan.stdout"

          python benchmark/template/scripts/benchmark.py checkpoint-cache \
            --source-repo "$GITHUB_WORKSPACE" \
            | tee "$RUNNER_TEMP/cache-recertify.json"

          # Migration provenance points back to the exact legacy source bytes.
          # Merge the recovered snapshot back after checkpointing. A current
          # checkpoint wins unless a migrated current record explicitly names
          # the recovered bytes as its provenance source; in that case the exact
          # source hash is mandatory and is restored verbatim.
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          recovered = Path(os.environ["RUNNER_TEMP"]) / "recovered-cache"
          current = Path("benchmark/cache")

          expected_sources = {}
          for path in current.rglob("*.json"):
              try:
                  row = json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  continue
              migration = row.get("migration") if isinstance(row, dict) else None
              if not isinstance(migration, dict):
                  continue
              source = str(migration.get("source_record") or "")
              digest = str(migration.get("source_record_sha256") or "")
              if source and digest:
                  expected_sources.setdefault(source, set()).add(digest)

          for source in sorted(recovered.rglob("*")):
              if not source.is_file():
                  continue
              rel = source.relative_to(recovered)
              destination = current / rel
              data = source.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              expected = expected_sources.get(rel.as_posix(), set())
              if destination.exists():
                  current_digest = hashlib.sha256(
                      destination.read_bytes()
                  ).hexdigest()
                  # Several retained migrations may name different historical
                  # byte generations at the same legacy source path. Keep any
                  # currently present generation that satisfies one retained
                  # provenance edge; otherwise restore the recovered generation
                  # when it satisfies one. Older unmatched records remain
                  # explicitly invalid/superseded rather than deleting history
                  # or forcing one mutable path to impersonate multiple hashes.
                  if current_digest in expected:
                      continue
                  if digest in expected:
                      destination.write_bytes(data)
                  elif expected:
                      raise SystemExit(
                          f"migration source hash mismatch for {rel}: "
                          f"expected one of {sorted(expected)}, recovered {digest}, "
                          f"current {current_digest}"
                      )
                  continue
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, destination)
          PY

      - name: Audit preserved Proficiency trials at trial granularity
        run: |
          set -euo pipefail
          evidence_root="$RUNNER_TEMP/legacy-evidence"
          python benchmark/template/scripts/audit_proficiency_legacy.py \
            --source-repo "$GITHUB_WORKSPACE" \
            --workspace "$GITHUB_WORKSPACE/.quidra-benchmark" \
            --evidence "2026-09-22-56f2c65-gh3=$evidence_root/2026-09-22-56f2c65-gh3" \
            --evidence "2026-09-23-1231af5-gh12=$evidence_root/2026-09-23-1231af5-gh12" \
            --evidence "2026-09-23-fce5cfa-gh16=$evidence_root/2026-09-23-fce5cfa-gh16" \
            --evidence "2026-09-23-61f50c1-gh22=$evidence_root/2026-09-23-61f50c1-gh22" \
            --evidence "2026-09-25-3c20e44-gh24=$evidence_root/2026-09-25-3c20e44-gh24" \
            --output benchmark/cache/proficiency-recertification-audit.json \
            > "$RUNNER_TEMP/proficiency-recertification-audit.stdout"
          cat benchmark/cache/proficiency-recertification-audit.json

      - name: Re-audit preserved cache after current-key checkpointing
        run: |
          set -euo pipefail
          set +e
          python benchmark/template/scripts/benchmark.py cache-impact \
            --source-repo "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/cache-impact-after.json" >/dev/null
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then exit "$rc"; fi
          cat "$RUNNER_TEMP/cache-impact-after.json"

      - name: Commit recertified cache locally for an exact next-run dry-run
        run: |
          set -euo pipefail
          python benchmark/template/scripts/benchmark.py discard-workspace \
            --source-repo "$GITHUB_WORKSPACE"
          git add -f benchmark/cache benchmark/template/prompts
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "benchmark: checkpoint recertified paid cache"
          fi
          test -z "$(git status --porcelain=v1)"

      - name: Prove a fresh next run gets ordinary current-cache HITs
        run: |
          set -euo pipefail
          short_sha="$(git rev-parse --short=7 HEAD)"
          python benchmark/template/scripts/benchmark.py init \
            --source-repo "$GITHUB_WORKSPACE" \
            --sandbox-mode container \
            --run-id "cache-next-run-dry-${short_sha}" \
            --provider anthropic-messages \
            --model claude-sonnet-5

          python benchmark/template/scripts/sandbox_launcher.py run \
            --source-repo "$GITHUB_WORKSPACE" \
            --image "$BENCHMARK_IMAGE" \
            --provider fake \
            -- python3 /quidra-benchmark/template/scripts/benchmark.py prepare

          cp "$GITHUB_WORKSPACE/.quidra-benchmark/results/cache_status.json" \
            "$RUNNER_TEMP/next-run-cache-status.json"

          # Re-import the exact same retained paid-call store into the fresh
          # next-run workspace. The final budget report must model what
          # production will actually do after its own partial-paid-import.
          python benchmark/template/scripts/benchmark.py partial-paid-import \
            --workspace "$GITHUB_WORKSPACE/.quidra-benchmark" \
            --store "$RUNNER_TEMP/benchmark-paid-state" \
            | tee "$RUNNER_TEMP/next-run-partial-paid-import.json"

          python benchmark/template/scripts/production_run.py budget-plan \
            --workspace "$GITHUB_WORKSPACE/.quidra-benchmark" \
            --model claude-sonnet-5 \
            --available-usd 150 \
            --safety-multiplier 1.25 \
            --smoke-reserve-usd 0 \
            --output "$RUNNER_TEMP/next-run-budget-plan.json" \
            > "$RUNNER_TEMP/next-run-budget-plan.stdout"
          cat "$RUNNER_TEMP/next-run-cache-status.json"
          cat "$RUNNER_TEMP/next-run-budget-plan.json"

      - name: Write recertification and next-run dry-run report
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          runner_temp = Path(os.environ["RUNNER_TEMP"])
          root = Path(".quidra-benchmark")
          first_status = json.loads(
              (runner_temp / "recertification-cache-status.json").read_text()
          )
          next_status = json.loads(
              (runner_temp / "next-run-cache-status.json").read_text()
          )
          before = json.loads(
              (runner_temp / "cache-impact-before.json").read_text()
          )
          after = json.loads(
              (runner_temp / "cache-impact-after.json").read_text()
          )
          budget = json.loads(
              (runner_temp / "next-run-budget-plan.json").read_text()
          )
          proficiency = json.loads(
              Path("benchmark/cache/proficiency-recertification-audit.json").read_text()
          )
          partial_paid = json.loads(
              (runner_temp / "next-run-partial-paid-import.json").read_text()
          )
          manifest = json.loads((root / "work/root/manifest.json").read_text())
          units = {str(row["id"]): row for row in manifest.get("work_units", [])}

          first_hits = first_status.get("hits", {})
          next_hits = next_status.get("hits", {})
          next_misses = next_status.get("misses", {})
          next_invalidated = next_status.get("invalidated", {})

          mode_class = {
              "scoped-input-projection": "A",
              "ecosystem-runner-rubric-v2-snapshot": "C",
              "language-quality-design-rubric-v1-snapshot": "C",
              "language-quality-reuse-audit-v1-projection": "C",
              "validator-recertification": "D",
              "micro-measure-input-projection": "C",
              "legacy-adversarial-cohort-to-language-shard": "C",
          }
          migrated_by_source = {
              str(row.get("source_fingerprint")): str(row.get("compatibility_mode"))
              for row in first_hits.values()
              if row.get("source_fingerprint") and row.get("compatibility_mode")
          }
          proficiency_by_source = {
              str(row.get("source_record")): row
              for row in proficiency.get("records", [])
          }

          legacy_classifications = []
          for entry in before.get("invalid", []):
              record = str(entry.get("record") or "")
              fingerprint = Path(record).stem
              uid = str(entry.get("work_unit_id") or "")
              evaluation = str(entry.get("evaluation") or "")
              mode = migrated_by_source.get(fingerprint)
              if mode:
                  classification = mode_class.get(mode, "D")
                  disposition = "recertified-current-cache"
                  reason = "current validator accepted compatibility migration"
              elif evaluation == "llm_proficiency":
                  audited = proficiency_by_source.get(record, {})
                  classification = str(audited.get("classification") or "E")
                  disposition = (
                      "current-mechanical-reverification-candidate"
                      if classification == "D"
                      else "paid-rerun-required"
                  )
                  reason = str(
                      audited.get("reason")
                      or "legacy trial contract could not be proved current-compatible"
                  )
              elif evaluation == "language_quality" and uid in next_hits:
                  classification = "C"
                  disposition = "recertified-current-cache"
                  reason = (
                      "preserved paid Language Quality evidence was independently "
                      "reprojected to the current fixed rubric and passed the "
                      "current validator"
                  )
              elif (
                  evaluation == "semantic_compression"
                  and uid.startswith("sc-metrics-hidden-coverage--part-2--")
              ):
                  classification = "E"
                  disposition = "paid-rerun-required"
                  reason = (
                      "legacy capability-coverage owner lacks the current complete "
                      "canonical-fragment verification fixture; current build/run/stdout "
                      "verification cannot be reconstructed safely from its score alone"
                  )
              elif (units.get(uid) or {}).get("execution_kind") == "command":
                  classification = "D"
                  disposition = "free-mechanical-remeasurement"
                  reason = "runner-owned command unit can be recomputed without provider calls"
              else:
                  classification = "E"
                  disposition = "paid-rerun-required"
                  reason = (
                      "no current compatibility migration proved semantic equivalence"
                  )
              legacy_classifications.append({
                  **entry,
                  "classification": classification,
                  "disposition": disposition,
                  "classification_reason": reason,
                  **({"compatibility_mode": mode} if mode else {}),
              })

          by_eval = {}
          for uid, unit in units.items():
              evaluation = str(unit.get("evaluation") or "")
              row = by_eval.setdefault(
                  evaluation, {"hits": 0, "misses": 0, "invalidated": 0}
              )
              row["hits"] += int(uid in next_hits)
              row["misses"] += int(uid in next_misses)
              row["invalidated"] += int(uid in next_invalidated)

          paid_units = [
              {
                  "work_unit_id": row["work_unit_id"],
                  "evaluation": row["evaluation"],
                  "assigned_languages": row.get("assigned_languages", []),
                  "worker_mode": row.get("worker_mode"),
                  "planned_calls_estimate": row.get("planned_calls_estimate"),
                  "estimated_uncached_usd": row.get("estimated_uncached_usd"),
              }
              for row in budget.get("units", [])
              if float(row.get("estimated_uncached_usd", 0) or 0) > 0
          ]

          def hit_ids(evaluation):
              return sorted(
                  uid for uid in next_hits
                  if (units.get(uid) or {}).get("evaluation") == evaluation
              )

          report = {
              "schema_version": 3,
              "dry_run_kind": (
                  "artifact-recovery-current-validator-checkpoint-then-fresh-"
                  "prepare-hydrate-budget-plan-no-provider"
              ),
              "historical_cache_before": {
                  "valid": before.get("valid", 0),
                  "invalid": len(before.get("invalid", [])),
                  "superseded": before.get("superseded_count", 0),
              },
              "historical_cache_after": {
                  "valid": after.get("valid", 0),
                  "invalid": len(after.get("invalid", [])),
                  "superseded": after.get("superseded_count", 0),
                  "note": (
                      "Legacy invalid records are retained as provenance. A successful "
                      "migration adds an ordinary current-key record rather than "
                      "rewriting or deleting its source."
                  ),
              },
              "legacy_invalid_record_count": len(before.get("invalid", [])),
              "legacy_invalid_record_classifications": legacy_classifications,
              "recertification_pass_cache": {
                  "hits": len(first_status.get("hits", {})),
                  "misses": len(first_status.get("misses", {})),
                  "invalidated": len(first_status.get("invalidated", {})),
              },
              "next_run_current_task_cache": {
                  "hits": len(next_hits),
                  "misses": len(next_misses),
                  "invalidated": len(next_invalidated),
                  "by_evaluation": by_eval,
              },
              "ecosystem_reused_units": len(hit_ids("ecosystem")),
              "ecosystem_reused_unit_ids": hit_ids("ecosystem"),
              "semantic_compression_reused_units": len(
                  hit_ids("semantic_compression")
              ),
              "semantic_compression_reused_unit_ids": hit_ids(
                  "semantic_compression"
              ),
              "llm_proficiency_reused_units": len(
                  hit_ids("llm_proficiency")
              ),
              "llm_proficiency_reused_unit_ids": hit_ids(
                  "llm_proficiency"
              ),
              "llm_proficiency_legacy_trial_audit": {
                  "source_records": proficiency.get("source_record_count", 0),
                  "source_trials": proficiency.get("source_trial_count", 0),
                  "category_D_candidate_trials": proficiency.get(
                      "category_D_candidate_trials", 0
                  ),
                  "category_E_trials": proficiency.get("category_E_trials", 0),
                  "hidden_feedback_detected_trials": proficiency.get(
                      "hidden_feedback_detected_trials", 0
                  ),
                  "current_certified_trial_count": proficiency.get(
                      "current_certified_trial_count", 0
                  ),
              },
              "next_run_misses": next_misses,
              "next_run_invalidated": next_invalidated,
              "paid_api_required_units": paid_units,
              "paid_api_required_unit_count": len(paid_units),
              "partial_paid_import": partial_paid,
              "provider_cost": {
                  "estimated_uncached_usd": budget.get("estimated_uncached_usd"),
                  "recommended_budget_usd": budget.get("recommended_budget_usd"),
                  "retry_ceiling_uncached_usd": budget.get(
                      "retry_ceiling_uncached_usd"
                  ),
                  "planned_paid_api_calls_estimate": budget.get(
                      "planned_paid_api_calls_estimate"
                  ),
                  "expected_paid_api_calls_upper_bound": budget.get(
                      "expected_paid_api_calls_upper_bound"
                  ),
              },
              "budget_plan": budget,
          }
          Path("benchmark/cache/recertification-report.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Amend report and push only after develop HEAD recheck
        run: |
          set -euo pipefail
          python benchmark/template/scripts/benchmark.py discard-workspace \
            --source-repo "$GITHUB_WORKSPACE"
          git add -f benchmark/cache benchmark/template/prompts
          if ! git diff --cached --quiet; then
            if [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]; then
              git -c user.name="github-actions[bot]" \
                  -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                  commit -m "benchmark: checkpoint recertified paid cache"
            else
              git -c user.name="github-actions[bot]" \
                  -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                  commit --amend --no-edit
            fi
          fi

          git fetch origin develop
          remote_head="$(git rev-parse origin/develop)"
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            # A concurrent documentation/test-only commit must not waste a
            # completed six-hour recertification. Reuse it only when every
            # scientific input that can affect cached benchmark meaning stayed
            # byte-identical; otherwise fail closed and let a fresh run start
            # from the newer develop commit.
            if ! git diff --quiet "$GITHUB_SHA" "$remote_head" -- \
              benchmark/template \
              benchmark/master_prompt.md \
              CMakeLists.txt project.toml quidra.manifest.json \
              src include \
              docs/spec docs/packages.md docs/development.md \
              tests/benchmark/quidra
            then
              echo "::error::develop moved and benchmark-scientific inputs changed; refusing stale recertification."
              exit 1
            fi
            echo "develop moved only outside benchmark-scientific inputs; rebasing checkpoint onto $remote_head"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rebase origin/develop
          fi
          if [ "$(git rev-parse HEAD)" = "$remote_head" ]; then
            echo "No cache/report changes passed current recertification."
            exit 0
          fi
          git push origin HEAD:develop
