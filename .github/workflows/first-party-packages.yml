name: first-party-packages

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - main

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Quidra
        uses: actions/checkout@v4
      - name: Check out vision
        uses: actions/checkout@v4
        with:
          repository: quidra-lang/vision
          ref: main
          path: packages/vision
      - name: Check out dnn
        uses: actions/checkout@v4
        with:
          repository: quidra-lang/dnn
          ref: main
          path: packages/dnn
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y llvm libcurl4-openssl-dev libpng-dev libjpeg-dev libtiff-dev libwebp-dev
      - name: Build Quidra
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel
      - name: Test vision against this Quidra
        run: bash packages/vision/tests/integration.sh "$GITHUB_WORKSPACE/build/quidra"
      - name: Test dnn against this Quidra
        run: bash packages/dnn/tests/integration.sh "$GITHUB_WORKSPACE/build/quidra"
