          previous-handoff: benchmark-${{ needs.prepare.outputs.run_id }}-recovery2-ecosystem
          handoff-name: benchmark-${{ needs.prepare.outputs.run_id }}-recovery2-llm-proficiency
          run-id: ${{ needs.prepare.outputs.run_id }}
          evaluated-sha: ${{ needs.prepare.outputs.evaluated_sha }}
          model: ${{ env.BENCHMARK_MODEL }}
          budget-usd: ${{ needs.prepare.outputs.budget_usd }}
          max-wall-seconds: "15000"

  finalize:
    name: finalize
    needs: [prepare, recover2-llm-proficiency]
    if: ${{ always() && !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.mode == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Attach branch at evaluated snapshot
        run: git checkout -B benchmark "$GITHUB_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download final Primary handoff
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: benchmark-${{ needs.prepare.outputs.run_id }}-recovery2-llm-proficiency
          path: ${{ runner.temp }}/benchmark-final-handoff

      - name: Restore trusted workspace guard
        env:
          EVALUATED_SHA: ${{ needs.prepare.outputs.evaluated_sha }}
          RUN_ID: ${{ needs.prepare.outputs.run_id }}
          WHOLE_BUDGET: ${{ needs.prepare.outputs.budget_usd }}
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/benchmark-budget-state.json"
          if [ -f "$RUNNER_TEMP/benchmark-final-handoff/workspace.tgz" ] \
             && [ -f "$RUNNER_TEMP/benchmark-final-handoff/budget-state.json" ]; then
            tar -xzf "$RUNNER_TEMP/benchmark-final-handoff/workspace.tgz" -C "$GITHUB_WORKSPACE"
            cp "$RUNNER_TEMP/benchmark-final-handoff/budget-state.json" "$state"
            python benchmark/template/scripts/benchmark.py restore-workspace-guard \
              --source-repo "$GITHUB_WORKSPACE" \
              --expected-commit "$EVALUATED_SHA"
          else
            echo "::warning::Final Actions handoff is unavailable; reconstructing from the evaluated snapshot plus certified cache."
            python benchmark/template/scripts/benchmark.py init \
              --source-repo "$GITHUB_WORKSPACE" \
              --sandbox-mode container \
              --run-id "$RUN_ID" \
              --provider anthropic-messages \
              --model "$BENCHMARK_MODEL"

            git fetch origin benchmark
            recovery="$RUNNER_TEMP/benchmark-final-cache-recovery"
            rm -rf "$recovery"
            mkdir -p "$recovery"
            git cat-file -e "origin/benchmark:benchmark/cache"
            git archive --format=tar origin/benchmark benchmark/cache | tar -xf - -C "$recovery"
            rm -rf .quidra-benchmark/cache
            cp -a "$recovery/benchmark/cache" .quidra-benchmark/cache
            python benchmark/template/scripts/benchmark.py refresh-cache-snapshot \
              --source-repo "$GITHUB_WORKSPACE" \
              --expected-commit "$EVALUATED_SHA"

            checkpoint="benchmark/checkpoints/$RUN_ID/budget-state.json"
            git cat-file -e "origin/benchmark:$checkpoint"
            git show "origin/benchmark:$checkpoint" > "$state"
            touch "$RUNNER_TEMP/benchmark-final-rebuilt"
          fi

          python - "$state" "$WHOLE_BUDGET" <<'PY'
          import json, sys
          from pathlib import Path
          state = json.loads(Path(sys.argv[1]).read_text())
          assert abs(float(state["limit_usd"]) - float(sys.argv[2])) < 1e-9
          PY

      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Build and verify the pinned ten-language image
        env:
          BENCHMARK_IMAGE: quidra-benchmark/runtime:production
        run: |
          python benchmark/template/runtime/check_pins.py
          python benchmark/template/scripts/sandbox_launcher.py build-image \
            --target toolchains --image "$BENCHMARK_IMAGE"
          python benchmark/template/scripts/sandbox_launcher.py doctor \
            --image "$BENCHMARK_IMAGE"

      - name: Aggregate and finalize all five Primaries
        id: finalize_run
        continue-on-error: true
        env:
          BENCHMARK_IMAGE: quidra-benchmark/runtime:production
        run: |
          if [ -f "$RUNNER_TEMP/benchmark-final-rebuilt" ]; then
            python benchmark/template/scripts/sandbox_launcher.py run \
              --source-repo "$GITHUB_WORKSPACE" \
              --image "$BENCHMARK_IMAGE" \
              --provider fake \
              -- python3 /quidra-benchmark/template/scripts/benchmark.py prepare
          fi
          python benchmark/template/scripts/sandbox_launcher.py run \
            --source-repo "$GITHUB_WORKSPACE" \
            --image "$BENCHMARK_IMAGE" \
            --provider fake \
            -- python3 /quidra-benchmark/template/scripts/benchmark.py advance
          python benchmark/template/scripts/sandbox_launcher.py run \
            --source-repo "$GITHUB_WORKSPACE" \
            --image "$BENCHMARK_IMAGE" \
            --provider fake \
            -- python3 /quidra-benchmark/template/scripts/benchmark.py finalize

      - name: Snapshot full workspace evidence
        if: ${{ always() }}
        run: |
          if [ -d .quidra-benchmark ]; then
            tar -czf "$RUNNER_TEMP/workspace-evidence.tgz" \
              --ignore-failed-read \
              -C .quidra-benchmark \
              run.json results raw prompts work/agents work/attempts work/audit \
              work/root/manifest.json work/root/ledger.json \
              work/root/plans work/root/commands \
              work/root/proficiency-verification \
              work/root/comparability_blinding.json \
              work/root/f20_runtime_facts.json 2>/dev/null || true
          fi

      - name: Final certified-cache checkpoint
        id: checkpoint
        if: ${{ always() }}
        continue-on-error: true
        env:
          EVALUATED_SHA: ${{ needs.prepare.outputs.evaluated_sha }}
          RUN_ID: ${{ needs.prepare.outputs.run_id }}
        run: |
          set -euo pipefail
          if [ ! -f .quidra-benchmark/work/root/ledger.json ]; then exit 0; fi
          python benchmark/template/scripts/benchmark.py checkpoint-cache \
            --source-repo "$GITHUB_WORKSPACE" \
            | tee "$RUNNER_TEMP/cache-checkpoint.json"

          checkpoint_dir="benchmark/checkpoints/$RUN_ID"
          mkdir -p "$checkpoint_dir"
          cp "$RUNNER_TEMP/benchmark-budget-state.json" "$checkpoint_dir/budget-state.json"
          python - "$checkpoint_dir/resume.json" "$EVALUATED_SHA" <<'PY'
          import json, sys
          from pathlib import Path
          path, sha = Path(sys.argv[1]), sys.argv[2]
          status_path = Path(".quidra-benchmark/results/primary_status.json")
          status = json.loads(status_path.read_text()) if status_path.is_file() else {}
          path.write_text(json.dumps({
              "schema_version": 1,
              "evaluated_sha": sha,
              "last_evaluation": "finalize",
              "primary_status": status.get("evaluations", {}),
          }, indent=2, sort_keys=True) + "\n")
          PY

          tar -czf "$RUNNER_TEMP/updated-cache.tgz" benchmark/cache
          tar -czf "$RUNNER_TEMP/updated-checkpoint.tgz" "$checkpoint_dir"
          git reset --hard
          git fetch origin benchmark
          unexpected="$(git diff --name-only "$EVALUATED_SHA"..origin/benchmark \
            | grep -Ev "^benchmark/cache/|^benchmark/checkpoints/$RUN_ID/" || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::benchmark branch moved outside certified cache/resume state:"
            echo "$unexpected"
            exit 1
          fi
          git checkout -B benchmark origin/benchmark
          rm -rf benchmark/cache "$checkpoint_dir"
          tar -xzf "$RUNNER_TEMP/updated-cache.tgz"
          tar -xzf "$RUNNER_TEMP/updated-checkpoint.tgz"
          git add -f benchmark/cache "$checkpoint_dir"
          if ! git diff --cached --quiet; then
            short="$(git rev-parse --short=7 "$EVALUATED_SHA")"
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "Checkpoint complete benchmark state for $short"
            git push origin HEAD:benchmark
          fi

      - name: Decide whether the run is publishable
        id: publishable
        if: ${{ always() }}
        run: |
          echo "value=false" >> "$GITHUB_OUTPUT"
          finalization=".quidra-benchmark/results/finalization.json"
          audit=".quidra-benchmark/results/completeness_audit.json"
          test -f "$finalization" || {
            echo "No finalization record; no formal result will be committed."
            exit 0
          }
          if python - "$finalization" "$audit" <<'PY'
          import json, sys
          from pathlib import Path
          finalization = json.loads(Path(sys.argv[1]).read_text())
          audit = (
              json.loads(Path(sys.argv[2]).read_text())
              if Path(sys.argv[2]).is_file()
              else {}
          )
          payload = {
              "formal_complete": finalization.get("formal_complete"),
              "required_incomplete_units": audit.get("required_incomplete_units", []),
              "rerun_agent_leaf_ids": audit.get("rerun_agent_leaf_ids", []),
              "rerun_machine_unit_ids": audit.get("rerun_machine_unit_ids", []),
          }
          print(json.dumps(payload, indent=2, sort_keys=True))
          if finalization.get("formal_complete") is not True:
              raise SystemExit(3)
          PY
          then
            echo "value=true" >> "$GITHUB_OUTPUT"
            echo "Every required leaf and all five Primary rankings are formally COMPLETE."
          else
            echo "Incomplete run: exact missing-leaf resume targets, certified cache and evidence are retained; no formal result will be committed."
          fi

      - name: Import only a complete formal result
        if: ${{ steps.publishable.outputs.value == 'true' }}
        env:
          RUN_ID: ${{ needs.prepare.outputs.run_id }}
        run: |
          python benchmark/template/scripts/benchmark.py post-run \
            --source-repo "$GITHUB_WORKSPACE"
          test -f "benchmark/$RUN_ID/import_manifest.json"

      - name: Push complete result to isolated benchmark branch
        if: ${{ steps.publishable.outputs.value == 'true' }}
        env:
          RUN_ID: ${{ needs.prepare.outputs.run_id }}
          EVALUATED_SHA: ${{ needs.prepare.outputs.evaluated_sha }}
        run: |
          set -euo pipefail
          git fetch origin benchmark
          test "$(git rev-parse origin/benchmark)" = "$(git rev-parse HEAD)" || {
            echo "::error::benchmark branch moved after final cache checkpoint."
            exit 1
          }
          git rm -r --ignore-unmatch "benchmark/checkpoints/$RUN_ID"
          git add -f "benchmark/$RUN_ID" benchmark/cache benchmark/template/prompts
          python - <<'PY'
          import json, os, subprocess
          run_id = os.environ["RUN_ID"]
          manifest = json.load(open(f"benchmark/{run_id}/import_manifest.json"))
          listed = set(manifest.get("retained_files_sha256", {}))
          staged = set(
              p[len(f"benchmark/{run_id}/"):] for p in subprocess.check_output(
                  ["git", "ls-files", "--cached", f"benchmark/{run_id}"], text=True
              ).split()
          )
          missing = sorted(listed - staged)
          assert not missing, f"retained files not staged: {missing[:10]}"
          PY
          short="$(git rev-parse --short=7 "$EVALUATED_SHA")"
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Add complete benchmark result for $short"
          git push origin HEAD:benchmark

      - name: Preserve final run evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ needs.prepare.outputs.run_id }}
          if-no-files-found: ignore
          retention-days: 30
          overwrite: true
          path: |
            ${{ runner.temp }}/workspace-evidence.tgz
            benchmark/${{ needs.prepare.outputs.run_id }}
            benchmark/cache
            benchmark/template/prompts
            ${{ runner.temp }}/benchmark-budget-state.json
            ${{ runner.temp }}/cache-checkpoint.json

      - name: Fail visibly when the five-Primary run is incomplete
        if: ${{ always() && (steps.finalize_run.outcome == 'failure' || steps.checkpoint.outcome == 'failure' || steps.publishable.outputs.value != 'true') }}
        run: |
          echo "::error::The benchmark did not produce five COMPLETE Primary evaluations. Completed work and evidence were preserved."
          exit 1
