            exit 1
          fi
          test -d "$RUN"

          export RUN REPO
          python - <<'PY'
          from pathlib import Path
          import json
          import os
          import subprocess

          root = Path(os.environ["RUN"])
          source = Path(os.environ["REPO"]).resolve()
          run = json.loads((root / "run.json").read_text())
