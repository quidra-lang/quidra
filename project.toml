# Quidra project metadata - the single source of truth.
#
# Every value below is authored here exactly once. Nothing else in this
# repository may declare one of these values independently:
# `tests/metadata_ssot_tests.py` fails the build when it finds a second
# declaration, and `scripts/sync_metadata.py` regenerates every derived file.
#
# Derived from this file:
#   CMakeLists.txt                 reads [project] version before project()
#   include/quidra/project.hpp     generated at configure time
#   quidra.manifest.json           regenerated by scripts/sync_metadata.py
#
# Benchmark metadata deliberately lives elsewhere. `benchmark/template/` is
# copied whole into the measurement sandbox and is immutable during a frozen
# measurement window, so it owns its own metadata in
# `benchmark/template/config/benchmark_metadata.json`.
#
# Only the TOML subset described in `scripts/toml_subset.py` is accepted here.
# `src/toml_subset.cpp` reads the same subset when the compiler loads a package's
# own project.toml, so one grammar serves both readers.

[project]
name = "Quidra"
cli = "quidra"
extension = ".qui"
version = "0.2.0"
language_version = "0.1"
tagline = "Programming with maximum meaning per token."

# Format versions, deliberately independent of [project] version. A value here
# changes only when its own format changes, so Quidra 0.4.0 may still ship
# abi = 1 and ir = 2.
[compat]
abi = 1
ir = 1
package_schema = 1

[repos]
core = "https://github.com/quidra-lang/quidra"
vision = "https://github.com/quidra-lang/vision"
dnn = "https://github.com/quidra-lang/dnn"

# `id` is the canonical machine-readable backend identifier and is the only
# spelling used in manifests, package metadata and machine-readable output.
# `display` is for humans and is the only spelling printed by the CLI.
[[backends]]
id = "cpu"
display = "CPU"
kind = "native"

[[backends]]
id = "cuda"
display = "NVIDIA"
kind = "gpu"

[[backends]]
id = "hip"
display = "AMD"
kind = "gpu"

[[backends]]
id = "metal"
display = "Metal"
kind = "gpu"

[platforms]
os = ["Linux", "macOS", "Windows"]
targets = ["linux-x86_64", "linux-arm64", "macos-arm64", "macos-x86_64", "windows-x86_64", "windows-arm64"]

[dependencies]
llvm_minimum = 15
clang_minimum = 15
cmake_minimum = "3.20"
cxx_standard = 20
