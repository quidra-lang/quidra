name: apply-image-dtype-patch

on:
  push:
    branches:
      - chatgpt/image-dtypes-20260917
    paths:
      - tools/apply_image_dtype_checker.py
      - .github/workflows/apply-image-dtype-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply checker patch
        run: python3 tools/apply_image_dtype_checker.py
      - name: Check patch
        run: git diff --check
      - name: Commit generated edits
        run: |
          git config user.name "quidra-ci"
          git config user.email "actions@users.noreply.github.com"
          git add src/checker.cpp tests/stdlib_tests.sh
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "feat: add image dtype-aware static typing"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
