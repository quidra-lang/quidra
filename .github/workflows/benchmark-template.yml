name: benchmark-template

on:
  push:
    branches: [develop]
    paths:
      - "benchmark/master_prompt.md"
      - "benchmark/README.md"
      - "benchmark/template/**"
      - "tests/benchmark_isolation_tests.py"
      - "tests/benchmark_cache_tests.py"
      - "tests/benchmark_adversarial_tests.py"
      - "tests/benchmark_semantic_compression_tests.py"
      - "benchmark/cache/**"
      - ".github/workflows/benchmark-template.yml"
      - ".github/workflows/benchmark-production.yml"
      - ".github/actions/benchmark-primary/**"
  pull_request:
    paths:
      - "benchmark/master_prompt.md"
      - "benchmark/README.md"
      - "benchmark/template/**"
      - "tests/benchmark_isolation_tests.py"
      - "tests/benchmark_cache_tests.py"
      - "tests/benchmark_adversarial_tests.py"
      - "tests/benchmark_semantic_compression_tests.py"
      - "benchmark/cache/**"
      - ".github/workflows/benchmark-template.yml"
      - ".github/workflows/benchmark-production.yml"
      - ".github/actions/benchmark-primary/**"

concurrency:
  group: benchmark-template-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Parse and verify benchmark workflow structure
        run: |
          ruby - <<'RUBY'
          require "yaml"
          workflow = YAML.load_file(".github/workflows/benchmark-production.yml", aliases: true)
          YAML.load_file(".github/actions/benchmark-primary/action.yml", aliases: true)
          jobs = workflow.fetch("jobs")
          expected_needs = {
            "semantic-compression" => ["prepare"],
            "llm-learnability" => ["prepare", "semantic-compression"],
            "language-quality" => ["prepare", "llm-learnability"],
            "ecosystem" => ["prepare", "language-quality"],
            "llm-proficiency" => ["prepare", "ecosystem"],
            "finalize" => [
              "prepare", "semantic-compression", "llm-learnability",
              "language-quality", "ecosystem", "llm-proficiency"
            ],
          }
          expected_needs.each do |name, expected|
            actual = Array(jobs.fetch(name)["needs"])
            raise "#{name}: needs=#{actual.inspect}, expected=#{expected.inspect}" unless actual == expected
          end

          expression = "$" + "{{ needs.prepare.outputs.run_id }}"
          base = "benchmark-" + expression
          chain = [
            ["semantic-compression", nil, "#{base}-semantic-compression"],
            ["llm-learnability", "#{base}-semantic-compression", "#{base}-llm-learnability"],
            ["language-quality", "#{base}-llm-learnability", "#{base}-language-quality"],
            ["ecosystem", "#{base}-language-quality", "#{base}-ecosystem"],
            ["llm-proficiency", "#{base}-ecosystem", "#{base}-llm-proficiency"],
          ]
          chain.each do |name, previous, handoff|
            step = jobs.fetch(name).fetch("steps").find do |candidate|
              candidate["uses"] == "./.github/actions/benchmark-primary"
            end
            raise "#{name}: benchmark-primary step missing" unless step
            inputs = step.fetch("with")
            raise "#{name}: handoff mismatch" unless inputs["handoff-name"] == handoff
            if previous
              raise "#{name}: previous handoff mismatch" unless inputs["previous-handoff"] == previous
            else
              raise "#{name}: unexpected previous handoff" if inputs.key?("previous-handoff")
            end
          end

          readme = File.read("benchmark/README.md").gsub(/\s+/, " ")
          order = "Semantic Compression → LLM Learnability → Language Quality → Ecosystem → LLM Proficiency"
          raise "README five-Primary order drifted from workflow" unless readme.include?(order)
          RUBY

      - name: Validate template and CLI
        run: |
          python -m py_compile benchmark/template/scripts/benchmark.py
          python -m py_compile benchmark/template/scripts/micro_measure.py
          python -m py_compile benchmark/template/scripts/adversarial_measure.py
          python -m py_compile benchmark/template/scripts/inference_gateway.py
          python -m py_compile benchmark/template/scripts/gateway_client.py
          python -m py_compile benchmark/template/scripts/sandbox_agent.py
          python -m py_compile benchmark/template/scripts/sandbox_launcher.py
          python -m py_compile benchmark/template/scripts/synthetic_run.py
          python -m py_compile benchmark/template/scripts/production_run.py
          python -m py_compile benchmark/template/runtime/verify_toolchains.py
          bash -n benchmark/template/runtime/install_toolchains.sh
          python benchmark/template/scripts/check_metadata.py
          python benchmark/template/scripts/micro_measure.py --help >/dev/null
          python benchmark/template/scripts/adversarial_measure.py --help >/dev/null
          python -m json.tool benchmark/template/config/benchmark_metadata.json >/dev/null
          python -m json.tool benchmark/template/config/primary.json >/dev/null
          python -m json.tool benchmark/template/config/evaluation_requirements.json >/dev/null
          python -m json.tool benchmark/template/config/work_plan_templates.json >/dev/null
          python -m json.tool benchmark/template/config/aggregation.json >/dev/null
          python -m json.tool benchmark/template/config/semantic_compression_comparability.json >/dev/null
          python -m json.tool benchmark/template/config/inference_gateway.json >/dev/null
          python -m json.tool benchmark/template/config/sandbox_agent.json >/dev/null
          python -m json.tool benchmark/template/config/cache_policy.json >/dev/null
          python -m json.tool benchmark/template/runtime/toolchains.json >/dev/null
          python -m json.tool benchmark/template/reuse/catalog.json >/dev/null
          python benchmark/template/scripts/benchmark.py --help >/dev/null
          python benchmark/template/scripts/inference_gateway.py --help >/dev/null
          python benchmark/template/scripts/gateway_client.py --help >/dev/null
          python benchmark/template/scripts/sandbox_agent.py --help >/dev/null
          python benchmark/template/scripts/sandbox_launcher.py --help >/dev/null
          python benchmark/template/scripts/sandbox_launcher.py contract >/dev/null

          python - <<'PY'
          from pathlib import Path
          import importlib.util
          import json
          import tempfile

          spec = importlib.util.spec_from_file_location(
              "benchmark_cli", "benchmark/template/scripts/benchmark.py"
          )
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          root = Path("benchmark/template")
          required = [
              root / "methodology" / "worker_core.md",
              root / "methodology" / "common.md",
              root / "methodology" / "execution_policy.md",
              root / "methodology" / "orchestration.md",
              root / "methodology" / "semantic_compression.md",
              root / "methodology" / "llm_learnability.md",
              root / "methodology" / "language_quality.md",
              root / "methodology" / "ecosystem.md",
              root / "methodology" / "llm_proficiency.md",
              root / "config" / "aggregation.json",
              root / "config" / "work_plan_templates.json",
              root / "config" / "quidra_representation_schema.json",
              root / "config" / "semantic_compression_comparability.json",
              root / "programs" / "python" / "micro" / "mb01.py",
              root / "programs" / "python" / "micro" / "mb00.py",
              root / "fixtures" / "micro" / "reference",
              root / "validators" / "micro" / "check_micro.py",
              root / "methodology-assets" / "semantic_compression" / "capability_universe.json",
              root / "methodology-assets" / "semantic_compression" / "semantic_site_matrix.json",
              root / "methodology-assets" / "llm_proficiency" / "workloads.json",
          ]
          missing = [str(path) for path in required if not path.exists()]
          assert not missing, missing

          catalog = json.loads((root / "reuse" / "catalog.json").read_text())
          module.validate_reuse_catalog(catalog)
          assert catalog["schema_version"] == 3
          assert len(catalog["artifacts"]) >= 20
          assert not any(
              "source_run_id" in a
              or "source_run_relative_path" in a
              or "validation_summary" in a
              for a in catalog["artifacts"]
          )
          assert not any(
              "expected_git_object_sha1" in a
              for a in catalog["artifacts"]
          )
          comparison_slugs = {
              "python", "cpp", "rust", "go", "java",
              "typescript", "kotlin", "swift", "zig",
          }
          for slug in comparison_slugs:
              assert (root / "programs" / slug / "micro" / {
                  "python":"mb00.py","cpp":"mb00.cpp","rust":"mb00.rs",
                  "go":"mb00.go","java":"mb00.java","typescript":"mb00.ts",
                  "kotlin":"mb00.kt","swift":"mb00.swift","zig":"mb00.zig",
              }[slug]).is_file(), slug
          micro_tree_destinations = {
              a["destination"] for a in catalog["artifacts"]
              if a.get("kind") == "tree" and a.get("workload") == "micro"
          }
          assert {
              f"programs/{slug}/micro" for slug in comparison_slugs
          } <= micro_tree_destinations
          assert "programs/quidra/micro" not in micro_tree_destinations
          broken = json.loads(json.dumps(catalog))
          broken["artifacts"][1]["id"] = broken["artifacts"][0]["id"]
          try:
              module.validate_reuse_catalog(broken)
          except module.BenchmarkError:
              pass
          else:
              raise AssertionError("duplicate reusable artifact IDs must be rejected")

          quidra_reuse = json.loads(json.dumps(catalog))
          quidra_reuse["artifacts"].append({
              "id": "forbidden-quidra-program",
              "kind": "tree",
              "destination": "programs/quidra/micro",
              "language": "Quidra",
              "workload": "micro",
              "validated_toolchain": None,
              "reuse_dependencies": [],
          })
          try:
              module.validate_reuse_catalog(quidra_reuse)
          except module.BenchmarkError:
              pass
          else:
              raise AssertionError("Quidra program reuse must be rejected")

          master = Path("benchmark/master_prompt.md").read_text()
          assert "deterministic-plan" in master
          assert "benchmark.py prepare" in master
          assert "Past run directories" in master
          assert str(module.CANONICAL_WORKSPACE) == "/quidra-benchmark"
          assert str(module.HOST_WORKSPACE_RELATIVE) == ".quidra-benchmark"
          assert module.HOST_SENTINEL_NAME == "quidra-benchmark-host.json"
          assert "/.quidra-benchmark/" in Path(".gitignore").read_text()
          primary_cfg = json.loads((root / "config" / "primary.json").read_text())
          assert primary_cfg["workspace_root"] == "/quidra-benchmark"
          sample = "read /quidra-benchmark/repo only"
          assert module.render_workspace_paths(sample, Path("/tmp/host-a")) == sample
          assert module.render_workspace_paths(sample, Path("/tmp/host-b")) == sample
          assert module.render_workspace_paths(
              "read ./.quidra-benchmark/repo only", Path("/Users/example/project")
          ) == sample
          assert module.render_workspace_paths(
              "read /tmp/host-a/repo only", Path("/tmp/host-a")
          ) == sample
          assert module.render_workspace_paths(
              "read /tmp/host-b/repo only", Path("/tmp/host-b")
          ) == sample
          assert module.privacy_match_is_safe(
              "host_temp_path", "/quidra-benchmark/repo", Path("/quidra-benchmark")
          )
          assert not module.privacy_match_is_safe(
              "unix_home", "/Users/example/", Path("/Users/example/project/.quidra-benchmark")
          )
          assert len(master) < 20_000

          # Semantic support adjudication must carry the whole canonical record,
          # not only a level. Otherwise comparability falls back to stale shard
          # prose and can reject a correction that was already made.
          full = {
              "level": "FULL", "fragment": "x()", "partial_reasons": [],
              "none_reason": None, "justification": "all numbered requirements",
              "citation": "frozen docs",
          }
          partial = {
              "level": "PARTIAL", "fragment": "wrapper(x)", "partial_reasons": ["P-a"],
              "none_reason": None, "justification": "standard substitution",
              "citation": "standard library docs",
          }
          none = {
              "level": "NONE", "fragment": None, "partial_reasons": [],
              "none_reason": "N-2", "justification": "requires external build",
              "citation": "frozen toolchain contract",
          }
          assert module.sc_adjudicated_record(full)["level"] == "FULL"
          assert module.sc_adjudicated_record(partial)["partial_reasons"] == ["P-a"]
          assert module.sc_adjudicated_record(none)["none_reason"] == "N-2"
          assert module.sc_adjudicated_record({"level": "PARTIAL"}) is None

          by_language = {"Python": {"F08.P1": {
              "support": "NONE", "rationale": "stale", "fragment": "stale()"
          }}}
          owner_rows = {"Python": {"F08.P1": {"support": "NONE"}}}
          owner = {
              "fields": ["support"], "levels": {"FULL":1.0,"PARTIAL":0.5,"NONE":0.0}
          }
          module.sc_reconcile_support(
              by_language, owner_rows, owner,
              {"F08.P1": {"Python": partial}},
          )
          row = by_language["Python"]["F08.P1"]
          assert row["support"] == "PARTIAL" and row["fragment"] == "wrapper(x)"
          assert row["support_reason_codes"] == ["P-a"]
          assert row["support_adjudication"]["justification"] == "standard substitution"
          assert row["support_source"] == "cohort_adjudication_or_repair"
          assert "rationale" not in row

          with tempfile.TemporaryDirectory() as repair_td:
              repair_root = Path(repair_td)
              (repair_root / "work/root").mkdir(parents=True)
              matrix_path = (
                  repair_root / "template/methodology-assets/semantic_compression"
                  / "semantic_site_matrix.json"
              )
              matrix_path.parent.mkdir(parents=True)
              module.json_dump(matrix_path, {
                  "schema_version": 1,
                  "probes": [{
                      "probe_id": "F10.P1",
                      "family": "10. synthetic conversion family",
                  }],
              })
              module.json_dump(
                  matrix_path.parent / "capability_universe.json",
                  module.json_load(
                      root / "methodology-assets/semantic_compression/capability_universe.json"
                  ),
              )
              module.json_dump(
                  repair_root / "template/config/benchmark_metadata.json",
                  module.json_load(root / "config/benchmark_metadata.json"),
              )
              module.json_dump(
                  repair_root / module.COMPARABILITY_BLINDING_RELATIVE,
                  {"schema_version":1,"labels":{"Python":"E"}},
              )
              module.json_dump(
                  repair_root / module.COMPARABILITY_SAMPLE_RELATIVE,
                  {
                      "schema_version":1,
                      "probes":[{
                          "probe_id":"F10.P1",
                          "annotations":[{
                              "label":"E",
                              "support":"PARTIAL",
                              "fragment":"wrapper(x)",
                          }],
                      }],
                  },
              )
              repair_partial = {
                  "level": "PARTIAL",
                  "fragment": "wrapper(x)",
                  "partial_reasons": ["P-b"],
                  "none_reason": None,
                  "justification": "synthetic repair exercises a non-R9 partial reason",
                  "citation": "frozen synthetic evidence",
              }
              result = {
                  "evidence": {
                      "gate_result": {
                          "affected_pairs_requiring_revalidation": [
                              {"probe_id":"F10.P1","label":"E"}
                          ]
                      },
                      "repair_directives": [{
                          "probe_id":"F10.P1","label":"E","record":repair_partial
                      }],
                  }
              }
              assert module.persist_comparability_repairs(repair_root, result) == 1
              assert module.persist_comparability_repairs(repair_root, result) == 0
              repairs = module.sc_comparability_repairs(repair_root)
              assert repairs["F10.P1"]["Python"]["level"] == "PARTIAL"
              # This isolated fixture has no cohort-adjudication record, so the
              # validated pair-specific repair must still become authoritative.
              merged = module.sc_adjudicated_annotations(repair_root)
              assert merged["F10.P1"]["Python"]["fragment"] == "wrapper(x)"
              levels = module.sc_adjudicated_levels(repair_root)
              assert levels["F10.P1"]["Python"] == "PARTIAL"

          lq = (root / "methodology" / "language_quality.md").read_text()
          assert "3 unscored warm-up runs" not in lq
          assert "all 10 raw scored measurements" not in lq
          assert "all 10 individual scored measurements" not in lq
          assert "W = timing.warmups_per_cell" in lq
          assert "R = timing.measured_runs_per_cell" in lq
          ecosystem = (root / "methodology" / "ecosystem.md").read_text()
          assert "previous published run" not in ecosystem
          assert "must not be a threshold, direct score" in ecosystem

          forbidden_legacy = (
              "quidra_interpreter",
              "Quidra Interpreter",
              "Quidra interpreter",
              "quidra_mode_rule",
              "Startup / REPL",
              "Compiler / Interpreter Robustness",
              "compiler_interpreter_robustness",
          )
          text_files = [
              Path("benchmark/master_prompt.md"),
              *[
                  p for p in root.rglob("*")
                  if p.is_file() and p.suffix in {".md", ".json", ".py"}
              ],
          ]
          for path in text_files:
              text = path.read_text(errors="ignore")
              for token in forbidden_legacy:
                  assert token not in text, (path, token)

          forbidden_history = (
              "DEFECT CORRECTED",
              "Remediation changelog",
              "previous value",
          )
          historical_run_id = __import__("re").compile(
              r"\b20\d{2}-\d{2}-\d{2}-[0-9a-f]{7,}(?:\(latest\))?\b"
          )
          methodology_files = [
              p for p in root.rglob("*")
              if p.is_file() and p.suffix in {".md", ".json"}
          ]
          for path in methodology_files:
              text = path.read_text(errors="ignore")
              for token in forbidden_history:
                  assert token not in text, (path, token)
              assert historical_run_id.search(text) is None, path

          micro_spec = importlib.util.spec_from_file_location(
              "micro_measure", "benchmark/template/scripts/micro_measure.py"
          )
          micro = importlib.util.module_from_spec(micro_spec)
          micro_spec.loader.exec_module(micro)

          with tempfile.TemporaryDirectory() as td:
              test_root = Path(td)
              (test_root / "template" / "config").mkdir(parents=True)
              (test_root / "template" / "config" / "quidra_representation_schema.json").write_text(
                  (root / "config" / "quidra_representation_schema.json").read_text()
              )
              (test_root / "repo" / "docs" / "spec").mkdir(parents=True)
              (test_root / "repo" / "docs" / "spec" / "language.md").write_text(
                  "current synthetic Quidra docs\n"
              )
              (test_root / "run.json").write_text(json.dumps({
                  "evaluated": {"commit_sha": "abc123"}
              }))
              valid_representation = {
                  "schema_version": 1,
                  "evaluated_commit_sha": "abc123",
                  "numeric_arrays": {"choice": "current-docs"},
                  "string_buffer": {"choice": "current-docs"},
                  "file_io": {"choice": "current-docs"},
                  "collections": {"choice": "current-docs"},
                  "monotonic_clock": {"choice": "current-docs"},
                  "runtime_checks": {"choice": "current-docs"},
                  "documentation_evidence": ["repo/docs/spec/language.md#current"],
              }
              rep = test_root / "quidra_representation.json"
              rep.write_text(json.dumps(valid_representation))
              assert micro.validate_quidra_representation(
                  test_root, rep
              )["evaluated_commit_sha"] == "abc123"

              bad = dict(valid_representation)
              bad["evaluated_commit_sha"] = "different"
              rep.write_text(json.dumps(bad))
              try:
                  micro.validate_quidra_representation(test_root, rep)
              except micro.MeasureError:
                  pass
              else:
                  raise AssertionError("representation commit mismatch must fail")

              bad = dict(valid_representation)
              bad["documentation_evidence"] = []
              rep.write_text(json.dumps(bad))
              try:
                  micro.validate_quidra_representation(test_root, rep)
              except micro.MeasureError:
                  pass
              else:
                  raise AssertionError("representation evidence omission must fail")

          original_wait = micro.wait_for_host_window
          try:
              micro.wait_for_host_window = lambda: (False, [9.0])
              calls = []
              host_checks = []
              unresolved = micro.run_host_gated_batches(
                  ["a", "b"], "synthetic", calls.append, host_checks
              )
              assert unresolved == {"a", "b"}
              assert calls == []
              assert sum(
                  1 for row in host_checks
                  if row.get("na_reason") == "host_contention_unresolved"
              ) == 2
          finally:
              micro.wait_for_host_window = original_wait
          PY

      - name: Report certified-cache impact without paid work
        run: |
          set +e
          python benchmark/template/scripts/benchmark.py cache-impact \
            --source-repo "$GITHUB_WORKSPACE" | tee "$RUNNER_TEMP/cache-impact.json"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then exit "$rc"; fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          summary = json.loads(Path(os.environ["RUNNER_TEMP"], "cache-impact.json").read_text())
          print(json.dumps({
              "valid": int(summary.get("valid", 0) or 0),
              "invalid": len(summary.get("invalid", [])),
              "invalid_by_evaluation": summary.get("invalid_by_evaluation", {}),
          }, indent=2, sort_keys=True))
          PY

      - name: Verify self-contained template bootstrap
        run: |
          python - <<'PY'
          from pathlib import Path
          import importlib.util
          import tempfile

          spec = importlib.util.spec_from_file_location(
              "benchmark_cli", "benchmark/template/scripts/benchmark.py"
          )
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          source = Path.cwd()
          with tempfile.TemporaryDirectory() as td:
              dest = Path(td) / "template"
              module.copy_tracked_tree(source, "benchmark/template", dest)
              records = module.materialize_reuse_catalog(source, dest)
              assert len(records) >= 20
              mat = module.json_load(dest / "reuse" / "materialized.json")
              assert mat["schema_version"] == 3
              assert not any("source_run_id" in a for a in mat["artifacts"])
              assert all(
                  len(a.get("content_git_object_sha1", "")) == 40
                  for a in mat["artifacts"]
              )
              assert (dest / "programs/python/micro/mb01.py").is_file()
              assert (dest / "programs/python/micro/mb00.py").is_file()
              assert (dest / "config/quidra_representation_schema.json").is_file()
              assert not (dest / "programs/quidra/micro").exists()
              assert (dest / "fixtures/micro/reference").is_dir()
              assert (dest / "validators/micro/check_micro.py").is_file()
          PY

      - name: Exercise deterministic runner
        env:
          QUIDRA_BENCHMARK_WORKER_GATEWAY_ATTESTED: packet-gateway-v1
          QUIDRA_BENCHMARK_PACKET_WORKER_LOCAL_TOOLS: disabled
          QUIDRA_BENCHMARK_SANDBOX_AGENT_LAUNCHER_ATTESTED: inside-sandbox-v1
          QUIDRA_BENCHMARK_SYNTHETIC_COMMANDS: "1"
        run: |
          TMP="$PWD/.benchmark-template-test"
          rm -rf "$TMP"
          mkdir -p             "$TMP/work/root" "$TMP/work/agents" "$TMP/raw" "$TMP/results"             "$TMP/prompts/by-hash" "$TMP/prompts/components/by-hash" "$TMP/prompts/manifests"             "$TMP/home" "$TMP/tmp" "$TMP/repo/docs"

          python - <<'PY'
          from pathlib import Path
          import importlib.util
          import json

          root = Path(".benchmark-template-test")
          spec = importlib.util.spec_from_file_location(
              "benchmark_cli", "benchmark/template/scripts/benchmark.py"
          )
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          module.copy_tracked_tree(Path.cwd(), "benchmark/template", root / "template")
          module.materialize_reuse_catalog(Path.cwd(), root / "template")
          master = Path("benchmark/master_prompt.md").read_bytes()
          master_hash = module.sha256_bytes(master)
          (root / "prompts" / "by-hash" / f"{master_hash}.md").write_bytes(master)
          (root / "run.json").write_text(json.dumps({
              "schema_version": 1,
              "run_id": "synthetic-e2e",
              "workspace_root": "/quidra-benchmark",
              "evaluated": {"commit_sha": "synthetic"},
              "master_prompt_sha256": master_hash,
              "primary_config_sha256": module.sha256_file(
                  root / "template" / "config" / "primary.json"
              ),
              "template_tree_sha256": module.sha256_tree(root / "template"),
