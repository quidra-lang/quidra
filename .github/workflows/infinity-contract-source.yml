          tensor<real16> invalid = infinite - infinite
          QUI
          fails tensor_nan16 NONFINITE_RESULT 'tensor<real16> subtraction produced NaN' '2:26' '''.rstrip())])
          edit('tests/complex_tests.sh',[
          ("fails overflow REAL_OVERFLOW 'com32 multiplication overflow' '3:7'",'''[[ "$("$QUIDRA" run "$TMP/overflow.qui")" == "inf+0.0i" ]]
          cat > "$TMP/nan.qui" <<'QUI'
