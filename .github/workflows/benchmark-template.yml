      - name: Semantic Compression reconciliation contract
        run: python tests/benchmark_semantic_compression_tests.py

      - name: Mechanical adversarial scorer replays the frozen decision list
        run: python tests/benchmark_adversarial_tests.py

      - name: Attestation strings alone must not pass preflight
        run: |
          # The whole point of the rewritten preflight is that naming an
          # isolation mode is not the same as being isolated. This step sets every
          # attestation the launcher would set, on a plainly unisolated runner,
          # and requires preflight to refuse anyway.
          sudo mkdir -p /quidra-benchmark
          sudo chown "$(id -u):$(id -g)" /quidra-benchmark
          python - <<'PY'
          from pathlib import Path
          import importlib.util
          import json
          import shutil

          spec = importlib.util.spec_from_file_location(
              "benchmark_cli", "benchmark/template/scripts/benchmark.py"
          )
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          root = Path("/quidra-benchmark")
          for directory in (
              "work/root", "work/agents", "raw", "results", "prompts/by-hash",
              "prompts/components/by-hash", "prompts/manifests", "home", "tmp",
              "gateway", "repo",
          ):
              (root / directory).mkdir(parents=True, exist_ok=True)
          shutil.copytree(
              "benchmark/template", root / "template",
              ignore=shutil.ignore_patterns("__pycache__", "*.pyc"),
              dirs_exist_ok=True,
          )
          master = Path("benchmark/master_prompt.md").read_bytes()
          master_hash = module.sha256_bytes(master)
          (root / "prompts" / "by-hash" / f"{master_hash}.md").write_bytes(master)
          (root / "run.json").write_text(json.dumps({
              "schema_version": 1,
              "run_id": "unisolated-negative-check",
              "workspace_root": "/quidra-benchmark",
              "sandbox_mode": "container",
              "evaluated": {"commit_sha": "synthetic"},
              "master_prompt_sha256": master_hash,
              "primary_config_sha256": module.sha256_file(
                  root / "template" / "config" / "primary.json"
              ),
              "template_tree_sha256": module.sha256_tree(root / "template"),
          }, indent=2) + "\n")
          PY

          set +e
          env \
            QUIDRA_BENCHMARK_SANDBOX_ATTESTED=container \
            QUIDRA_BENCHMARK_SANDBOX_ROOT=/quidra-benchmark \
            QUIDRA_BENCHMARK_WORKER_GATEWAY_ATTESTED=packet-gateway-v1 \
            QUIDRA_BENCHMARK_PACKET_WORKER_LOCAL_TOOLS=disabled \
            QUIDRA_BENCHMARK_SANDBOX_AGENT_LAUNCHER_ATTESTED=inside-sandbox-v1 \
            QUIDRA_BENCHMARK_INFERENCE_SOCKET=/quidra-benchmark/gateway/inference.sock \
            HOME=/quidra-benchmark/home TMPDIR=/quidra-benchmark/tmp PWD=/quidra-benchmark \
            python benchmark/template/scripts/benchmark.py preflight \
              --workspace /quidra-benchmark > "$RUNNER_TEMP/preflight-negative.json"
          RC=$?
          set -e
          if [ "$RC" -eq 0 ]; then
            echo "preflight passed on an unisolated host with forged attestations" >&2
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("/quidra-benchmark/results/preflight.json").read_text())
          problems = set(result["problems"])
          assert not result["ok"], result
          # Each of these is an observation of the running process, not a string
          # anyone can set, so none of them can be satisfied by attestation alone.
          for required in (
              "launcher_contract_missing",
              "inference_gateway_socket_missing",
              "evaluated_repo_snapshot_must_be_mounted_read_only",
              "frozen_template_must_be_mounted_read_only",
          ):
              assert required in problems, (required, sorted(problems))
          assert any(p.startswith("sandbox_network_not_isolated:") for p in problems), problems
          print(json.dumps(sorted(problems), indent=2))
          PY
          sudo rm -rf /quidra-benchmark

      - name: Exercise full five-Primary synthetic completion through the gateway
        env:
          QUIDRA_BENCHMARK_WORKER_GATEWAY_ATTESTED: packet-gateway-v1
          QUIDRA_BENCHMARK_PACKET_WORKER_LOCAL_TOOLS: disabled
          QUIDRA_BENCHMARK_SANDBOX_AGENT_LAUNCHER_ATTESTED: inside-sandbox-v1
        run: |
          export QUIDRA_BENCHMARK_SYNTHETIC_COMMANDS=1
          TMP="$PWD/.benchmark-template-e2e"
          rm -rf "$TMP"
          mkdir -p \
            "$TMP/work/root" "$TMP/work/agents" "$TMP/raw" "$TMP/results" \
            "$TMP/prompts/by-hash" "$TMP/prompts/components/by-hash" "$TMP/prompts/manifests" \
            "$TMP/home" "$TMP/tmp" "$TMP/gateway" "$TMP/repo/docs"

          python - <<'PY'
          from pathlib import Path
          import importlib.util
          import json

          root = Path(".benchmark-template-e2e")
          spec = importlib.util.spec_from_file_location(
              "benchmark_cli", "benchmark/template/scripts/benchmark.py"
          )
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.copy_tracked_tree(Path.cwd(), "benchmark/template", root / "template")
          module.materialize_reuse_catalog(Path.cwd(), root / "template")
          master = Path("benchmark/master_prompt.md").read_bytes()
          master_hash = module.sha256_bytes(master)
          (root / "prompts" / "by-hash" / f"{master_hash}.md").write_bytes(master)
          (root / "run.json").write_text(json.dumps({
              "schema_version": 1,
              "workspace_root": "/quidra-benchmark",
              "master_prompt_sha256": master_hash,
              "primary_config_sha256": module.sha256_file(
                  root / "template" / "config" / "primary.json"
              ),
              "template_tree_sha256": module.sha256_tree(root / "template"),
          }, indent=2) + "\n")
          # A real run executes on Linux while reuse/catalog.json records
          # fingerprints validated on macOS, so some artifacts always need a
          # currency audit and the planner always adds audit units. Seeding an
          # empty set here meant the planning path every real run takes was
          # never exercised, and a validator that rejected those units went
          # unnoticed.
          materialized = module.json_load(root / "template" / "reuse" / "materialized.json")
          audit_required = [
              a["id"] for a in materialized["artifacts"]
              if a.get("language") in {"C++", "Python"} and a.get("validated_toolchain")
          ]
          assert audit_required, "expected at least one artifact to need a currency audit"
          (root / "results" / "reuse_status.json").write_text(
              json.dumps({"schema_version":1,"audit_required":audit_required}) + "\n"
          )
          (root / "results" / "preflight.json").write_text(
              json.dumps({"ok": True, "synthetic_ci": True}) + "\n"
          )
          PY

          python benchmark/template/scripts/benchmark.py privacy-check --workspace "$TMP"
          python benchmark/template/scripts/benchmark.py deterministic-plan --workspace "$TMP"
          python benchmark/template/scripts/benchmark.py manifest-merge --workspace "$TMP"
          python benchmark/template/scripts/benchmark.py plan --workspace "$TMP" --strict

          # Every model turn in this run - packet-only and sandbox-agent alike -
          # crosses the credential-less gateway socket. The workers run with a
          # stripped environment, so a run that only worked because a credential
          # happened to be exported would fail here.
          python benchmark/template/scripts/synthetic_run.py --workspace "$TMP" \
            | tee "$TMP/synthetic_run.json"

          python - <<'PY'
          from pathlib import Path
          import json

          root = Path(".benchmark-template-e2e")
          summary = json.loads((root / "synthetic_run.json").read_text())
          assert summary["dispatched"]["packet-only"] > 0, summary
          assert summary["dispatched"]["sandbox-agent"] > 0, summary
          assert summary["gateway_requests_brokered"] > 0, summary

          status = json.loads((root / "results/primary_status.json").read_text())
          for name, ev in status["evaluations"].items():
              assert ev["status"] == "COMPLETE", (name, ev)
              assert len(ev["ranking"]) == 10, (name, ev)
              assert len(ev["scores"]) == 10, (name, ev)

          manifest = json.loads((root / "work/root/manifest.json").read_text())
          gateway_cfg = json.loads((root / "template/config/inference_gateway.json").read_text())
          primary_cfg = json.loads((root / "template/config/primary.json").read_text())
          effort_overrides = gateway_cfg["anthropic_decoding"]["evaluation_effort"]
          default_effort = primary_cfg["sampling"]["effort"]
          audit_units = [u for u in manifest["work_units"] if u.get("reuse_audit_for")]
          assert audit_units, "the currency audits never reached the manifest"
          mechanical = next(
              u for u in manifest["work_units"] if u["id"] == "lq-micro-mechanical"
          )
          # The measurement has to wait for the audits of the artifacts it measures.
          assert {u["id"] for u in audit_units} & set(mechanical["dependencies"]), mechanical
          traces = 0
          receipts = 0
          for unit in manifest["work_units"]:
              if unit.get("execution_kind", "agent") != "agent":
                  continue
              agent = root / "work/agents" / unit["assigned_agent_id"]
              expected_effort = effort_overrides.get(unit["evaluation"], default_effort)
              if unit.get("worker_mode") == "sandbox-agent":
                  trace = json.loads((agent / "agent_trace.json").read_text())
                  assert trace["stop_reason"] == "final", trace
                  assert trace["gateway"]["credential_less_client"] is True, trace
                  assert trace["gateway"]["host_tools_exposed"] is False, trace
                  assert trace["sampling"]["effort"] == expected_effort, (unit["id"], trace["sampling"])
                  traces += 1
              else:
                  receipt = json.loads((agent / "worker_response.json").read_text())
                  assert receipt["inference"]["gateway"] == "quidra-inference-gateway-v1", receipt
                  assert receipt["inference"]["sampling"]["effort"] == expected_effort, (
                      unit["id"], receipt["inference"]["sampling"]
                  )
                  receipts += 1
          assert traces and receipts, (traces, receipts)

          # The gateway holds a provider credential for the whole run. Nothing it
          # brokered may carry that credential into an artifact the repository
          # will keep.
          retained = []
          for relative in ("run.json", "results", "raw", "prompts", "work/agents",
                          "work/root/manifest.json", "work/root/ledger.json",
                          "work/root/plans", "work/root/commands"):
              target = root / relative
              if target.is_file():
                  retained.append(target)
              elif target.is_dir():
                  retained.extend(p for p in target.rglob("*") if p.is_file())
          import re
          # A bare "sk-" substring also matches words like "task-apply", so the
          # credential check uses the same shape the privacy gate uses.
          credential = re.compile(r"\bsk-[A-Za-z0-9_-]{20,}\b")
          for path in retained:
              try:
                  text = path.read_text()
              except (UnicodeDecodeError, OSError):
                  continue
              assert not credential.search(text), str(path)
              # The bare variable name is policy prose in the master prompt; an
              # assignment is what a leak would look like.
              assert "ANTHROPIC_API_KEY=" not in text, str(path)

          # Host paths are a different question. A synthetic run puts the
          # workspace itself under the runner's home, which privacy_match_is_safe
          # already exempts and the privacy-check command below enforces. The
          # invariant worth asserting here is the one that holds in every run:
          # the physical workspace path never reaches a prompt a model is sent.
          physical = str(root.resolve())
          for component in (root / "prompts/components/by-hash").rglob("*"):
              if component.is_file():
                  assert physical not in component.read_text(), str(component)
          PY

          python benchmark/template/scripts/benchmark.py ledger-reconcile --workspace "$TMP"
          python benchmark/template/scripts/benchmark.py score-status --workspace "$TMP" --strict
          python benchmark/template/scripts/benchmark.py privacy-check --workspace "$TMP"
          python benchmark/template/scripts/benchmark.py finalize --workspace "$TMP"
          test -f "$TMP/results/finalization.json"

          rm -rf "$TMP"

  sandbox-container:
    # The rest of this workflow proves the protocol and the permission logic.
    # This job proves the boundary: a real container, a real shared-volume socket,
    # and a preflight that only passes because the isolation is genuinely there.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the base runtime image
        run: |
          python benchmark/template/scripts/sandbox_launcher.py build-image \
            --target base --image quidra-benchmark/runtime:ci-base
          python benchmark/template/scripts/sandbox_launcher.py doctor \
            --image quidra-benchmark/runtime:ci-base

      - name: Stage the sandbox workspace
        run: |
          rm -rf .quidra-benchmark
          git checkout -B develop "$GITHUB_SHA"
          python benchmark/template/scripts/benchmark.py init \
            --source-repo "$GITHUB_WORKSPACE" --sandbox-mode container
          mkdir -p "$RUNNER_TEMP/fake"
          cat > "$RUNNER_TEMP/fake/script.json" <<'JSON'
          {"schema_version": 1, "default": "container smoke completion"}
          JSON

      - name: Preflight passes only inside the real hardened sandbox
        run: |
          python benchmark/template/scripts/sandbox_launcher.py run \
            --source-repo "$GITHUB_WORKSPACE" \
            --image quidra-benchmark/runtime:ci-base \
            --provider fake --fake-script "$RUNNER_TEMP/fake/script.json" \
            -- python3 /quidra-benchmark/template/scripts/benchmark.py preflight
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path(".quidra-benchmark/results/preflight.json").read_text())
          assert result["ok"], result["problems"]
          observed = result["observed_isolation"]
          assert observed["euid"] != 0, observed
          assert observed["network_interfaces"] == ["lo"], observed
          assert observed["capability_bounding_set"].strip("0") == "", observed
          assert observed["no_new_privileges"].strip() == "1", observed
          assert observed["writable"] == {"repo": False, "template": False, "work": True}, observed
          gateway = result["inference_gateway"]
          assert gateway["socket_path"] == "/quidra-benchmark/gateway/inference.sock", gateway
          assert gateway["policy_probes"] == {
              "tool_field": True, "unsupported_kind": True
          }, gateway
          contract = result["launcher_contract"]
          assert contract["present"] and contract["contract"] == "quidra-sandbox-launcher-v1", contract
          PY

      - name: A credential inside the sandbox must fail preflight
        run: |
          set +e
          python benchmark/template/scripts/sandbox_launcher.py run \
            --source-repo "$GITHUB_WORKSPACE" \
            --image quidra-benchmark/runtime:ci-base \
            --provider fake --fake-script "$RUNNER_TEMP/fake/script.json" \
            -- sh -c 'ANTHROPIC_API_KEY=placeholder-value python3 /quidra-benchmark/template/scripts/benchmark.py preflight'
          RC=$?
          set -e
          if [ "$RC" -eq 0 ]; then
            echo "preflight passed with a provider credential inside the sandbox" >&2
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path(".quidra-benchmark/results/preflight.json").read_text())
          problems = set(result["problems"])
          assert not result["ok"], result
          assert "provider_credential_in_sandbox_environment:ANTHROPIC_API_KEY" in problems, problems
          PY

      - name: Writes outside the sandbox contract are refused by the kernel
        run: |
          set +e
          python benchmark/template/scripts/sandbox_launcher.py run \
            --source-repo "$GITHUB_WORKSPACE" \
            --image quidra-benchmark/runtime:ci-base \
            --provider fake --fake-script "$RUNNER_TEMP/fake/script.json" \
            -- sh -c 'echo tampered > /quidra-benchmark/repo/tampered.txt'
          RC=$?
          set -e
          if [ "$RC" -eq 0 ]; then
            echo "the evaluated snapshot was writable from inside the sandbox" >&2
            exit 1
          fi
          test ! -e .quidra-benchmark/repo/tampered.txt

      - name: The production driver completes a run inside the real sandbox
        run: |
          # production_run.py is the driver a paid run uses, and it is not the
          # harness the rest of this workflow exercises: it owns its own loop,
          # its own retry and blocker handling, and it calls preflight, so it can
          # only run inside the real sandbox. Driving it here with the offline
          # provider leaves the paid provider as the only part of a real run that
          # a real run is the first to execute.
          python benchmark/template/scripts/sandbox_launcher.py run \
            --source-repo "$GITHUB_WORKSPACE" \
            --image quidra-benchmark/runtime:ci-base \
            --provider fake --fake-script "$RUNNER_TEMP/fake/script.json" \
            -- python3 /quidra-benchmark/template/scripts/benchmark.py prepare

          # Script every unit up front: the driver never hands control back to
          # let the script be extended mid-run, exactly as with a real provider.
          python benchmark/template/scripts/synthetic_run.py \
            --workspace "$GITHUB_WORKSPACE/.quidra-benchmark" \
            --emit-fake-script "$RUNNER_TEMP/fake/script.json"
          python benchmark/template/scripts/production_run.py policy \
            --workspace "$GITHUB_WORKSPACE/.quidra-benchmark" \
            --output "$RUNNER_TEMP/fake/task-policy.json"

          python benchmark/template/scripts/sandbox_launcher.py run \
            --source-repo "$GITHUB_WORKSPACE" \
            --image quidra-benchmark/runtime:ci-base \
            --provider fake --fake-script "$RUNNER_TEMP/fake/script.json" \
            --network-policy disabled \
            --task-policy "$RUNNER_TEMP/fake/task-policy.json" \
            --gateway-log-out "$RUNNER_TEMP/driver-audit.jsonl" \
            -- python3 /quidra-benchmark/template/scripts/production_run.py run \
               --workspace /quidra-benchmark --concurrency 3

          python - <<'PY'
          import json
          from pathlib import Path

          root = Path(".quidra-benchmark")
          run = json.loads((root / "results/production_run.json").read_text())
          assert run["ok"], run
          assert run["dispatched_agent_attempts"] > 0, run

          # The base image carries no comparison-language toolchains, so the
          # evaluations that need them are legitimately blocked here. That is the
          # contract worth asserting: every evaluation either publishes a full
          # ranking or says exactly why it cannot, and nothing is left silently
          # unfinished. The full image is covered by benchmark-runtime-image.
          status = json.loads((root / "results/primary_status.json").read_text())
          complete = []
          for name, ev in status["evaluations"].items():
              if ev["status"] == "COMPLETE":
                  assert len(ev["ranking"]) == 10, (name, ev)
                  complete.append(name)
              else:
                  assert ev["ranking"] is None, (name, ev)
                  assert ev.get("blocker_class"), (name, ev)
          assert complete, f"no evaluation completed: {status['evaluations']}"
          assert (root / "results/finalization.json").is_file()

          manifest = json.loads((root / "work/root/manifest.json").read_text())
          modes = {
              u.get("worker_mode")
              for u in manifest["work_units"]
              if u.get("execution_kind", "agent") == "agent"
          }
          assert modes == {"packet-only", "sandbox-agent"}, modes
          print(json.dumps({
              "dispatched": run["dispatched_agent_attempts"],
              "worker_modes": sorted(modes),
              "complete": sorted(complete),
              "blocked": sorted(set(status["evaluations"]) - set(complete)),
          }, indent=2))
          PY

      - name: Incomplete diagnostic run cannot publish
        run: |
          # The ci-base image deliberately lacks most comparison-language
          # toolchains, so this synthetic run is expected to finalize only as a
          # diagnostic PARTIAL run. Publication must refuse it while preserving
          # the workspace for cache/recovery checks and guarded cleanup.
          RUN_ID="$(python - <<'PY'
          import json
          print(json.load(open(".quidra-benchmark/run.json"))["run_id"])
          PY
          )"
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path(".quidra-benchmark")
          finalization = json.loads((root / "results/finalization.json").read_text())
          completeness = json.loads((root / "results/completeness_audit.json").read_text())
          assert finalization["ok"] is True, finalization
          assert finalization["formal_complete"] is False, finalization
          assert completeness["formal_complete"] is False, completeness
          assert (
              completeness["rerun_agent_leaf_ids"]
              or completeness["rerun_machine_unit_ids"]
          ), completeness
          PY

          if python benchmark/template/scripts/benchmark.py post-run \
            --source-repo "$GITHUB_WORKSPACE"; then
            echo "::error::post-run published a formally incomplete benchmark"
            exit 1
          fi
          test -d .quidra-benchmark
          test ! -e "benchmark/$RUN_ID"
          echo "formal-incomplete publication guard: ok"

      - name: Discard the staging workspace
        if: always()
        run: |
          python benchmark/template/scripts/benchmark.py discard-workspace \
            --source-repo "$GITHUB_WORKSPACE" || true


  # BEGIN ONE-SHOT CACHE CANONICALIZATION
  canonicalize-cache-once:
    name: canonicalize-cache-once
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      BASELINE_RUN: 2026-09-25-5dc8989-gh25
      EVALUATED_SHA: 5dc8989342d3920ad1a64262696757257958e0aa
      BENCHMARK_MODEL: claude-sonnet-5
      BENCHMARK_IMAGE: quidra-benchmark/runtime:canonicalize-once
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Verify frozen starting point
        run: |
          set -euo pipefail
          git fetch origin develop --prune
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/develop)" = "$GITHUB_SHA"
          test ! -e benchmark/.run-production
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path("benchmark") / os.environ["BASELINE_RUN"]
          summary = json.loads((root / "summary.json").read_text())
          ev = summary.get("primary_evaluations") or {}
          assert set(ev) == {
              "semantic_compression",
              "llm_learnability",
              "language_quality",
              "ecosystem",
              "llm_proficiency",
          }, ev
          assert all((row or {}).get("status") == "COMPLETE" for row in ev.values()), ev
          PY

      - name: Compact and canonicalize certified cache
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, re, shutil
          from pathlib import Path

          BASE = os.environ["BASELINE_RUN"]
          EVAL = os.environ["EVALUATED_SHA"]
          repo = Path.cwd()
          cache = repo / "benchmark/cache"
          usage = json.loads((repo / f"benchmark/{BASE}/cache_usage.json").read_text())

          active = {}
          for uid, row in (usage.get("hits") or {}).items():
              rel = str((row or {}).get("record") or "")
              if rel:
                  active.setdefault(rel, uid)
          active.update({
              "v1/llm-proficiency/quidra/b6a8e854ed2ad7f62e83a5b2444055e5681f5db3800a5476986de39b6b135f15.json": "proficiency-trials--quidra",
              "v1/llm-proficiency/typescript/3f8731cab70943b0fe41b5fa2b2afe6ef600721ecf066a1281582d6ac7e689be.json": "proficiency-trials--typescript",
              "v1/llm-proficiency/zig/116233e2ca2daea174d689ad51828fe1bd70d06b58d12698c9f12eae883e79d2.json": "proficiency-trials--zig",
              "v1/semantic-compression/comparability/4462a2ce3637819c31d48ad8f07ecfd3329d55b4cbc82d90cae7cf2e843dfe49.json": "sc-comparability",
          })
          assert len(active) == 688, len(active)

          existing = sorted((cache / "v1").rglob("*.json"))
          assert len(existing) == 1219, len(existing)
          active_paths = {Path(p) for p in active}

          for rel, uid in sorted(active.items()):
              path = cache / rel
              assert path.is_file(), rel
              record = json.loads(path.read_text())
              payload = record.get("fingerprint_payload")
              assert isinstance(payload, dict), rel
              fp = hashlib.sha256(
                  json.dumps(payload, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode()
              ).hexdigest()
              assert record.get("fingerprint") == fp, rel
              result_sha = hashlib.sha256(
                  json.dumps(record.get("result"), sort_keys=True, separators=(",", ":")).encode()
              ).hexdigest()
              assert record.get("result_sha256") == result_sha, rel

              if "Quidra" in (payload.get("assigned_languages") or []):
                  ident = (record.get("compatibility") or {}).get("quidra_execution_identity")
                  assert isinstance(ident, dict) and ident.get("sha256"), rel

              cert = dict(record.get("certification") or {})
              for key in list(cert):
                  if re.search(r"(migration|recertif|snapshot|legacy)", key, re.I) or key == "new_paid_provider_call":
                      cert.pop(key, None)
              cert.update({
                  "unit_complete": True,
                  "validator_pass": True,
                  "primary_complete": True,
                  "canonical_baseline_run_id": BASE,
                  "canonical_baseline_formal_complete": True,
              })
              old_prov = record.get("provenance") or {}
              record["certification"] = cert
              record.pop("migration", None)
              record["provenance"] = {
                  "run_id": BASE,
                  "work_unit_id": uid,
                  "prompt_sha256": old_prov.get("prompt_sha256"),
                  "canonical_baseline": True,
                  "evaluated_commit_sha": EVAL,
              }
              path.write_text(json.dumps(record, indent=2, sort_keys=True) + "\n")

          removed = 0
          for path in existing:
              if path.relative_to(cache) not in active_paths:
                  path.unlink()
                  removed += 1
          assert removed == 531, removed

          for d in (cache / "provenance", cache / "snapshots"):
              if d.exists():
                  shutil.rmtree(d)
          for p in (
              cache / "proficiency-recertification-audit.json",
              cache / "recertification-report.json",
              repo / "benchmark/template/scripts/audit_proficiency_legacy.py",
              repo / ".github/workflows/cache-recertify-once.yml",
              repo / ".github/workflows/benchmark-cache-canonicalize-once.yml",
          ):
              p.unlink(missing_ok=True)

          for d in sorted(
              [p for p in (cache / "v1").rglob("*") if p.is_dir()],
              key=lambda p: len(p.parts), reverse=True
          ):
              try:
                  d.rmdir()
              except OSError:
                  pass

          policy_path = repo / "benchmark/template/config/cache_policy.json"
          policy = json.loads(policy_path.read_text())
          reuse = policy.get("reuse_conditions") or {}
          policy["reuse_conditions"] = {
              k: reuse[k]
              for k in (
                  "scored_output_cap",
                  "same_result_metadata_refresh",
                  "llm_proficiency_runtime_prompt_identity",
              )
              if k in reuse
          }
          policy["reuse_conditions"]["quidra_execution_identity"] = (
              "Every Quidra cache record must carry an explicit exact compiler/runtime execution identity. "
              "Missing identity is a cache miss; historical baseline fallback is not supported."
          )
          policy["policy"] = (
              "Only self-contained certified records at the exact current fingerprint may be reused. "
              "Hydration does not search older fingerprints, migration snapshots, provenance archives, "
              "or historical run directories. Every exact hit is revalidated by the current validator."
          )
          qid = policy.get("quidra_execution_identity") or {}
          policy["quidra_execution_identity"] = {
              "input_paths": qid.get("input_paths") or [],
              "purpose": (
                  "Prevent stale same-version Quidra reuse. Current Quidra records carry "
                  "these Git object IDs and their aggregate hash explicitly."
              ),
          }
          declared = policy.get("declared_epochs") or {}
          declared["note"] = (
              "Declared epochs are explicit measurement pins. Change an epoch only when that "
              "measurement contract should intentionally be refreshed."
          )
          declared["semantic_compression_note"] = (
              "Canonical-fragment v6 current contract. Reuse is exact-current-fingerprint only."
          )
          declared["llm_proficiency_note"] = (
              "Complete Primary trials v6. Exact runtime-owned prompt/trial/workload identity is required."
          )
          policy["declared_epochs"] = declared
          policy_path.write_text(json.dumps(policy, indent=2) + "\n")

          bench = repo / "benchmark/template/scripts/benchmark.py"
          text = bench.read_text()
          start = text.index(
              "        else:\n"
              "            compatible_path, record, compatibility_problem = (\n"
              "                find_primary_projection_compatible_cache_record("
          )
          end = text.index(
              "        migration_problem = cache_record_migration_problem(root, record)\n", start
          )
          replacement = (
              "        else:\n"
              "            record_miss(\n"
              "                uid,\n"
              "                fingerprint,\n"
              "                unit,\n"
              "                \"no exact certified record\",\n"
              "                invalidated=False,\n"
              "            )\n"
              "            continue\n"
          )
          text = text[:start] + replacement + text[end:]

          mstart = text.index(
              "        migration_problem = cache_record_migration_problem(root, record)\n"
          )
          mend = text.index(
              "        cap_problem = cache_cap_reuse_problem(root, record, unit)\n", mstart
          )
          text = text[:mstart] + text[mend:]
          text = text.replace(
              "        migration_metadata = recover_current_migration_metadata(root, record)\n",
              "        migration_metadata = None\n",
              1,
          )

          qstart = text.index("def _legacy_cache_run_commit_prefix(")
          qend = text.index("def quidra_target_identity(", qstart)
          qreplacement = (
              "def cache_quidra_execution_reuse_problem(\n"
              "    root: Path, record: dict[str, Any]\n"
              ") -> str | None:\n"
              "    \"\"\"Require exact explicit Quidra compiler/runtime execution identity.\"\"\"\n"
              "    payload = record.get(\"fingerprint_payload\") or {}\n"
              "    target = str(cache_policy(root).get(\"target_language\") or \"Quidra\")\n"
              "    if target not in (payload.get(\"assigned_languages\") or []):\n"
              "        return None\n"
              "    current = current_quidra_execution_identity(root)\n"
              "    if current is None:\n"
              "        if lexical_absolute(root) == lexical_absolute(CANONICAL_WORKSPACE):\n"
              "            return \"current run is missing the trusted Quidra execution identity\"\n"
              "        return None\n"
              "    recorded = (record.get(\"compatibility\") or {}).get(\"quidra_execution_identity\")\n"
              "    if not isinstance(recorded, dict):\n"
              "        return \"cached Quidra record has no explicit execution identity\"\n"
              "    if recorded.get(\"sha256\") != current.get(\"sha256\"):\n"
              "        return \"Quidra compiler/runtime implementation changed\"\n"
              "    if recorded.get(\"git_objects\") != current.get(\"git_objects\"):\n"
              "        return \"Quidra execution-input object map changed\"\n"
              "    return None\n\n\n"
          )
          text = text[:qstart] + qreplacement + text[qend:]

          pstart = text.index(
              "    bind_lq = sub.add_parser(\n"
              "        \"cache-bind-language-quality-snapshot\","
          )
          pend = text.index(
              "    impact = sub.add_parser(\n"
              "        \"cache-impact\",", pstart
          )
          text = text[:pstart] + text[pend:]
          bench.write_text(text)

          baseline = {
              "schema_version": 1,
              "baseline_run_id": BASE,
              "evaluated_commit_sha": EVAL,
              "formal_complete": True,
              "record_count": 688,
              "records_sha256": hashlib.sha256(
                  ("\n".join(sorted(active)) + "\n").encode()
              ).hexdigest(),
              "cache_policy": "exact-current-fingerprint-only",
              "historical_fallback": False,
          }
          (cache / "baseline.json").write_text(
              json.dumps(baseline, indent=2, sort_keys=True) + "\n"
          )
          readme_lines = [
              "# Certified benchmark cache",
              "",
              "This directory is the complete reusable measurement state for the next Quidra benchmark.",
              "",
              f"The canonical baseline is {BASE}. It completed all five Primary evaluations. The",
              "cache is compacted to the 688 certified records required by that completed contract.",
              "",
              "A record is a HIT only at its exact current fingerprint. Hydration does not search",
              "older fingerprints, historical run directories, migration snapshots, provenance",
              "archives, or recertification sources. Every HIT is revalidated by the current",
              "validator. Quidra records additionally carry an explicit compiler/runtime execution",
              "identity.",
              "",
              "The cache is self-contained: pre-baseline cache history is not required for reuse.",
              "A future scientific input change creates a MISS only for the affected fingerprint.",
              "",
          ]
          (cache / "README.md").write_text("\n".join(readme_lines))
          print(json.dumps({
              "canonical_records": 688,
              "deleted_old_records": removed,
          }, indent=2))
          PY

          python -m py_compile benchmark/template/scripts/benchmark.py
          test "$(find benchmark/cache/v1 -type f -name '*.json' | wc -l)" -eq 688
          test ! -e benchmark/cache/provenance
          test ! -e benchmark/cache/snapshots
          test ! -e benchmark/cache/recertification-report.json
          test ! -e benchmark/cache/proficiency-recertification-audit.json
          test ! -e benchmark/template/scripts/audit_proficiency_legacy.py
          test ! -e .github/workflows/cache-recertify-once.yml

      - name: Verify zero structural invalidations
        run: |
          set -euo pipefail
          set +e
          python benchmark/template/scripts/benchmark.py cache-impact \
            --source-repo "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/cache-impact.json"
          rc=$?
          set -e
          cat "$RUNNER_TEMP/cache-impact.json"
          test "$rc" -eq 0
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path(os.environ["RUNNER_TEMP"], "cache-impact.json").read_text())
          assert int(report.get("valid", 0) or 0) == 688, report
          assert not report.get("invalid"), report
          PY

      - name: Build production-equivalent validation image
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          python benchmark/template/runtime/check_pins.py
          python benchmark/template/scripts/sandbox_launcher.py build-image \
            --target toolchains --image "$BENCHMARK_IMAGE"
          python benchmark/template/scripts/sandbox_launcher.py doctor \
            --image "$BENCHMARK_IMAGE"

      - name: Prove clean-room replay needs zero paid calls
        run: |
          set -euo pipefail
          rm -rf .quidra-benchmark
          python benchmark/template/scripts/benchmark.py init \
            --source-repo "$GITHUB_WORKSPACE" \
            --sandbox-mode container \
            --run-id canonical-baseline-replay \
            --provider anthropic-messages \
            --model "$BENCHMARK_MODEL"
          python benchmark/template/scripts/sandbox_launcher.py run \
            --source-repo "$GITHUB_WORKSPACE" \
            --image "$BENCHMARK_IMAGE" \
            --provider fake \
            -- python3 /quidra-benchmark/template/scripts/benchmark.py prepare
          python benchmark/template/scripts/production_run.py budget-plan \
            --workspace "$GITHUB_WORKSPACE/.quidra-benchmark" \
            --model "$BENCHMARK_MODEL" \
            --available-usd 1.0 \
            --safety-multiplier 1.25 \
            --smoke-reserve-usd 0.10 \
            --output "$RUNNER_TEMP/budget-plan.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          plan = json.loads(Path(os.environ["RUNNER_TEMP"], "budget-plan.json").read_text())
          cache = json.loads(Path(".quidra-benchmark/results/cache_usage.json").read_text())
          report = {
              "expected_paid_api_calls_upper_bound": plan.get("expected_paid_api_calls_upper_bound"),
              "recommended_budget_usd": plan.get("recommended_budget_usd"),
              "cache_hits": cache.get("hit_count"),
              "cache_misses": cache.get("miss_count"),
              "cache_invalidated": cache.get("invalidated_count"),
          }
          print(json.dumps(report, indent=2, sort_keys=True))
          assert int(plan.get("expected_paid_api_calls_upper_bound", 0) or 0) == 0, plan
          assert int(cache.get("miss_count", 0) or 0) == 0, cache
          assert int(cache.get("invalidated_count", 0) or 0) == 0, cache
          PY

      - name: Commit cleanup only after proof
        run: |
          set -euo pipefail
          rm -rf .quidra-benchmark
          python - <<'PY'
          from pathlib import Path
          path = Path(".github/workflows/benchmark-template.yml")
          text = path.read_text()
          marker = "\n  # BEGIN ONE-SHOT CACHE CANONICALIZATION\n"
          assert marker in text
          path.write_text(text.split(marker, 1)[0].rstrip() + "\n")
          PY
          rm -f .github/workflows/benchmark-cache-canonicalize-once.yml

          git fetch origin develop --prune
          test "$(git rev-parse origin/develop)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test ! -e benchmark/.run-production
          git diff --cached --check
          git commit -m "Canonicalize completed benchmark cache baseline"
          git push origin HEAD:develop
  # END ONE-SHOT CACHE CANONICALIZATION
