                  pslug = probe_slug(probe_id)
                  uid = f"sc-canonical-fragment--{lang_slug[language]}--{pslug}"
                  agent = "worker-" + uid
                  payload = {
                      "schema_version": 1,
                      "evaluation": "semantic_compression",
