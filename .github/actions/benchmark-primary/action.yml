name: Run one Primary benchmark evaluation
description: Run one of the five Primary evaluations and hand the frozen workspace to the next GitHub Actions job.

inputs:
  evaluation:
    description: Primary evaluation name.
    required: true
  previous-handoff:
    description: Artifact name carrying the previous job's workspace; empty for the first Primary.
    required: false
    default: ""
  handoff-name:
    description: Artifact name to publish for the next job.
    required: true
  run-id:
    description: Frozen benchmark run id.
    required: true
  evaluated-sha:
    description: Exact source commit being evaluated.
    required: true
  model:
    description: Scored provider model.
    required: true
  budget-usd:
    description: Whole-run soft budget.
    required: true
  initial-spend-usd:
    description: Spend already consumed before the first Primary (provider smoke).
    required: false
    default: "0"
  concurrency:
    description: Maximum in-flight workers inside this evaluation.
    required: false
    default: "6"
  max-wall-seconds:
    description: Wall-clock slice before checkpointing for an automatic continuation job.
    required: false
    default: "15000"
  units:
    description: Optional whitespace-separated work-unit ids for a paid rehearsal.
    required: false
    default: ""

outputs:
  handoff-ready:
    description: Whether a workspace handoff artifact was produced.
    value: ${{ steps.package.outputs.ready }}
  evaluation-status:
    description: COMPLETE/PARTIAL/unknown after this evaluation.
    value: ${{ steps.status.outputs.value }}
  continuation-needed:
    description: Whether the paid slice checkpointed cleanly for another job.
    value: ${{ steps.paid.outputs.continuation-needed }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Restore private paid-leaf checkpoint cache
      id: paid-cache-restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/benchmark-paid-state
        key: quidra-benchmark-paid-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}
        restore-keys: |
          quidra-benchmark-paid-v1-${{ runner.os }}-

    - name: Download previous Primary handoff
      if: ${{ inputs.previous-handoff != '' }}
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.previous-handoff }}
        path: ${{ runner.temp }}/benchmark-previous

    - name: Restore or create the frozen workspace
      shell: bash
      env:
        PREVIOUS_HANDOFF: ${{ inputs.previous-handoff }}
        RUN_ID: ${{ inputs.run-id }}
        EVALUATED_SHA: ${{ inputs.evaluated-sha }}
        MODEL: ${{ inputs.model }}
        WHOLE_BUDGET: ${{ inputs.budget-usd }}
        INITIAL_SPEND: ${{ inputs.initial-spend-usd }}
      run: |
        set -euo pipefail
        state="$RUNNER_TEMP/benchmark-budget-state.json"
        have_handoff=false
        if [ -n "$PREVIOUS_HANDOFF" ] \
           && [ -f "$RUNNER_TEMP/benchmark-previous/workspace.tgz" ] \
           && [ -f "$RUNNER_TEMP/benchmark-previous/budget-state.json" ]; then
          have_handoff=true
        fi

        if [ "$have_handoff" = true ]; then
          tar -xzf "$RUNNER_TEMP/benchmark-previous/workspace.tgz" -C "$GITHUB_WORKSPACE"
          cp "$RUNNER_TEMP/benchmark-previous/budget-state.json" "$state"
          python benchmark/template/scripts/benchmark.py restore-workspace-guard \
            --source-repo "$GITHUB_WORKSPACE" \
            --expected-commit "$EVALUATED_SHA"
        else
          if [ -n "$PREVIOUS_HANDOFF" ]; then
            echo "::warning::Previous Actions handoff is unavailable; rebuilding this run from the evaluated snapshot and independently certified unit cache."
          fi

          python benchmark/template/scripts/benchmark.py init \
            --source-repo "$GITHUB_WORKSPACE" \
            --sandbox-mode container \
            --run-id "$RUN_ID" \
            --provider anthropic-messages \
            --model "$MODEL"

          if [ -n "$PREVIOUS_HANDOFF" ]; then
            # COMPLETE+PASS units are checkpointed before the handoff upload. Recover
            # them without checking out the moving benchmark branch over the frozen
            # evaluated source tree.
            git fetch origin benchmark
            recovery="$RUNNER_TEMP/benchmark-cache-recovery"
            rm -rf "$recovery"
            mkdir -p "$recovery"
            if git cat-file -e "origin/benchmark:benchmark/cache" 2>/dev/null; then
              git archive --format=tar origin/benchmark benchmark/cache | tar -xf - -C "$recovery"
              rm -rf .quidra-benchmark/cache
              cp -a "$recovery/benchmark/cache" .quidra-benchmark/cache
              python benchmark/template/scripts/benchmark.py refresh-cache-snapshot \
                --source-repo "$GITHUB_WORKSPACE" \
                --expected-commit "$EVALUATED_SHA"
            fi

            # Do not guess already-spent API money. This checkpoint is written before
            # every handoff upload, so losing both means there is no trustworthy way
            # to preserve the run-wide budget invariant.
            checkpoint="benchmark/checkpoints/$RUN_ID/budget-state.json"
            if ! git cat-file -e "origin/benchmark:$checkpoint" 2>/dev/null; then
              echo "::error::Missing both the previous handoff and its trusted budget checkpoint."
              exit 1
            fi
            git show "origin/benchmark:$checkpoint" > "$state"
          else
            python - "$state" "$WHOLE_BUDGET" "$INITIAL_SPEND" <<'PY'
        import json, sys
        from pathlib import Path
        path, limit, spent = Path(sys.argv[1]), float(sys.argv[2]), float(sys.argv[3])
        path.write_text(json.dumps({
            "schema_version": 1,
            "limit_usd": limit,
            "spent_usd": spent,
            "evaluations": {},
        }, indent=2, sort_keys=True) + "\n")
        PY
          fi
        fi

        python - "$state" "$RUN_ID" "$EVALUATED_SHA" "$WHOLE_BUDGET" <<'PY'
        import json, sys
        from pathlib import Path
        state = json.loads(Path(sys.argv[1]).read_text())
        run = json.loads(Path(".quidra-benchmark/run.json").read_text())
        assert run["run_id"] == sys.argv[2], (run["run_id"], sys.argv[2])
        assert run["evaluated"]["commit_sha"] == sys.argv[3], (
            run["evaluated"]["commit_sha"], sys.argv[3]
        )
        assert abs(float(state["limit_usd"]) - float(sys.argv[4])) < 1e-9
        PY

    - name: Detect whether this Primary is already COMPLETE
      id: scope
      shell: bash
      env:
        EVALUATION: ${{ inputs.evaluation }}
      run: |
        value="$(python - "$EVALUATION" <<'PY'
        import json, sys
        from pathlib import Path
        path = Path(".quidra-benchmark/results/primary_status.json")
        if not path.is_file():
            print("true")
        else:
            data = json.loads(path.read_text())
            status = (data.get("evaluations", {}).get(sys.argv[1], {}) or {}).get("status")
            print("false" if status == "COMPLETE" else "true")
        PY
        )"
        echo "needs-run=$value" >> "$GITHUB_OUTPUT"
        if [ "$value" = "false" ]; then
          echo "::notice::${EVALUATION} is already COMPLETE; skipping image build and paid dispatch."
        fi

    - name: Reclaim runner disk
      if: ${{ steps.scope.outputs.needs-run == 'true' }}
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
          /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
        df -h /

    - name: Build and verify the pinned ten-language image
      if: ${{ steps.scope.outputs.needs-run == 'true' }}
      shell: bash
      env:
        BENCHMARK_IMAGE: quidra-benchmark/runtime:production
      run: |
        python benchmark/template/runtime/check_pins.py
        python benchmark/template/scripts/sandbox_launcher.py build-image \
          --target toolchains --image "$BENCHMARK_IMAGE"
        python benchmark/template/scripts/sandbox_launcher.py doctor \
          --image "$BENCHMARK_IMAGE"

    - name: Deterministic preparation for this Primary
      if: ${{ steps.scope.outputs.needs-run == 'true' }}
      shell: bash
      env:
        BENCHMARK_IMAGE: quidra-benchmark/runtime:production
        EVALUATION: ${{ inputs.evaluation }}
      run: |
        python benchmark/template/scripts/sandbox_launcher.py run \
          --source-repo "$GITHUB_WORKSPACE" \
          --image "$BENCHMARK_IMAGE" \
          --provider fake \
          -- python3 /quidra-benchmark/template/scripts/benchmark.py prepare \
             --evaluation "$EVALUATION"

    - name: Restore exact-fingerprint paid partial leaves before pricing
      if: ${{ steps.scope.outputs.needs-run == 'true' }}
      shell: bash
      env:
        EVALUATION: ${{ inputs.evaluation }}
      run: |
        python benchmark/template/scripts/benchmark.py partial-paid-import \
          --workspace "$GITHUB_WORKSPACE/.quidra-benchmark" \
          --store "$RUNNER_TEMP/benchmark-paid-state" \
          --evaluation "$EVALUATION"

    - name: Show current exact cache state before paid dispatch
      if: ${{ steps.scope.outputs.needs-run == 'true' }}
      shell: bash
      env:
        EVALUATION: ${{ inputs.evaluation }}
      run: |
        python - "$EVALUATION" <<'PY'
        import json, sys
        from pathlib import Path

        root = Path(".quidra-benchmark")
        status_path = root / "results/cache_status.json"
        status = (
            json.loads(status_path.read_text())
            if status_path.is_file()
            else {"hits": {}, "misses": {}, "invalidated": {}}
        )
        manifest = json.loads((root / "work/root/manifest.json").read_text())
        evaluation_by_id = {
            str(unit["id"]): unit.get("evaluation")
            for unit in manifest.get("work_units", [])
        }
        evaluation = sys.argv[1]
        hits = sorted(
            uid for uid in status.get("hits", {})
            if evaluation_by_id.get(uid) == evaluation
        )
        misses = sorted(
            uid for uid in status.get("misses", {})
            if evaluation_by_id.get(uid) == evaluation
        )
        invalidated = sorted(
            uid for uid in status.get("invalidated", {})
            if evaluation_by_id.get(uid) == evaluation
        )
        print(json.dumps({
            "evaluation": evaluation,
            "known_hits": len(hits),
            "known_misses": len(misses),
            "known_invalidated": len(invalidated),
            "hit_units": hits,
            "miss_units": misses,
            "invalidated_units": invalidated,
            "note": (
                "Exact for units whose fingerprints are materializable now. "
                "Downstream packet keys depending on new uncached results are "
                "resolved only after those dependencies exist."
            ),
        }, indent=2))
        PY

    - name: Freeze this Primary's network policy and spend ceilings
      if: ${{ steps.scope.outputs.needs-run == 'true' }}
      shell: bash
      env:
        EVALUATION: ${{ inputs.evaluation }}
        MODEL: ${{ inputs.model }}
        UNITS: ${{ inputs.units }}
      run: |
        unit_args=()
        for unit in $UNITS; do unit_args+=(--unit "$unit"); done
        python benchmark/template/scripts/production_run.py policy \
          --workspace "$GITHUB_WORKSPACE/.quidra-benchmark" \
          --model "$MODEL" \
          --output "$RUNNER_TEMP/task-policy.json" \
          --evaluation "$EVALUATION" "${unit_args[@]}"

    - name: Prove remaining budget covers this unresolved Primary
      if: ${{ steps.scope.outputs.needs-run == 'true' }}
      id: budget
      continue-on-error: true
      shell: bash
      env:
        WHOLE_BUDGET: ${{ inputs.budget-usd }}
        MODEL: ${{ inputs.model }}
        EVALUATION: ${{ inputs.evaluation }}
        UNITS: ${{ inputs.units }}
      run: |
        set -euo pipefail
        remaining="$(python - "$RUNNER_TEMP/benchmark-budget-state.json" "$WHOLE_BUDGET" <<'PY'
        import json, sys
        from pathlib import Path
        state = json.loads(Path(sys.argv[1]).read_text())
        remaining = float(sys.argv[2]) - float(state.get("spent_usd", 0.0))
        if remaining <= 0:
            raise SystemExit("whole-run benchmark budget is already exhausted")
        print(f"{remaining:.6f}")
        PY
        )"
        unit_args=()
        for unit in $UNITS; do unit_args+=(--unit "$unit"); done
        plan="$GITHUB_WORKSPACE/.quidra-benchmark/results/execution-plan-$EVALUATION.json"
        python benchmark/template/scripts/production_run.py budget-plan \
          --workspace "$GITHUB_WORKSPACE/.quidra-benchmark" \
          --model "$MODEL" \
          --available-usd "$remaining" \
          --evaluation "$EVALUATION" \
          --output "$plan" \
          "${unit_args[@]}"
        python - "$plan" <<'PY'
        import json, sys
        from pathlib import Path
        plan = json.loads(Path(sys.argv[1]).read_text())
        print(json.dumps(plan, indent=2, sort_keys=True))
        if plan.get("hard_blockers"):
            raise SystemExit("unresolved terminal blockers exist; refusing paid redispatch")
        if not plan.get("sufficient"):
            raise SystemExit(
                "configured whole-run budget is below the conservative remaining-work estimate"
            )
        PY
        echo "remaining=$remaining" >> "$GITHUB_OUTPUT"

    - name: Run paid ${{ inputs.evaluation }} benchmark
      id: paid
      if: ${{ steps.scope.outputs.needs-run == 'true' && steps.budget.outcome == 'success' }}
      continue-on-error: true
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ env.ANTHROPIC_API_KEY }}
        BENCHMARK_IMAGE: quidra-benchmark/runtime:production
        MODEL: ${{ inputs.model }}
        EVALUATION: ${{ inputs.evaluation }}
        REMAINING_BUDGET: ${{ steps.budget.outputs.remaining }}
        CONCURRENCY: ${{ inputs.concurrency }}
        UNITS: ${{ inputs.units }}
      run: |
        set -euo pipefail
        echo "continuation-needed=false" >> "$GITHUB_OUTPUT"
        unit_args=()
        for unit in $UNITS; do unit_args+=(--unit "$unit"); done
        : > "$RUNNER_TEMP/gateway-audit.jsonl"
        rm -f .quidra-benchmark/results/production_checkpoint.json
        set +e
        python benchmark/template/scripts/sandbox_launcher.py run \
          --source-repo "$GITHUB_WORKSPACE" \
          --image "$BENCHMARK_IMAGE" \
          --provider anthropic-messages \
          --model "$MODEL" \
          --budget-usd "$REMAINING_BUDGET" \
          --network-policy disabled \
          --task-policy "$RUNNER_TEMP/task-policy.json" \
          --gateway-log-out "$RUNNER_TEMP/gateway-audit.jsonl" \
          -- python3 /quidra-benchmark/template/scripts/production_run.py run \
             --workspace /quidra-benchmark \
             --max-wall-seconds "${{ inputs.max-wall-seconds }}" \
             --concurrency "$CONCURRENCY" \
             --evaluation "$EVALUATION" \
             "${unit_args[@]}"
        rc=$?
        set -e
        if [ "$rc" -eq 0 ]; then
          exit 0
        fi
        if python - <<'PY'
        import json
        from pathlib import Path
        path = Path(".quidra-benchmark/results/production_checkpoint.json")
        if not path.is_file():
            raise SystemExit(1)
        checkpoint = json.loads(path.read_text())
        if checkpoint.get("reason") != "wall-clock-checkpoint":
            raise SystemExit(1)
        print(json.dumps(checkpoint, indent=2, sort_keys=True))
        PY
        then
          echo "continuation-needed=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Primary reached its planned wall-clock slice; the workspace is preserved for automatic continuation."
          exit 0
        fi
        exit "$rc"

    - name: Record this Primary's API usage
      if: ${{ always() }}
      shell: bash
      run: |
        touch "$RUNNER_TEMP/gateway-audit.jsonl"
        python benchmark/template/scripts/production_run.py cost-report \
          --log "$RUNNER_TEMP/gateway-audit.jsonl" \
          --output "$RUNNER_TEMP/api-cost.json"
        cat "$RUNNER_TEMP/api-cost.json"

    - name: Reconcile frozen execution plan with actual paid calls
      if: ${{ always() }}
      shell: bash
      env:
        EVALUATION: ${{ inputs.evaluation }}
      run: |
        set -euo pipefail
        plan="$GITHUB_WORKSPACE/.quidra-benchmark/results/execution-plan-$EVALUATION.json"
        actual="$RUNNER_TEMP/api-cost.json"
        output="$GITHUB_WORKSPACE/.quidra-benchmark/results/execution-actual-$EVALUATION.json"
        if [ ! -f "$plan" ]; then
          echo "::notice::No frozen execution plan was produced; skipping reconciliation."
          exit 0
        fi
        test -f "$actual" || echo '{"schema_version":1,"paid_inference_calls":0,"estimated_cost_usd":0.0,"gateway_errors":{}}' > "$actual"
        python benchmark/template/scripts/production_run.py reconcile-plan \
          --workspace "$GITHUB_WORKSPACE/.quidra-benchmark" \
          --plan "$plan" \
          --actual "$actual" \
          --evaluation "$EVALUATION" \
          --output "$output"
        cat "$output"

    - name: Update whole-run budget ledger
      if: ${{ always() }}
      shell: bash
      env:
        EVALUATION: ${{ inputs.evaluation }}
      run: |
        python - "$RUNNER_TEMP/benchmark-budget-state.json" "$RUNNER_TEMP/api-cost.json" "$EVALUATION" <<'PY'
        import json, sys
        from pathlib import Path
        state_path, report_path, evaluation = Path(sys.argv[1]), Path(sys.argv[2]), sys.argv[3]
        state = json.loads(state_path.read_text())
        report = json.loads(report_path.read_text()) if report_path.is_file() else {}
        cost = float(report.get("estimated_cost_usd", 0.0) or 0.0)
        state["spent_usd"] = float(state.get("spent_usd", 0.0)) + cost
        previous = state.setdefault("evaluations", {}).get(evaluation, {})
        state["evaluations"][evaluation] = {
            "estimated_cost_usd": round(
                float(previous.get("estimated_cost_usd", 0.0) or 0.0) + cost, 6
            ),
            "paid_inference_calls": (
                int(previous.get("paid_inference_calls", 0) or 0)
                + int(report.get("paid_inference_calls", 0) or 0)
            ),
        }
        state_path.write_text(json.dumps(state, indent=2, sort_keys=True) + "\n")
        print(json.dumps(state, indent=2, sort_keys=True))
        PY

    - name: Export paid-but-incomplete leaf state
      if: ${{ always() }}
      id: paid-partial-export
      continue-on-error: true
      shell: bash
      env:
        EVALUATION: ${{ inputs.evaluation }}
      run: |
        set -euo pipefail
        echo "changed=false" >> "$GITHUB_OUTPUT"
        if [ ! -f .quidra-benchmark/work/root/manifest.json ]; then
          exit 0
        fi
        mkdir -p "$RUNNER_TEMP/benchmark-paid-state"
        python benchmark/template/scripts/benchmark.py partial-paid-export \
          --workspace "$GITHUB_WORKSPACE/.quidra-benchmark" \
          --store "$RUNNER_TEMP/benchmark-paid-state" \
          --evaluation "$EVALUATION" \
          > "$RUNNER_TEMP/partial-paid-export.json"
        cat "$RUNNER_TEMP/partial-paid-export.json"
        changed="$(python - "$RUNNER_TEMP/partial-paid-export.json" <<'PY'
        import json, sys
        from pathlib import Path
        payload = json.loads(Path(sys.argv[1]).read_text())
        print("true" if int(payload.get("updated_unit_count", 0) or 0) > 0 else "false")
        PY
        )"
        echo "changed=$changed" >> "$GITHUB_OUTPUT"
        cp "$RUNNER_TEMP/partial-paid-export.json" \
          .quidra-benchmark/results/partial_paid_checkpoint_export.json

    - name: Save updated private paid-leaf checkpoint cache
      if: ${{ always() && steps.paid-partial-export.outputs.changed == 'true' }}
      continue-on-error: true
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/benchmark-paid-state
        key: quidra-benchmark-paid-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}

    - name: Checkpoint every newly certified unit
      if: ${{ always() }}
      id: checkpoint
      continue-on-error: true
      shell: bash
      env:
        EVALUATED_SHA: ${{ inputs.evaluated-sha }}
        RUN_ID: ${{ inputs.run-id }}
        EVALUATION: ${{ inputs.evaluation }}
      run: |
        set -euo pipefail
        if [ ! -f .quidra-benchmark/work/root/ledger.json ]; then
          echo "No frozen ledger; nothing to checkpoint."
          exit 0
        fi

        python benchmark/template/scripts/benchmark.py checkpoint-cache \
          --source-repo "$GITHUB_WORKSPACE" \
          | tee "$RUNNER_TEMP/cache-checkpoint.json"

        # Certified results remain content-addressed under benchmark/cache. The
        # run-specific checkpoint stores only trusted orchestration state needed
        # to reconstruct the same run if an Actions artifact disappears.
        checkpoint_dir="benchmark/checkpoints/$RUN_ID"
        mkdir -p "$checkpoint_dir"
        cp "$RUNNER_TEMP/benchmark-budget-state.json" "$checkpoint_dir/budget-state.json"
        python - "$checkpoint_dir/resume.json" "$EVALUATED_SHA" "$EVALUATION" <<'PY'
        import json, sys
        from pathlib import Path
        path, sha, evaluation = Path(sys.argv[1]), sys.argv[2], sys.argv[3]
        status_path = Path(".quidra-benchmark/results/primary_status.json")
        status = json.loads(status_path.read_text()) if status_path.is_file() else {}
        ledger_path = Path(".quidra-benchmark/work/root/ledger.json")
        ledger = json.loads(ledger_path.read_text()) if ledger_path.is_file() else {"units": {}}
        counts = {}
        for row in ledger.get("units", {}).values():
            key = str(row.get("status", "PENDING"))
            counts[key] = counts.get(key, 0) + 1
        path.write_text(json.dumps({
            "schema_version": 1,
            "evaluated_sha": sha,
            "last_evaluation": evaluation,
            "primary_status": status.get("evaluations", {}),
            "ledger_status_counts": counts,
        }, indent=2, sort_keys=True) + "\n")
        PY

        tar -czf "$RUNNER_TEMP/updated-cache.tgz" benchmark/cache
        tar -czf "$RUNNER_TEMP/updated-checkpoint.tgz" "$checkpoint_dir"
        git reset --hard
        git fetch origin benchmark
        unexpected="$(git diff --name-only "$EVALUATED_SHA"..origin/benchmark \
          | grep -Ev "^benchmark/cache/|^benchmark/checkpoints/$RUN_ID/" || true)"
        if [ -n "$unexpected" ]; then
          echo "::error::benchmark branch moved outside certified cache/resume state during the run:"
          echo "$unexpected"
          exit 1
        fi
        git checkout -B benchmark origin/benchmark
        rm -rf benchmark/cache "$checkpoint_dir"
        tar -xzf "$RUNNER_TEMP/updated-cache.tgz"
        tar -xzf "$RUNNER_TEMP/updated-checkpoint.tgz"
        git add -f benchmark/cache "$checkpoint_dir"
        if git diff --cached --quiet; then
          echo "No new certified cache or resume-state records."
          exit 0
        fi
        git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Checkpoint ${{ inputs.evaluation }} benchmark state for ${EVALUATED_SHA:0:7}"
        git push origin HEAD:benchmark

    - name: Read Primary status
      id: status
      if: ${{ always() }}
      shell: bash
      env:
        EVALUATION: ${{ inputs.evaluation }}
      run: |
        value="$(python - "$EVALUATION" <<'PY'
        import json, sys
        from pathlib import Path
        path = Path(".quidra-benchmark/results/primary_status.json")
        if not path.is_file():
            print("unknown")
        else:
            data = json.loads(path.read_text())
            print((data.get("evaluations", {}).get(sys.argv[1], {}) or {}).get("status", "unknown"))
        PY
        )"
        echo "value=$value" >> "$GITHUB_OUTPUT"
        echo "$EVALUATION status: $value"

    - name: Package workspace for the next Primary
      id: package
      if: ${{ always() }}
      shell: bash
      run: |
        set -euo pipefail
        echo "ready=false" >> "$GITHUB_OUTPUT"
        test -d .quidra-benchmark || exit 0
        test -f .quidra-benchmark/run.json || exit 0
        mkdir -p "$RUNNER_TEMP/benchmark-handoff"
        tar -czf "$RUNNER_TEMP/benchmark-handoff/workspace.tgz" .quidra-benchmark
        cp "$RUNNER_TEMP/benchmark-budget-state.json" \
          "$RUNNER_TEMP/benchmark-handoff/budget-state.json"
        cp "$RUNNER_TEMP/api-cost.json" \
          "$RUNNER_TEMP/benchmark-handoff/api-cost.json" 2>/dev/null || true
        cp "$RUNNER_TEMP/gateway-audit.jsonl" \
          "$RUNNER_TEMP/benchmark-handoff/gateway-audit.jsonl" 2>/dev/null || true
        cp "$RUNNER_TEMP/cache-checkpoint.json" \
          "$RUNNER_TEMP/benchmark-handoff/cache-checkpoint.json" 2>/dev/null || true
        echo "ready=true" >> "$GITHUB_OUTPUT"

    - name: Upload Primary handoff
      if: ${{ always() && steps.package.outputs.ready == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.handoff-name }}
        path: ${{ runner.temp }}/benchmark-handoff
        if-no-files-found: error
        retention-days: 30
        overwrite: true

    - name: Surface budget or paid-run failure after preserving the handoff
      if: ${{ always() && (steps.budget.outcome == 'failure' || steps.paid.outcome == 'failure' || steps.checkpoint.outcome == 'failure') }}
      shell: bash
      run: |
        echo "::error::The Primary job preserved its workspace/cache evidence but did not complete its trusted execution path."
        exit 1
