name: AI issue triage

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/issue-ai-triage.yml"
      - ".github/scripts/issue_triage.py"
      - "README.md"
      - "docs/spec/**"
      - "docs/packages.md"
      - "docs/development.md"
      - "quidra.manifest.json"
      - "project.toml"
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing issue number to triage manually
        required: true
        type: number

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-ai-triage-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  smoke-test:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out develop
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build synthetic issue event
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/smoke-issue.json" <<'EOF'
          {
            "issue": {
              "number": 0,
              "title": "Tensor comparison with mismatched shapes crashes instead of reporting an error",
              "body": "On Linux x86_64 using the current develop build, comparing tensor<float32><3, 224, 224> with tensor<float32><3, 224, 225> using < causes a crash. I expected a shape mismatch diagnostic."
            },
            "repository": {
              "full_name": "quidra-lang/quidra"
            }
          }
          EOF
          echo "QUIDRA_CONTEXT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Call OpenAI and validate structured triage
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_ISSUE_TRIAGE_MODEL: ${{ vars.OPENAI_ISSUE_TRIAGE_MODEL }}
          TRIAGE_CONTEXT_ROOT: ${{ github.workspace }}
          TRIAGE_EVENT_PATH: ${{ runner.temp }}/smoke-issue.json
          TRIAGE_OUTPUT: ${{ runner.temp }}/issue-triage.json
          QUIDRA_CONTEXT_REF: develop
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/issue_triage.py
          jq -e '.mode == "ai"' "$TRIAGE_OUTPUT"
          jq '{mode, category, area, needs_info, labels}' "$TRIAGE_OUTPUT"

  triage:
    if: ${{ github.event_name != 'push' && (github.event_name == 'workflow_dispatch' || !endsWith(github.actor, '[bot]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted workflow code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out current develop documentation
        uses: actions/checkout@v4
        with:
          ref: develop
          path: .triage-context
          persist-credentials: false

      - name: Record Quidra context commit
        shell: bash
        run: |
          echo "QUIDRA_CONTEXT_REF=develop" >> "$GITHUB_ENV"
          echo "QUIDRA_CONTEXT_SHA=$(git -C .triage-context rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Prepare issue event for manual run
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        shell: bash
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" > "$RUNNER_TEMP/issue.json"
          gh api "repos/$GITHUB_REPOSITORY" > "$RUNNER_TEMP/repository.json"
          jq -n \
            --slurpfile issue "$RUNNER_TEMP/issue.json" \
            --slurpfile repository "$RUNNER_TEMP/repository.json" \
            '{issue: $issue[0], repository: $repository[0]}' \
            > "$RUNNER_TEMP/manual-event.json"
          echo "TRIAGE_EVENT_PATH=$RUNNER_TEMP/manual-event.json" >> "$GITHUB_ENV"

      - name: Use GitHub issue event
        if: ${{ github.event_name != 'workflow_dispatch' }}
        shell: bash
        run: echo "TRIAGE_EVENT_PATH=$GITHUB_EVENT_PATH" >> "$GITHUB_ENV"

      - name: Read issue and generate triage response
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_ISSUE_TRIAGE_MODEL: ${{ vars.OPENAI_ISSUE_TRIAGE_MODEL }}
          TRIAGE_CONTEXT_ROOT: ${{ github.workspace }}/.triage-context
          TRIAGE_OUTPUT: ${{ runner.temp }}/issue-triage.json
        run: python3 .github/scripts/issue_triage.py

      - name: Ensure managed labels exist
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh label create "ai-triaged" --repo "$GITHUB_REPOSITORY" --color "0E8A16" --description "Initial triage performed automatically" 2>/dev/null || true
          gh label create "needs-info" --repo "$GITHUB_REPOSITORY" --color "D4C5F9" --description "More information is needed from the reporter" 2>/dev/null || true
          gh label create "area: core" --repo "$GITHUB_REPOSITORY" --color "1D76DB" --description "Quidra core compiler/runtime/tooling" 2>/dev/null || true
          gh label create "area: vision" --repo "$GITHUB_REPOSITORY" --color "5319E7" --description "Quidra Vision" 2>/dev/null || true
          gh label create "area: dnn" --repo "$GITHUB_REPOSITORY" --color "B60205" --description "Quidra DNN" 2>/dev/null || true
          gh label create "bug" --repo "$GITHUB_REPOSITORY" --color "D73A4A" --description "Something is not working" 2>/dev/null || true
          gh label create "enhancement" --repo "$GITHUB_REPOSITORY" --color "A2EEEF" --description "New feature or improvement" 2>/dev/null || true
          gh label create "documentation" --repo "$GITHUB_REPOSITORY" --color "0075CA" --description "Documentation" 2>/dev/null || true
          gh label create "question" --repo "$GITHUB_REPOSITORY" --color "D876E3" --description "Question" 2>/dev/null || true

      - name: Comment and apply triage labels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          TRIAGE_OUTPUT: ${{ runner.temp }}/issue-triage.json
        shell: bash
        run: |
          set -euo pipefail

          mode="$(jq -r '.mode' "$TRIAGE_OUTPUT")"
          if [[ "$mode" != "ai" ]]; then
            echo "::warning::Issue triage used fallback mode: $mode"
          fi

          reply_file="$RUNNER_TEMP/issue-triage-reply.md"
          jq -r '.reply' "$TRIAGE_OUTPUT" > "$reply_file"

          existing_id="$(
            gh api --paginate "repos/$GH_REPO/issues/$ISSUE_NUMBER/comments" \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- quidra-ai-triage -->"))) | .id' \
              | head -n 1
          )"

          if [[ -n "$existing_id" ]]; then
            jq -n --rawfile body "$reply_file" '{body: $body}' > "$RUNNER_TEMP/issue-triage-comment.json"
            gh api --method PATCH "repos/$GH_REPO/issues/comments/$existing_id" \
              --input "$RUNNER_TEMP/issue-triage-comment.json" >/dev/null
          else
            gh issue comment "$ISSUE_NUMBER" --repo "$GH_REPO" --body-file "$reply_file"
          fi

          while IFS= read -r label; do
            [[ -z "$label" ]] && continue
            gh issue edit "$ISSUE_NUMBER" --repo "$GH_REPO" --add-label "$label" >/dev/null
          done < <(jq -r '.labels[]' "$TRIAGE_OUTPUT")
