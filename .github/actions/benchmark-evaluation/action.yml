name: Run benchmark evaluation shard
description: Run one Primary evaluation against the frozen benchmark trigger SHA and checkpoint only certified cache.

inputs:
  evaluation:
    description: Primary evaluation name
    required: true
  run-id:
    description: Shared logical run identifier
    required: true
  total-budget-usd:
    description: Workflow-wide soft spend guard
    required: true
  prior-spend-usd:
    description: Estimated spend accumulated by earlier shards and provider smoke
    required: true
  model:
    description: Provider model
    required: false
    default: claude-sonnet-5
  concurrency:
    description: Dependency-ready work units in flight
    required: false
    default: "6"

outputs:
  cumulative-spend:
    description: Estimated workflow spend through this shard
    value: ${{ steps.cost.outputs.cumulative_spend }}
  evaluation-status:
    description: COMPLETE/PARTIAL/etc for this shard
    value: ${{ steps.status.outputs.evaluation_status }}
  checkpoint-sha:
    description: Disposable benchmark branch head after cache checkpoint
    value: ${{ steps.checkpoint.outputs.checkpoint_sha }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Freeze shard budget and runtime settings
      shell: bash
      run: |
        set -euo pipefail
        python - "${{ inputs.total-budget-usd }}" "${{ inputs.prior-spend-usd }}" <<'PY' > "$RUNNER_TEMP/shard-budget"
        import sys
        total = float(sys.argv[1])
        prior = float(sys.argv[2])
        remaining = total - prior
        if total <= 0:
            raise SystemExit("workflow budget must be positive")
        if remaining <= 0:
            raise SystemExit(
                f"workflow budget exhausted before this shard: total={total:.4f}, prior={prior:.4f}"
            )
        print(f"{remaining:.6f}")
        PY
        echo "BENCHMARK_IMAGE=quidra-benchmark/runtime:production" >> "$GITHUB_ENV"
        echo "BENCHMARK_MODEL=${{ inputs.model }}" >> "$GITHUB_ENV"
        echo "BENCHMARK_CONCURRENCY=${{ inputs.concurrency }}" >> "$GITHUB_ENV"
        echo "BENCHMARK_EVALUATION=${{ inputs.evaluation }}" >> "$GITHUB_ENV"
        echo "BENCHMARK_BUDGET_USD=$(cat "$RUNNER_TEMP/shard-budget")" >> "$GITHUB_ENV"
        echo "RUN_ID=${{ inputs.run-id }}" >> "$GITHUB_ENV"
        echo "EVALUATED_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"

    - name: Reclaim runner disk
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
          /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
        df -h /

    - name: Restore pinned toolchain image
      id: image-cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/quidra-benchmark-image.tar
        key: quidra-benchmark-image-${{ runner.os }}-${{ hashFiles('benchmark/template/runtime/**', 'benchmark/template/scripts/sandbox_launcher.py') }}

    - name: Build pinned ten-language image
      if: steps.image-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        python benchmark/template/runtime/check_pins.py
        python benchmark/template/scripts/sandbox_launcher.py build-image \
          --target toolchains --image "$BENCHMARK_IMAGE"
        python benchmark/template/scripts/sandbox_launcher.py doctor \
          --image "$BENCHMARK_IMAGE"
        docker save "$BENCHMARK_IMAGE" -o "$RUNNER_TEMP/quidra-benchmark-image.tar"

    - name: Load cached ten-language image
      if: steps.image-cache.outputs.cache-hit == 'true'
      shell: bash
      run: |
        set -euo pipefail
        docker load -i "$RUNNER_TEMP/quidra-benchmark-image.tar"
        python benchmark/template/scripts/sandbox_launcher.py doctor \
          --image "$BENCHMARK_IMAGE"

    - name: Stage the exact evaluated snapshot
      shell: bash
      run: |
        set -euo pipefail
        git checkout -B benchmark "$GITHUB_SHA"
        python benchmark/template/scripts/benchmark.py init \
          --source-repo "$GITHUB_WORKSPACE" \
          --sandbox-mode container \
          --run-id "$RUN_ID" \
          --provider anthropic-messages \
          --model "$BENCHMARK_MODEL"

    - name: Import certified cache checkpointed by earlier shards
      shell: bash
      run: |
        set -euo pipefail
        git fetch origin benchmark
        CACHE_BUNDLE="$RUNNER_TEMP/remote-benchmark-cache"
        rm -rf "$CACHE_BUNDLE"
        mkdir -p "$CACHE_BUNDLE"
        if git cat-file -e "origin/benchmark:benchmark/cache" 2>/dev/null; then
          git archive origin/benchmark benchmark/cache | tar -x -C "$CACHE_BUNDLE"
          python benchmark/template/scripts/ci_cache_handoff.py workspace-import \
            --workspace "$GITHUB_WORKSPACE/.quidra-benchmark" \
            --cache "$CACHE_BUNDLE/benchmark/cache"
        else
          echo "No remote certified cache to import."
        fi

    - name: Deterministic preparation for this Primary evaluation
      shell: bash
      run: |
        set -euo pipefail
        python benchmark/template/scripts/sandbox_launcher.py run \
          --source-repo "$GITHUB_WORKSPACE" \
          --image "$BENCHMARK_IMAGE" \
          --provider fake \
          -- python3 /quidra-benchmark/template/scripts/benchmark.py prepare \
             --evaluation "$BENCHMARK_EVALUATION"

    - name: Freeze trusted task policy and spend ceilings
      shell: bash
      run: |
        set -euo pipefail
        python benchmark/template/scripts/production_run.py policy \
          --workspace "$GITHUB_WORKSPACE/.quidra-benchmark" \
          --model "$BENCHMARK_MODEL" \
          --output "$RUNNER_TEMP/task-policy.json" \
          --evaluation "$BENCHMARK_EVALUATION"

    - name: Run paid shard
      id: paid
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ env.ANTHROPIC_API_KEY }}
      run: |
        set -euo pipefail
        python benchmark/template/scripts/sandbox_launcher.py run \
          --source-repo "$GITHUB_WORKSPACE" \
          --image "$BENCHMARK_IMAGE" \
          --provider anthropic-messages \
          --model "$BENCHMARK_MODEL" \
          --budget-usd "$BENCHMARK_BUDGET_USD" \
          --network-policy disabled \
          --task-policy "$RUNNER_TEMP/task-policy.json" \
          --gateway-log-out "$RUNNER_TEMP/gateway-audit.jsonl" \
          -- python3 /quidra-benchmark/template/scripts/production_run.py run \
             --workspace /quidra-benchmark \
             --max-wall-seconds 18900 \
             --concurrency "$BENCHMARK_CONCURRENCY" \
             --evaluation "$BENCHMARK_EVALUATION"

    - name: Record shard API usage
      id: cost
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        if [ -f "$RUNNER_TEMP/gateway-audit.jsonl" ]; then
          python benchmark/template/scripts/production_run.py cost-report \
            --log "$RUNNER_TEMP/gateway-audit.jsonl" \
            --output "$RUNNER_TEMP/api-cost.json"
        else
          cat > "$RUNNER_TEMP/api-cost.json" <<'JSON'
        {
          "schema_version": 1,
          "estimated_cost_usd": 0.0,
          "paid_inference_calls": 0,
          "input_tokens": 0,
          "cache_read_input_tokens": 0,
          "cache_creation_input_tokens": 0,
          "output_tokens": 0,
          "empty_completions": 0,
          "gateway_errors": {},
          "by_task": {}
        }
        JSON
        fi
        cumulative="$(python - "${{ inputs.prior-spend-usd }}" "$RUNNER_TEMP/api-cost.json" <<'PY'
        import json, sys
        prior = float(sys.argv[1])
        current = float(json.load(open(sys.argv[2]))["estimated_cost_usd"])
        print(f"{prior + current:.6f}")
        PY
        )"
        echo "cumulative_spend=$cumulative" >> "$GITHUB_OUTPUT"
        python - "$RUNNER_TEMP/api-cost.json" "$cumulative" <<'PY'
        import json, sys
        report = json.load(open(sys.argv[1]))
        print(
            f"shard spend: ${report['estimated_cost_usd']:.2f}; "
            f"workflow cumulative: ${float(sys.argv[2]):.2f}; "
            f"calls={report['paid_inference_calls']}"
        )
        PY

    - name: Snapshot shard workspace evidence
      if: always()
      shell: bash
      run: |
        if [ -d .quidra-benchmark ]; then
          tar -czf "$RUNNER_TEMP/workspace-evidence.tgz" \
            --ignore-failed-read \
            -C .quidra-benchmark \
            run.json results raw prompts work/agents work/attempts \
            work/root/manifest.json work/root/ledger.json \
            work/root/plans work/root/commands 2>/dev/null || true
        fi

    - name: Checkpoint certified cache to disposable benchmark branch
      id: checkpoint
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        echo "checkpoint_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        if [ ! -f .quidra-benchmark/work/root/ledger.json ]; then
          echo "No frozen ledger exists; nothing can be certified."
          exit 0
        fi

        python benchmark/template/scripts/benchmark.py checkpoint-cache \
          --source-repo "$GITHUB_WORKSPACE" \
          | tee "$RUNNER_TEMP/cache-checkpoint.json"

        CURRENT_CACHE="$RUNNER_TEMP/current-certified-cache"
        rm -rf "$CURRENT_CACHE"
        mkdir -p "$CURRENT_CACHE"
        if [ -d benchmark/cache ]; then
          cp -a benchmark/cache/. "$CURRENT_CACHE/"
        fi

        git fetch origin benchmark
        remote_head="$(git rev-parse origin/benchmark)"
        git merge-base --is-ancestor "$GITHUB_SHA" "$remote_head" || {
          echo "::error::remote benchmark is no longer descended from the frozen trigger SHA"
          exit 1
        }
        bad="$(git diff --name-only "$GITHUB_SHA"..origin/benchmark \
          | grep -Ev '^benchmark/(cache/|template/prompts/)' || true)"
        if [ -n "$bad" ]; then
          echo "::error::benchmark moved in non-artifact paths while the paid run was active:"
          printf '%s\n' "$bad"
          exit 1
        fi

        git reset --hard "$remote_head"
        python benchmark/template/scripts/ci_cache_handoff.py merge \
          --incoming "$CURRENT_CACHE" \
          --target benchmark/cache
        git add -f benchmark/cache
        if ! git diff --cached --quiet; then
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Checkpoint ${{ inputs.evaluation }} benchmark cache for ${GITHUB_SHA:0:7}"
          git push origin HEAD:benchmark
        fi
        echo "checkpoint_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Record evaluation status
      id: status
      if: always()
      shell: bash
      run: |
        status="UNKNOWN"
        file=".quidra-benchmark/results/evaluations/${{ inputs.evaluation }}.json"
        if [ -f "$file" ]; then
          status="$(python - "$file" <<'PY'
        import json, sys
        print((json.load(open(sys.argv[1])).get("status") or "UNKNOWN"))
        PY
        )"
        fi
        echo "evaluation_status=$status" >> "$GITHUB_OUTPUT"
        echo "${{ inputs.evaluation }} status: $status"

    - name: Preserve shard evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-${{ inputs.run-id }}-${{ inputs.evaluation }}
        if-no-files-found: ignore
        retention-days: 30
        path: |
          ${{ runner.temp }}/workspace-evidence.tgz
          ${{ runner.temp }}/api-cost.json
          ${{ runner.temp }}/gateway-audit.jsonl
          ${{ runner.temp }}/task-policy.json
          ${{ runner.temp }}/cache-checkpoint.json
          benchmark/cache
          .quidra-benchmark/results/evaluations/${{ inputs.evaluation }}.json
