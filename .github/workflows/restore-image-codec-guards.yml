name: restore-image-codec-guards

on:
  push:
    branches:
      - chatgpt/image-dtypes-20260917
    paths:
      - tools/restore_image_codec_guards.py
      - .github/workflows/restore-image-codec-guards.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore codec boundary guards
        run: python3 tools/restore_image_codec_guards.py
      - name: Check patch
        run: git diff --check
      - name: Commit guards
        run: |
          git config user.name "quidra-ci"
          git config user.email "actions@users.noreply.github.com"
          git add src/runtime_image.cpp
          if git diff --cached --quiet; then
            echo "No guard changes needed"
          else
            git commit -m "fix: preserve image codec boundary guards"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
