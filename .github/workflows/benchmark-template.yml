              "Java":"java","TypeScript":"typescript","Kotlin":"kotlin","Swift":"swift","Zig":"zig",
          }
          def probe_slug(value):
              return value.lower().replace(".", "-")

          ids = []
          for language in langs:
              for probe_id in probe_ids:
                  fragment = (
                      "synthetic_wrapper()"
                      if language == "Python" and probe_id == "F10.P1"
                      else "synthetic_fragment()"
                  )
                  record = {
                      "level": "FULL",
                      "fragment": fragment,
                      "partial_reasons": [],
                      "none_reason": None,
                      "justification": "Synthetic canonical fragment selected under R1-R10.",
                      "citation": "Synthetic frozen documentation citation.",
                  }
                  verification = {
                      "entry_file": "main.txt",
                      "fragment_files": ["main.txt"],
                      "files": {
