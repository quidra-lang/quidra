name: benchmark-runtime-image

# The ten-language image is too slow to build on every change to the benchmark
# template, so benchmark-template.yml builds only its `base` stage. This
# workflow owns the full image: it runs whenever the image definition itself
# changes, on demand, and weekly so upstream pin rot surfaces on its own rather
# than during a measurement run.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches: [develop]
    paths:
      - "benchmark/template/runtime/**"
      - ".github/workflows/benchmark-runtime-image.yml"
  pull_request:
    paths:
      - "benchmark/template/runtime/**"
      - ".github/workflows/benchmark-runtime-image.yml"

jobs:
  pins:
    # Seconds instead of the tens of minutes a build takes, so a moved upstream
    # release is an obvious failure rather than a confusing one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every pinned toolchain artifact still resolves
        run: python benchmark/template/runtime/check_pins.py

  image:
    needs: pins
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reclaim runner disk for the toolchain image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Build the ten-language runtime image
        run: |
          # verify_toolchains.py runs inside the build, so a toolchain whose
          # reported version disagrees with toolchains.json fails here rather
          # than shipping an unrecorded toolchain into a measurement run.
          python benchmark/template/scripts/sandbox_launcher.py build-image \
            --target toolchains --image quidra-benchmark/runtime:ci-full
          python benchmark/template/scripts/sandbox_launcher.py doctor \
            --image quidra-benchmark/runtime:ci-full

      - name: Stage the sandbox workspace
        run: |
          rm -rf .quidra-benchmark
          git checkout -B develop "$GITHUB_SHA"
          python benchmark/template/scripts/benchmark.py init \
            --source-repo "$GITHUB_WORKSPACE" --sandbox-mode container
          mkdir -p "$RUNNER_TEMP/fake"
          cat > "$RUNNER_TEMP/fake/script.json" <<'JSON'
          {"schema_version": 1, "default": "runtime image smoke completion"}
          JSON

      - name: All nine comparison toolchains are usable inside the sandbox
        run: |
          python benchmark/template/scripts/sandbox_launcher.py run \
            --source-repo "$GITHUB_WORKSPACE" \
            --image quidra-benchmark/runtime:ci-full \
            --provider fake --fake-script "$RUNNER_TEMP/fake/script.json" \
            -- python3 /quidra-benchmark/template/scripts/benchmark.py \
               toolchain-scan --strict
          python - <<'PY'
          import json
          from pathlib import Path

          scan = json.loads(Path(".quidra-benchmark/results/toolchains.json").read_text())
          assert scan["ok"], scan["missing"]
          assert not scan["missing"], scan["missing"]

          pins = json.loads(
              Path("benchmark/template/runtime/toolchains.json").read_text()
          )["toolchains"]
          # The scan is what reuse-status compares against the catalog, so the
          # versions it reports have to be the versions the image pinned.
          expected = {
              "C++": pins["CLANG_PIN"],
              "Python": pins["PYTHON_PIN"],
              "Rust": pins["RUST_PIN"],
              "Go": pins["GO_PIN"],
              "Java": pins["JAVA_PIN"],
              "Kotlin": pins["KOTLIN_PIN"],
              "Swift": pins["SWIFT_PIN"],
              "Zig": pins["ZIG_PIN"],
              "TypeScript": f"tsc {pins['TYPESCRIPT_PIN']}; node {pins['NODE_PIN']}",
          }
          for language, want in expected.items():
              got = scan["toolchains"][language]["canonical"]
              assert got == want, (language, got, want)
          print(json.dumps(
              {lang: scan["toolchains"][lang]["canonical"] for lang in expected},
              indent=2, sort_keys=True,
          ))
          PY

      - name: The image records what it actually installed
        run: |
          docker run --rm --network none --user 1000:1000 \
            quidra-benchmark/runtime:ci-full \
            cat /opt/quidra-benchmark/toolchains-observed.json > observed.json
          python - <<'PY'
          import json
          from pathlib import Path
          observed = json.loads(Path("observed.json").read_text())
          pinned = json.loads(
              Path("benchmark/template/runtime/toolchains.json").read_text()
          )["toolchains"]
          assert observed["pins"] == pinned, (observed["pins"], pinned)
          assert observed["observed"], observed
          print(json.dumps(observed["observed"], indent=2, sort_keys=True))
          PY

      - name: Preflight passes inside the full image
        run: |
          python benchmark/template/scripts/sandbox_launcher.py run \
            --source-repo "$GITHUB_WORKSPACE" \
            --image quidra-benchmark/runtime:ci-full \
            --provider fake --fake-script "$RUNNER_TEMP/fake/script.json" \
            -- python3 /quidra-benchmark/template/scripts/benchmark.py preflight
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path(".quidra-benchmark/results/preflight.json").read_text())
          assert result["ok"], result["problems"]
          observed = result["observed_isolation"]
          assert observed["network_interfaces"] == ["lo"], observed
          assert observed["writable"] == {"repo": False, "template": False, "work": True}, observed
          PY

      - name: The evaluated snapshot builds against the image's dependencies
        run: |
          # The image deliberately ships no Quidra compiler. This is the check
          # that it nevertheless carries everything needed to build one from the
          # snapshot, which is what a real run does before measuring.
          python benchmark/template/scripts/sandbox_launcher.py run \
            --source-repo "$GITHUB_WORKSPACE" \
            --image quidra-benchmark/runtime:ci-full \
            --provider fake --fake-script "$RUNNER_TEMP/fake/script.json" \
            -- sh -c 'cmake -S /quidra-benchmark/repo -B /quidra-benchmark/work/root/target-build -DCMAKE_BUILD_TYPE=Release'
          test -f .quidra-benchmark/work/root/target-build/CMakeCache.txt

      - name: Discard the staging workspace
        if: always()
        run: |
          python benchmark/template/scripts/benchmark.py discard-workspace \
            --source-repo "$GITHUB_WORKSPACE" || true
