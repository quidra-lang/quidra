          grep -q '4:.*error\\[REAL_RANGE\\] Constant real64 expression produces NaN:' "$TMP/constant.out"
          [[ "$(grep -c 'error\\[' "$TMP/constant.out")" -eq 4 ]]

          '''+s[b:]
          rep('# Parsing never makes a non-finite value.','# Parsing accepts signed infinity but rejects NaN and finite range overflow.')
          rep("$(printf 'error\\nerror\\nerror\\nerror\\nerror\\n1.5')","$(printf 'error\\ninf\\n-inf\\nerror\\nerror\\n1.5')")
          rep('''tensor<real32> twice = big + big
          print("after")
          QUI
          fails tensor_overflow 101 REAL_OVERFLOW 'tensor<real32> addition overflow' '4:24'
          [[ "$(cat "$TMP/tensor_overflow.out")" == "3.0e+38" ]]''',
          '''tensor<real32> twice = big + big
          print(twice[1].item())
          QUI
