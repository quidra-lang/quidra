              )
          PY
          for SLUG in f01-p1 f02-p1 f03-p1 f04-p1 f05-p1 f06-p1 f07-p1 f08-p1 f09-p1 f10-p1 f11-p1 f12-p1 f13-p1 f14-p1 f15-p1 f16-p1 f17-p1 f18-p1 f19-p1 f20-p1; do
            ID="sc-support-adjudication--$SLUG"
            AGENT="worker-$ID"
            python benchmark/template/scripts/benchmark.py task-start --workspace "$TMP" --id "$ID"
            python benchmark/template/scripts/benchmark.py task-apply --workspace "$TMP" --id "$AGENT" < "$TMP/raw/$AGENT.response.json"
            python benchmark/template/scripts/benchmark.py task-finish --workspace "$TMP" --id "$ID"
          done
          python benchmark/template/scripts/benchmark.py advance --workspace "$TMP" --evaluation semantic_compression

          # First make comparability fail on one blinded pair. The runner must
          # apply the complete pair-specific repair, rebuild comparability only,
          # and keep every metric/support unit COMPLETE.
          python - <<'PY'
          from pathlib import Path
          import json
          root = Path(".benchmark-template-test")
          agent = "worker-sc-comparability"
          labels = json.loads(
              (root / "work/root/comparability_blinding.json").read_text()
          )["labels"]
          python_label = labels["Python"]
          payload = {
              "schema_version": 1,
              "evaluation": "semantic_compression",
              "requirements": {"gate.comparability_audit": False},
              "evidence": {
                  "gate_result": {
                      "pass": False,
                      "reason": "synthetic F10 support inconsistency",
                      "affected_pairs_requiring_revalidation": [
                          {"probe_id": "F10.P1", "label": python_label}
                      ],
                  },
                  "repair_directives": [{
                      "probe_id": "F10.P1",
                      "label": python_label,
                      "record": {
                          "level": "PARTIAL",
                          "fragment": "synthetic_wrapper()",
                          "partial_reasons": ["P-c"],
                          "none_reason": None,
                          "justification": "Synthetic repaired support record with an undocumented guarantee.",
                          "citation": "Synthetic guarantee documentation citation."
                      }
                  }]
              },
          }
          response = {
              "schema_version": 1,
              "task_id": agent,
              "files": [{"path": "result.json", "content": json.dumps(payload, indent=2) + "\n"}],
          }
          (root / "raw" / f"{agent}.response.json").write_text(json.dumps(response) + "\n")
          PY
          python benchmark/template/scripts/benchmark.py task-start --workspace "$TMP" --id sc-comparability
          python benchmark/template/scripts/benchmark.py task-apply --workspace "$TMP" --id worker-sc-comparability < "$TMP/raw/worker-sc-comparability.response.json"
          python benchmark/template/scripts/benchmark.py task-finish --workspace "$TMP" --id sc-comparability || true
          python - <<'PY'
          from pathlib import Path
          import json
          ledger = json.loads(Path(".benchmark-template-test/work/root/ledger.json").read_text())
          assert ledger["units"]["sc-support-adjudication--f10-p1"]["status"] == "COMPLETE"
          assert ledger["units"]["sc-comparability"]["status"] == "PENDING"
          for uid, state in ledger["units"].items():
              if uid.startswith("sc-metrics-"):
                  assert state["status"] == "COMPLETE", (uid, state)
          PY

          # Direct pair repair preserves all support and metric units; rebuild
          # only the comparability packet from the validated repair record.
          python benchmark/template/scripts/benchmark.py advance --workspace "$TMP" --evaluation semantic_compression

          python - <<'PY'
          from pathlib import Path
          import json
          root = Path(".benchmark-template-test")
          agent = "worker-sc-comparability"
          payload = {
              "schema_version": 1,
              "evaluation": "semantic_compression",
              "requirements": {"gate.comparability_audit": True},
              "evidence": {"ci": "gate pass after targeted repair"},
          }
          response = {
              "schema_version": 1,
              "task_id": agent,
              "files": [{"path": "result.json", "content": json.dumps(payload, indent=2) + "\n"}],
          }
          (root / "raw" / f"{agent}.response.json").write_text(json.dumps(response) + "\n")
          PY
          python benchmark/template/scripts/benchmark.py task-start --workspace "$TMP" --id sc-comparability
          python benchmark/template/scripts/benchmark.py task-apply --workspace "$TMP" --id worker-sc-comparability < "$TMP/raw/worker-sc-comparability.response.json"
          python benchmark/template/scripts/benchmark.py task-finish --workspace "$TMP" --id sc-comparability
          python benchmark/template/scripts/benchmark.py advance --workspace "$TMP" --evaluation semantic_compression

          python - <<'PY'
          from pathlib import Path
          import json
          root = Path(".benchmark-template-test")
          result = json.loads((root / "results/evaluations/semantic_compression.json").read_text())
          assert result["status"] == "COMPLETE", result
          assert len(result["ranking"]) == 10, result
          assert result["ranking"][0]["language"] == "Quidra", result
          primary = json.loads((root / "results/primary_status.json").read_text())
          assert primary["evaluations"]["semantic_compression"]["ranking"], primary
          PY

          # Stale RUNNING work is automatically reclaimable instead of hanging forever.
          # Materialize Ecosystem's own dependency-ready Task Packets first; the
          # Semantic Compression fixture above intentionally no longer advances
          # unrelated Primaries.
          python benchmark/template/scripts/benchmark.py advance --workspace "$TMP" --evaluation ecosystem
          python benchmark/template/scripts/benchmark.py task-start --workspace "$TMP" --id ecosystem-external--part-1--quidra
          echo "stale-attempt-evidence" > "$TMP/work/agents/worker-ecosystem-external--part-1--quidra/stale.txt"
          python - <<'PY'
          from pathlib import Path
          import json
          p = Path(".benchmark-template-test/work/root/ledger.json")
          data = json.loads(p.read_text())
          data["units"]["ecosystem-external--part-1--quidra"]["heartbeat_at_utc"] = "2000-01-01T00:00:00+00:00"
          p.write_text(json.dumps(data, indent=2) + "\n")
          PY
          python benchmark/template/scripts/benchmark.py reclaim-stale --workspace "$TMP"
          python - <<'PY'
          from pathlib import Path
          import json
          data = json.loads(Path(".benchmark-template-test/work/root/ledger.json").read_text())
          assert data["units"]["ecosystem-external--part-1--quidra"]["status"] == "PENDING"
          assert data["units"]["ecosystem-external--part-1--quidra"]["attempts"] == 1
          PY

          # A terminal blocker must propagate to work that actually depends on it
          # without poisoning independent Ecosystem metric units.
          python benchmark/template/scripts/benchmark.py ledger-update \
            --workspace "$TMP" --id ecosystem-external--part-1--quidra --status BLOCKED \
            --blocker "synthetic CI infrastructure blocker" \
            --blocker-class infrastructure
          python benchmark/template/scripts/benchmark.py advance --workspace "$TMP" --evaluation ecosystem
          python - <<'PY'
          from pathlib import Path
          import json
          root = Path(".benchmark-template-test")
          ledger = json.loads((root / "work/root/ledger.json").read_text())
          assert ledger["units"]["ecosystem-aggregate"]["status"] == "BLOCKED"
          assert ledger["units"]["ecosystem-tooling--part-1--quidra"]["status"] == "PENDING"
          assert ledger["units"]["ecosystem-tooling--part-1--python"]["status"] == "PENDING"
          assert ledger["units"]["ecosystem-tooling--part-1--zig"]["status"] == "PENDING"
          status = json.loads((root / "results/primary_status.json").read_text())
          eco = status["evaluations"]["ecosystem"]
          assert eco["status"] == "PARTIAL", eco
          assert eco["blocker_class"] == "infrastructure", eco
          assert eco["ranking"] is None, eco
          PY

          rm -rf "$TMP"


      - name: Exercise host staging bootstrap
        run: |
          rm -rf .quidra-benchmark
          git checkout -B develop "$GITHUB_SHA"
          OUTSIDE="$RUNNER_TEMP/quidra-benchmark-cwd"
          rm -rf "$OUTSIDE"
          mkdir -p "$OUTSIDE"
          (
            cd "$OUTSIDE"
            python "$GITHUB_WORKSPACE/benchmark/template/scripts/benchmark.py" init \
              --source-repo "$GITHUB_WORKSPACE" --sandbox-mode external-sandbox
          )
          test -f "$GITHUB_WORKSPACE/.quidra-benchmark/run.json"
          test ! -e "$OUTSIDE/.quidra-benchmark"
          SENTINEL="$(git rev-parse --git-path quidra-benchmark-host.json)"
          export SENTINEL
          test -f "$SENTINEL"
          test ! -e "$GITHUB_WORKSPACE/.quidra-benchmark/quidra-benchmark-host.json"
          python - <<'PY'
          from pathlib import Path
          import json
          import os
          root = Path(".quidra-benchmark")
          run = json.loads((root / "run.json").read_text())
          sentinel_path = Path(os.environ["SENTINEL"])
          sentinel = json.loads(sentinel_path.read_text())
          assert root not in sentinel_path.parents
          assert run["workspace_root"] == "/quidra-benchmark"
          assert sentinel["kind"] == "quidra-benchmark-host-staging-v1"
          assert sentinel["run_id"] == run["run_id"]
          assert sentinel["evaluated_commit_sha"] == run["evaluated"]["commit_sha"]
          assert sentinel["canonical_workspace_root"] == "/quidra-benchmark"
          assert "source_path_sha256" not in sentinel
          assert "/Users/" not in json.dumps(run)
          assert "/home/" not in json.dumps(run)
          assert "/Users/" not in json.dumps(sentinel)
          assert "/home/" not in json.dumps(sentinel)
          PY
          git check-ignore -q .quidra-benchmark/run.json

          # A hosted-job handoff carries the ignored workspace but not .git,
          # so the next trusted job must be able to recreate only the sentinel
          # after proving the run belongs to this exact clean checkout.
          EVALUATED="$(python - <<'PY'
          import json
          print(json.load(open(".quidra-benchmark/run.json"))["evaluated"]["commit_sha"])
          PY
          )"
          rm "$SENTINEL"
          test ! -e "$SENTINEL"
          python benchmark/template/scripts/benchmark.py restore-workspace-guard \
            --source-repo "$GITHUB_WORKSPACE" \
            --expected-commit "$EVALUATED"
          test -f "$SENTINEL"

          # Abandoned runs must remain safely discardable even if sandbox state is damaged.
          rm .quidra-benchmark/run.json
          python benchmark/template/scripts/benchmark.py discard-workspace \
            --source-repo "$GITHUB_WORKSPACE"
          test ! -e .quidra-benchmark
          test ! -e "$SENTINEL"

          # A checkout may be moved or renamed after init. Even an older sentinel
          # carrying a stale source_path_sha256 must not make safe discard impossible.
          DISCARD_ORIG="$RUNNER_TEMP/quidra-discard-origin"
          DISCARD_MOVED="$RUNNER_TEMP/quidra-discard-moved"
          rm -rf "$DISCARD_ORIG" "$DISCARD_MOVED"
          mkdir -p "$DISCARD_ORIG/.quidra-benchmark"
          git -C "$DISCARD_ORIG" init -b develop
          cat > "$DISCARD_ORIG/.git/quidra-benchmark-host.json" <<'JSON'
          {
            "schema_version": 1,
            "kind": "quidra-benchmark-host-staging-v1",
            "source_path_sha256": "obsolete-path-bound-value",
            "run_id": "synthetic-discard-after-move",
            "evaluated_commit_sha": "deadbeef",
            "canonical_workspace_root": "/quidra-benchmark"
          }
          JSON
          mv "$DISCARD_ORIG" "$DISCARD_MOVED"
          python benchmark/template/scripts/benchmark.py discard-workspace \
            --source-repo "$DISCARD_MOVED"
          test ! -e "$DISCARD_MOVED/.quidra-benchmark"
          test ! -e "$DISCARD_MOVED/.git/quidra-benchmark-host.json"
          rm -rf "$DISCARD_MOVED"

      - name: Exercise finalized run import and cleanup
        run: |
