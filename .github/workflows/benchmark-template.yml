          test -f "$OUT/import_manifest.json"
          export OUT
          python - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(
              (Path(os.environ["OUT"]) / "import_manifest.json").read_text()
          )
          assert manifest["schema_version"] == 2, manifest
          assert manifest["post_run_source_branch"] == "benchmark", manifest
          assert manifest["post_run_source_commit"] == os.environ["POST_RUN_SOURCE_COMMIT"], manifest
          assert "imported_into_develop_commit" not in manifest, manifest
