name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y clang-15 cmake ninja-build libcurl4-openssl-dev libpng-dev libjpeg-dev libtiff-dev libwebp-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Native smoke test
        run: bash scripts/native-smoke.sh ./build/quidra "$PWD"
      - name: Package Debian archive
        run: |
          cpack --config build/CPackConfig.cmake -G DEB -B dist
          cp dist/quidra_*_amd64.deb dist/quidra-linux-amd64.deb
      - name: Create portable archive
        run: |
          mkdir -p stage/quidra-linux-x86_64/bin stage/quidra-linux-x86_64/lib/quidra stage/quidra-linux-x86_64/share/quidra
          cp build/quidra stage/quidra-linux-x86_64/bin/
          cp build/libquidra_runtime.a stage/quidra-linux-x86_64/lib/quidra/
          cp README.md LICENSE quidra.manifest.json stage/quidra-linux-x86_64/share/quidra/
          cp -r docs examples stage/quidra-linux-x86_64/share/quidra/
          tar -C stage -czf dist/quidra-linux-x86_64.tar.gz quidra-linux-x86_64
      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          name: Quidra ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/quidra-linux-amd64.deb
            dist/quidra-linux-x86_64.tar.gz

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging dependencies
        run: brew install curl libpng jpeg-turbo libtiff webp
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix curl);$(brew --prefix libpng);$(brew --prefix jpeg-turbo);$(brew --prefix libtiff);$(brew --prefix webp)"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Native smoke test
        run: bash scripts/native-smoke.sh ./build/quidra "$PWD"
      - name: Package
        run: |
          cpack --config build/CPackConfig.cmake -G TGZ -B dist
          package="$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"
          test -n "$package"
          cp "$package" "dist/quidra-macos-$(uname -m).tar.gz"
      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          name: Quidra ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/quidra-macos-*.tar.gz

  windows-x86_64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging dependencies
        shell: pwsh
        run: vcpkg install curl:x64-windows libpng:x64-windows libjpeg-turbo:x64-windows tiff:x64-windows libwebp:x64-windows
      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Native smoke test
        shell: pwsh
        run: |
          Set-Content -Path build/platform-smoke.qui -Value 'print("Hello from Windows")'
          $output = & build/Release/quidra.exe run build/platform-smoke.qui
          if (($output -join "`n").Trim() -ne "Hello from Windows") { throw "native smoke failed: $output" }
      - name: Package
        shell: pwsh
        run: |
          cpack --config build/CPackConfig.cmake -C Release -G ZIP -B dist
          $package = Get-ChildItem dist -Filter '*.zip' | Select-Object -First 1
          if (-not $package) { throw "Windows package was not produced" }
          Copy-Item $package.FullName dist/quidra-windows-x86_64.zip
      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          name: Quidra ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/quidra-windows-x86_64.zip
