                  }
                  response = {
                      "schema_version": 1,
                      "task_id": agent,
                      "files": [{"path": "result.json", "content": json.dumps(payload, indent=2) + "\n"}],
                  }
                  (root / "raw" / f"{agent}.response.json").write_text(
                      json.dumps(response) + "\n"
