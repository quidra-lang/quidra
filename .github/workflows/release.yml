name: release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open("quidra.manifest.json"))["compiler_version"])')"
          test -n "$version"
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Create immutable release tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "release tag $tag already exists" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" "$GITHUB_SHA" -m "Quidra $tag"
          git push origin "$tag"

  linux-x86_64:
    needs: prepare-release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y clang-15 llvm-15 cmake ninja-build git curl xz-utils libcurl4-openssl-dev libpng-dev libjpeg-dev libtiff-dev libwebp-dev ffmpeg libavformat-dev libavcodec-dev libavutil-dev libswscale-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Native smoke test
        run: bash scripts/native-smoke.sh ./build/quidra "$PWD"
      - name: Package Debian archive
        run: |
          cpack --config build/CPackConfig.cmake -G DEB -B dist
          cp dist/quidra_*_amd64.deb dist/quidra-linux-amd64.deb
      - name: Create portable archive
        run: |
          mkdir -p stage/quidra-linux-x86_64/bin stage/quidra-linux-x86_64/lib/quidra stage/quidra-linux-x86_64/share/quidra
          cp build/quidra stage/quidra-linux-x86_64/bin/
          cp build/libquidra_runtime.a stage/quidra-linux-x86_64/lib/quidra/
          cp build/libquidra_runtime_jit.so stage/quidra-linux-x86_64/lib/quidra/
          cp README.md LICENSE quidra.manifest.json stage/quidra-linux-x86_64/share/quidra/
          cp -r docs examples stage/quidra-linux-x86_64/share/quidra/
          tar -C stage -czf dist/quidra-linux-x86_64.tar.gz quidra-linux-x86_64
      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          name: Quidra ${{ needs.prepare-release.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/quidra-linux-amd64.deb
            dist/quidra-linux-x86_64.tar.gz

  macos:
    needs: prepare-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging dependencies
        run: brew install llvm curl libpng jpeg-turbo libtiff webp ffmpeg
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix curl);$(brew --prefix libpng);$(brew --prefix jpeg-turbo);$(brew --prefix libtiff);$(brew --prefix webp);$(brew --prefix ffmpeg)"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Native smoke test
        run: bash scripts/native-smoke.sh ./build/quidra "$PWD"
      - name: Package
        run: |
          cpack --config build/CPackConfig.cmake -G TGZ -B dist
          package="$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"
          test -n "$package"
          cp "$package" "dist/quidra-macos-$(uname -m).tar.gz"
      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          name: Quidra ${{ needs.prepare-release.outputs.tag }}
          generate_release_notes: true
          files: dist/quidra-macos-*.tar.gz

  windows-x86_64:
    needs: prepare-release
    runs-on: windows-latest
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite"
    steps:
      - uses: actions/checkout@v4
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .vcpkg-binary-cache
          key: vcpkg-windows-x64-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            vcpkg-windows-x64-${{ runner.os }}-
      - name: Prepare vcpkg binary cache
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path .vcpkg-binary-cache | Out-Null
      - name: Install packaging dependencies
        shell: pwsh
        run: vcpkg install curl:x64-windows libpng:x64-windows libjpeg-turbo:x64-windows tiff:x64-windows libwebp:x64-windows ffmpeg:x64-windows
      - name: Ensure LLVM JIT runner
        shell: pwsh
        run: |
          if (-not (Get-Command lli.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path "C:\Program Files\LLVM\bin\lli.exe")) {
            choco install llvm -y --no-progress
          }
      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Native smoke test
        shell: pwsh
        run: |
          Set-Content -Path build/platform-smoke.qui -Value 'print("Hello from Windows")'
          $jitOutput = & build/Release/quidra.exe build/platform-smoke.qui
          if (($jitOutput -join "`n").Trim() -ne "Hello from Windows") { throw "JIT smoke failed: $jitOutput" }
          $output = & build/Release/quidra.exe run build/platform-smoke.qui
          if (($output -join "`n").Trim() -ne "Hello from Windows") { throw "native smoke failed: $output" }
      - name: Package
        shell: pwsh
        run: |
          cpack --config build/CPackConfig.cmake -C Release -G ZIP -B dist
          $package = Get-ChildItem dist -Filter '*.zip' | Select-Object -First 1
          if (-not $package) { throw "Windows package was not produced" }
          Copy-Item $package.FullName dist/quidra-windows-x86_64.zip
      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          name: Quidra ${{ needs.prepare-release.outputs.tag }}
          generate_release_notes: true
          files: dist/quidra-windows-x86_64.zip
