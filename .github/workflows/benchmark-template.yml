      - name: Exercise host staging bootstrap
        run: |
          rm -rf .quidra-benchmark
          git checkout -B develop "$GITHUB_SHA"
          OUTSIDE="$RUNNER_TEMP/quidra-benchmark-cwd"
          rm -rf "$OUTSIDE"
          mkdir -p "$OUTSIDE"
          (
            cd "$OUTSIDE"
