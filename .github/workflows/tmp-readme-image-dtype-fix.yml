name: tmp-readme-image-dtype-fix

on:
  push:
    branches:
      - docs-image-dtype-20260917

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs-image-dtype-20260917
          fetch-depth: 0
      - name: Update stale image dtype description
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          old = "├── image       file I/O using tensor<uint8>"
          new = "├── image       dtype-preserving tensor image I/O"
          count = text.count(old)
          if count == 0:
              print("README already updated")
              raise SystemExit(0)
          if count != 1:
              raise SystemExit(f"expected exactly one stale image line, found {count}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: fix image dtype boundary description"
          git push origin HEAD:docs-image-dtype-20260917
