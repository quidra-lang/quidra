name: benchmark-zero-cost-verification

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/benchmark-zero-cost-verification.yml"
      - "benchmark/template/scripts/benchmark.py"
      - "benchmark/template/config/cache_policy.json"

permissions:
  contents: read

concurrency:
  group: benchmark-zero-cost-verification-v2
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BENCHMARK_MODEL: claude-sonnet-5
      BENCHMARK_IMAGE: quidra-benchmark/runtime:zero-cost-verification
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prove certified cache is self-contained
        run: |
          python - <<'PY'
          from pathlib import Path

          forbidden_cache = (
              '"language_version"',
              '"measurement_script_hashes"',
              '"mode": "probe-from-canonical-baseline-owner"',
              '"source_record": "baseline/semantic-owners/',
          )
          offenders = []
          for path in sorted(Path("benchmark/cache/v1").rglob("*.json")):
              text = path.read_text(encoding="utf-8")
              for needle in forbidden_cache:
                  if needle in text:
                      offenders.append((str(path), needle))
          live = Path("benchmark/template/scripts/benchmark.py").read_text(encoding="utf-8")
          for needle in (
              "detach_legacy_semantic_probe_projection",
              "detached_semantic_projection_metadata_equivalent",
              "probe-from-canonical-baseline-owner",
              "baseline/semantic-owners",
              "MECHANICAL_EPOCH_RATCHET",
          ):
              if needle in live:
                  offenders.append(("benchmark/template/scripts/benchmark.py", needle))
          assert not offenders, offenders
          suspicious_paths = [
              str(path) for path in Path("benchmark").rglob("*")
              if any(word in str(path).lower() for word in (
                  "semantic-owners", "migration", "legacy", "old-cache", "one-shot"
              ))
          ]
          assert not suspicious_paths, suspicious_paths
          print("migration residue: none")
          PY

      - name: Cache impact must be clean before prepare
        run: |
          set +e
          python benchmark/template/scripts/benchmark.py cache-impact \
            --source-repo "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/cache-impact.json"
          rc=$?
          set -e
          test "$rc" -eq 0
          python - <<'PY'
          import json, os
          from pathlib import Path
          summary = json.loads(Path(os.environ["RUNNER_TEMP"], "cache-impact.json").read_text())
          assert summary["invalid"] == [], summary
          assert summary["invalid_by_evaluation"] == {}, summary
          assert summary["superseded"] == [], summary
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Build the exact pinned runtime image
        run: |
          python benchmark/template/runtime/check_pins.py
          python benchmark/template/scripts/sandbox_launcher.py build-image \
            --target toolchains --image "$BENCHMARK_IMAGE"
          python benchmark/template/scripts/sandbox_launcher.py doctor \
            --image "$BENCHMARK_IMAGE"

      - name: Run the production free prepare path with no provider
        run: |
          set -euo pipefail
          rm -rf .quidra-benchmark
          run_id="zero-cost-${GITHUB_RUN_ID}"
          python benchmark/template/scripts/benchmark.py init \
            --source-repo "$GITHUB_WORKSPACE" \
            --sandbox-mode container \
            --run-id "$run_id" \
            --provider anthropic-messages \
            --model "$BENCHMARK_MODEL"
          python benchmark/template/scripts/sandbox_launcher.py run \
            --source-repo "$GITHUB_WORKSPACE" \
            --image "$BENCHMARK_IMAGE" \
            --provider fake \
            -- python3 /quidra-benchmark/template/scripts/benchmark.py prepare

      - name: Prove every residual cache miss is free runner-owned work
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path(".quidra-benchmark")
          manifest = json.loads((root / "work/root/manifest.json").read_text())
          ledger = json.loads((root / "work/root/ledger.json").read_text())
          cache = json.loads((root / "results/cache_status.json").read_text())
          units = {str(unit["id"]): unit for unit in manifest["work_units"]}
          misses = cache.get("misses", {}) or {}
          invalidated = cache.get("invalidated", {}) or {}
          details = []
          for uid, miss in sorted(misses.items()):
              unit = units[uid]
              state = ledger["units"][uid]
              assert unit.get("execution_kind") == "command", (uid, unit, miss)
              assert int(unit.get("max_llm_calls", 0) or 0) == 0, (uid, unit, miss)
              assert state["status"] == "COMPLETE", (uid, state, miss)
              assert state.get("validation_result") == "PASS", (uid, state, miss)
              assert uid not in invalidated, (uid, invalidated[uid])
              details.append({
                  "work_unit_id": uid,
                  "evaluation": unit.get("evaluation"),
                  "runner_action": unit.get("runner_action"),
                  "reason": miss.get("reason"),
                  "status": state.get("status"),
                  "validation_result": state.get("validation_result"),
                  "max_llm_calls": int(unit.get("max_llm_calls", 0) or 0),
              })
          print(json.dumps({
              "cache_miss_count": len(misses),
              "residual_free_runner_units": details,
          }, indent=2, sort_keys=True))
          PY

      - name: Prove every mechanical shard reused cache
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path(".quidra-benchmark")
          manifest = json.loads((root / "work/root/manifest.json").read_text())
          ledger = json.loads((root / "work/root/ledger.json").read_text())
          cache = json.loads((root / "results/cache_status.json").read_text())
          mechanical = [
              unit for unit in manifest["work_units"]
              if unit.get("runner_action") in {"micro-measure-raw", "adversarial-measure"}
          ]
          assert len(mechanical) == 20, [u["id"] for u in mechanical]
          for unit in mechanical:
              uid = unit["id"]
              state = ledger["units"][uid]
              assert state["status"] == "COMPLETE", (uid, state)
              assert state.get("validation_result") == "PASS", (uid, state)
              assert uid in cache.get("hits", {}), (uid, cache.get("misses", {}).get(uid))
              assert uid not in cache.get("misses", {}), (uid, cache["misses"][uid])
              assert uid not in cache.get("invalidated", {}), (uid, cache["invalidated"][uid])
          print(json.dumps({
              "mechanical_shards": len(mechanical),
              "cache_hit_count": cache.get("hit_count"),
              "cache_miss_count": len(cache.get("misses", {})),
              "cache_invalidated_count": len(cache.get("invalidated", {})),
          }, indent=2, sort_keys=True))
          PY

      - name: Prove the current full run has zero paid scope
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/budget-plan.json"
          python benchmark/template/scripts/production_run.py budget-plan \
            --workspace "$GITHUB_WORKSPACE/.quidra-benchmark" \
            --model "$BENCHMARK_MODEL" \
            --available-usd 0 \
            --safety-multiplier 1.25 \
            --smoke-reserve-usd 0.10 \
            --output "$plan"
          python - "$plan" <<'PY'
          import json, sys
          from pathlib import Path
          plan = json.loads(Path(sys.argv[1]).read_text())
          assert not plan.get("hard_blockers"), plan
          assert plan["pending_agent_units"] == 0, plan
          assert plan["estimated_uncached_usd"] == 0, plan
          assert plan["expected_paid_api_calls_upper_bound"] == 0, plan
          assert plan["provider_smoke_required"] is False, plan
          assert plan["smoke_reserve_usd"] == 0, plan
          assert plan["recommended_budget_usd"] == 0, plan
          assert plan["sufficient"] is True, plan
          print(json.dumps({
              "pending_agent_units": plan["pending_agent_units"],
              "estimated_uncached_usd": plan["estimated_uncached_usd"],
              "expected_paid_api_calls_upper_bound": plan["expected_paid_api_calls_upper_bound"],
              "provider_smoke_required": plan["provider_smoke_required"],
              "recommended_budget_usd": plan["recommended_budget_usd"],
              "sufficient": plan["sufficient"],
          }, indent=2, sort_keys=True))
          PY
