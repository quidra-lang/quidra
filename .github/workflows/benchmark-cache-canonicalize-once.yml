# one-shot trigger after workflow registration
name: benchmark-cache-canonicalize-once

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/benchmark-cache-canonicalize-once.yml"

permissions:
  contents: write

concurrency:
  group: benchmark-cache-canonicalize-once
  cancel-in-progress: false

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      BASELINE_RUN: 2026-09-25-5dc8989-gh25
      EVALUATED_SHA: 5dc8989342d3920ad1a64262696757257958e0aa
      BENCHMARK_MODEL: claude-sonnet-5
      BENCHMARK_IMAGE: quidra-benchmark/runtime:canonicalize-once
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Refuse stale or unsafe starting point
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin develop --prune
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/develop)" = "$GITHUB_SHA"
          test ! -e benchmark/.run-production
          test -f "benchmark/$BASELINE_RUN/summary.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path("benchmark") / os.environ["BASELINE_RUN"]
          summary = json.loads((root / "summary.json").read_text())
          assert (summary.get("evaluated") or {}).get("commit_sha") == os.environ["EVALUATED_SHA"], summary
          evaluations = summary.get("primary_evaluations") or {}
          expected = {
              "semantic_compression",
              "llm_learnability",
              "language_quality",
              "ecosystem",
              "llm_proficiency",
          }
          assert set(evaluations) == expected, evaluations
          assert all(
              (evaluations[name] or {}).get("status") == "COMPLETE"
              and not (evaluations[name] or {}).get("blockers")
              for name in expected
          ), evaluations
          PY

      - name: Canonicalize completed baseline and remove obsolete cache history
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/benchmark_cleanup_once.py
          python -m py_compile             .github/scripts/benchmark_cleanup_once.py             benchmark/template/scripts/benchmark.py
          test ! -e benchmark/cache/provenance
          test ! -e benchmark/cache/snapshots
          test ! -e benchmark/cache/recertification-report.json
          test ! -e benchmark/cache/proficiency-recertification-audit.json
          test ! -e benchmark/template/scripts/audit_proficiency_legacy.py
          test ! -e .github/workflows/cache-recertify-once.yml
          test ! -e .github/workflows/benchmark-paid-state-keepalive.yml
          test "$(find benchmark/cache/v1 -type f -name '*.json' | wc -l)" -eq 688

      - name: Prove retained cache is structurally current
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python benchmark/template/scripts/benchmark.py cache-impact \
            --source-repo "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/cache-impact.json"
          rc=$?
          set -e
          cat "$RUNNER_TEMP/cache-impact.json"
          test "$rc" -eq 0
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = json.loads(Path(os.environ["RUNNER_TEMP"], "cache-impact.json").read_text())
          assert int(p.get("valid", 0)) == 688, p
          assert not p.get("invalid"), p
          PY

      - name: Build production-equivalent free validation image
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          python benchmark/template/runtime/check_pins.py
          python benchmark/template/scripts/sandbox_launcher.py build-image \
            --target toolchains --image "$BENCHMARK_IMAGE"
          python benchmark/template/scripts/sandbox_launcher.py doctor \
            --image "$BENCHMARK_IMAGE"

      - name: Clean-room prepare and hydrate with no provider credential
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .quidra-benchmark
          python benchmark/template/scripts/benchmark.py init \
            --source-repo "$GITHUB_WORKSPACE" \
            --sandbox-mode container \
            --run-id canonical-baseline-replay \
            --provider anthropic-messages \
            --model "$BENCHMARK_MODEL"

          python benchmark/template/scripts/sandbox_launcher.py run \
            --source-repo "$GITHUB_WORKSPACE" \
            --image "$BENCHMARK_IMAGE" \
            --provider fake \
            -- python3 /quidra-benchmark/template/scripts/benchmark.py prepare

          python benchmark/template/scripts/production_run.py budget-plan \
            --workspace "$GITHUB_WORKSPACE/.quidra-benchmark" \
            --model "$BENCHMARK_MODEL" \
            --available-usd 1.0 \
            --safety-multiplier 1.25 \
            --smoke-reserve-usd 0.10 \
            --output "$RUNNER_TEMP/budget-plan.json"

          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(".quidra-benchmark")
          plan = json.loads(Path(os.environ["RUNNER_TEMP"], "budget-plan.json").read_text())
          cache = json.loads((root / "results/cache_usage.json").read_text())
          print(json.dumps({
              "expected_paid_api_calls_upper_bound":
                  plan.get("expected_paid_api_calls_upper_bound"),
              "recommended_budget_usd": plan.get("recommended_budget_usd"),
              "cache_hits": cache.get("hit_count"),
              "cache_misses": cache.get("miss_count"),
              "cache_invalidated": cache.get("invalidated_count"),
          }, indent=2, sort_keys=True))
          assert int(plan.get("expected_paid_api_calls_upper_bound", 0) or 0) == 0, plan
          assert float(plan.get("recommended_budget_usd", 0) or 0) == 0.0, plan
          assert int(cache.get("miss_count", 0) or 0) == 0, cache
          assert int(cache.get("invalidated_count", 0) or 0) == 0, cache
          PY

      - name: Remove one-shot workflow and commit only after proof
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/benchmark-cache-canonicalize-once.yml
          rm -f .github/scripts/benchmark_cleanup_once.py
          rm -rf .quidra-benchmark

          git fetch origin develop --prune
          if [ "$(git rev-parse origin/develop)" != "$GITHUB_SHA" ]; then
            echo "develop moved during cleanup; refusing to race it" >&2
            exit 1
          fi

          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test ! -e benchmark/.run-production
          git diff --cached --check
          git commit -m "Canonicalize completed benchmark cache baseline"
          git push origin HEAD:develop
