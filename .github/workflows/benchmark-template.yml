name: benchmark-template

on:
  push:
    branches: [develop]
    paths:
      - "benchmark/master_prompt.md"
      - "benchmark/README.md"
      - "benchmark/.run-production"
      - "benchmark/template/**"
      - "tests/benchmark_isolation_tests.py"
      - "tests/benchmark_cache_tests.py"
      - "tests/benchmark_adversarial_tests.py"
      - "tests/benchmark_semantic_compression_tests.py"
      - "benchmark/cache/**"
      - "benchmark/config.json"
      - ".github/workflows/benchmark-template.yml"
      - ".github/workflows/benchmark-production.yml"
      - ".github/actions/benchmark-primary/**"
  pull_request:
    paths:
      - "benchmark/master_prompt.md"
      - "benchmark/README.md"
      - "benchmark/.run-production"
      - "benchmark/template/**"
      - "tests/benchmark_isolation_tests.py"
      - "tests/benchmark_cache_tests.py"
      - "tests/benchmark_adversarial_tests.py"
      - "tests/benchmark_semantic_compression_tests.py"
      - "benchmark/cache/**"
      - ".github/workflows/benchmark-template.yml"
      - ".github/workflows/benchmark-production.yml"
      - ".github/actions/benchmark-primary/**"

concurrency:
  group: benchmark-template-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reject paid-run marker in source history
        run: |
          test ! -e benchmark/.run-production || {
            echo "::error::benchmark/.run-production must exist only on the disposable benchmark branch"
            exit 1
          }

      - name: Parse and verify benchmark workflow structure
        run: |
          ruby - <<'RUBY'
          require "yaml"
          workflow = YAML.load_file(".github/workflows/benchmark-production.yml", aliases: true)
          YAML.load_file(".github/actions/benchmark-primary/action.yml", aliases: true)
          jobs = workflow.fetch("jobs")
          expected_needs = {
            "scoped-recover1" => ["prepare", "scoped-run"],
            "scoped-recover2" => ["prepare", "scoped-recover1"],
            "semantic-compression" => ["prepare"],
            "llm-learnability" => ["prepare", "semantic-compression"],
            "language-quality" => ["prepare", "llm-learnability"],
            "ecosystem" => ["prepare", "language-quality"],
            "llm-proficiency" => ["prepare", "ecosystem"],
            "recover-semantic-compression" => ["prepare", "llm-proficiency"],
            "recover-llm-learnability" => ["prepare", "recover-semantic-compression"],
            "recover-language-quality" => ["prepare", "recover-llm-learnability"],
            "recover-ecosystem" => ["prepare", "recover-language-quality"],
            "recover-llm-proficiency" => ["prepare", "recover-ecosystem"],
            "recover2-semantic-compression" => ["prepare", "recover-llm-proficiency"],
            "recover2-llm-learnability" => ["prepare", "recover2-semantic-compression"],
            "recover2-language-quality" => ["prepare", "recover2-llm-learnability"],
            "recover2-ecosystem" => ["prepare", "recover2-language-quality"],
            "recover2-llm-proficiency" => ["prepare", "recover2-ecosystem"],
            "finalize" => ["prepare", "recover2-llm-proficiency"],
          }
          expected_needs.each do |name, expected|
            actual = Array(jobs.fetch(name)["needs"])
            raise "#{name}: needs=#{actual.inspect}, expected=#{expected.inspect}" unless actual == expected
          end

          action = YAML.load_file(".github/actions/benchmark-primary/action.yml", aliases: true)
          allowed_inputs = action.fetch("inputs").keys
          jobs.each do |job_name, job|
            Array(job["steps"]).each do |step|
              next unless step["uses"] == "./.github/actions/benchmark-primary"
              unexpected = step.fetch("with", {}).keys - allowed_inputs
              raise "#{job_name}: unknown benchmark-primary inputs #{unexpected.inspect}" unless unexpected.empty?
            end
          end

          expression = "$" + "{{ needs.prepare.outputs.run_id }}"
          base = "benchmark-" + expression
          chain = [
            ["scoped-recover1", "#{base}-scoped", "#{base}-scoped-recovery1"],
            ["scoped-recover2", "#{base}-scoped-recovery1", "#{base}-scoped-recovery2"],
            ["semantic-compression", "#{base}-prepared", "#{base}-semantic-compression"],
            ["llm-learnability", "#{base}-semantic-compression", "#{base}-llm-learnability"],
            ["language-quality", "#{base}-llm-learnability", "#{base}-language-quality"],
            ["ecosystem", "#{base}-language-quality", "#{base}-ecosystem"],
            ["llm-proficiency", "#{base}-ecosystem", "#{base}-llm-proficiency"],
            ["recover-semantic-compression", "#{base}-llm-proficiency", "#{base}-recovery-semantic-compression"],
            ["recover-llm-learnability", "#{base}-recovery-semantic-compression", "#{base}-recovery-llm-learnability"],
            ["recover-language-quality", "#{base}-recovery-llm-learnability", "#{base}-recovery-language-quality"],
            ["recover-ecosystem", "#{base}-recovery-language-quality", "#{base}-recovery-ecosystem"],
            ["recover-llm-proficiency", "#{base}-recovery-ecosystem", "#{base}-recovery-llm-proficiency"],
            ["recover2-semantic-compression", "#{base}-recovery-llm-proficiency", "#{base}-recovery2-semantic-compression"],
            ["recover2-llm-learnability", "#{base}-recovery2-semantic-compression", "#{base}-recovery2-llm-learnability"],
            ["recover2-language-quality", "#{base}-recovery2-llm-learnability", "#{base}-recovery2-language-quality"],
            ["recover2-ecosystem", "#{base}-recovery2-language-quality", "#{base}-recovery2-ecosystem"],
            ["recover2-llm-proficiency", "#{base}-recovery2-ecosystem", "#{base}-recovery2-llm-proficiency"],
          ]
          chain.each do |name, previous, handoff|
            step = jobs.fetch(name).fetch("steps").find do |candidate|
              candidate["uses"] == "./.github/actions/benchmark-primary"
            end
            raise "#{name}: benchmark-primary step missing" unless step
            inputs = step.fetch("with")
            raise "#{name}: handoff mismatch" unless inputs["handoff-name"] == handoff
            raise "#{name}: previous handoff mismatch" unless inputs["previous-handoff"] == previous
          end

          smoke = jobs.fetch("prepare").fetch("steps").find { |step| step["id"] == "smoke" }
          raise "prepare provider smoke missing" unless smoke
          smoke_run = smoke.fetch("run", "")
          raise "provider smoke does not prove shared-prefix caching" unless smoke_run.include?("--prefix-probe-text")

          production_text = File.read(".github/workflows/benchmark-production.yml")
          final_checkpoint_markers = [
            'updated-prompts.tgz',
            '^benchmark/template/prompts/',
            'git add -f benchmark/cache benchmark/template/prompts "$checkpoint_dir"',
            'git add -f "benchmark/$RUN_ID" benchmark/cache benchmark/template/prompts',
          ]
          final_checkpoint_markers.each do |marker|
            raise "final checkpoint no longer preserves certified prompt dependencies: #{marker}" unless production_text.include?(marker)
          end

          readme = File.read("benchmark/README.md").gsub(/\s+/, " ")
          order = "Semantic Compression → LLM Learnability → Language Quality → Ecosystem → LLM Proficiency"
          raise "README five-Primary order drifted from workflow" unless readme.include?(order)
          raise "README reconciliation drops versioned language cache" unless readme.include?("<language>_v<version>")
          RUBY

      - name: Versioned language generation contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import importlib.util
          import json

          spec = importlib.util.spec_from_file_location(
              "benchmark_cli", "benchmark/template/scripts/benchmark.py"
          )
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          current_version = module.project_version(Path("."))
          assert current_version
          current_id = module.quidra_version_id(current_version)

          metadata = json.loads(
              Path("benchmark/template/config/benchmark_metadata.json").read_text()
          )
          current_generations = module.language_generations(
              Path("."), metadata["languages"]
          )
          general_history = module.load_language_generation_history_from_cache(
              Path("benchmark/cache")
          )
          archived_ids = {
              str(row["generation_id"])
              for row in general_history["generations"]
          }
          assert {
              row["generation_id"] for row in current_generations.values()
          } <= archived_ids, (current_generations, archived_ids)
          assert len(current_generations) == 10

          base = module.load_quidra_version_history_from_cache(Path("benchmark/cache"))
          base_ids = [str(row["language_id"]) for row in base["versions"]]
          assert len(base_ids) == len(set(base_ids)), base_ids

          # The already-published run is immutable: derive its Quidra generation
          # from version history instead of assuming it is always today's version.
          existing_run_id = "2026-09-25-5dc8989-gh25"
          existing_generation = next(
              row for row in base["versions"]
              if str(row.get("source_run_id") or "") == existing_run_id
          )
          existing_id = str(existing_generation["language_id"])
          existing_versioned = json.loads(
              Path(f"benchmark/{existing_run_id}/versioned_scores.json").read_text()
          )
          for evaluation, published in existing_versioned["evaluations"].items():
              assert published["current_quidra_id"] == existing_id, (evaluation, published)
              assert published["language_count"] == 10, (evaluation, published)
              assert existing_id in published["scores"], (evaluation, published)
              assert "Quidra" not in published["scores"], (evaluation, published)
              assert any(row["language"] == existing_id for row in published["ranking"])
              assert not any(row["language"] == "Quidra" for row in published["ranking"])
              for values in published["normalized_metric_scores"].values():
                  assert "Quidra" not in values, (evaluation, values)
              expected_quidra_metrics = (
                  existing_generation["normalized_metric_scores"].get(evaluation, {})
              )
              for requirement_id in expected_quidra_metrics:
                  assert existing_id in published["normalized_metric_scores"][requirement_id], (
                      evaluation, requirement_id
                  )

          fixed = {
              "Quidra": 77.5, "Python": 47.0, "C++": 20.0, "Rust": 68.0,
              "Go": 72.0, "Java": 53.0, "TypeScript": 48.0, "Kotlin": 69.0,
              "Swift": 77.0, "Zig": 78.0,
          }

          # A checkout may have bumped project.toml before the new generation
          # has been benchmarked. Both states are valid: current may already be
          # archived, or it may be the one pending generation to append.
          current_scores, current_order = module.versioned_scores_from_history(
              fixed, "semantic_compression", current_version, base
          )
          expected_current_count = 9 + len(base_ids) + (0 if current_id in base_ids else 1)
          assert len(current_scores) == expected_current_count, current_scores
          assert len(current_order) == expected_current_count, current_order
          assert current_id in current_scores
          assert all(language_id in current_scores for language_id in base_ids)

          # No 11/12 ceiling exists. Add fifty synthetic generations that cannot
          # collide with ordinary release versions and require every score and
          # normalized-metric table to grow to 9 + N rows.
          history = json.loads(json.dumps(base))
          existing_versions = {
              str(row.get("version") or "") for row in history.get("versions", [])
          }
          synthetic_versions = []
          patch = 0
          while len(synthetic_versions) < 50:
              version = f"999.0.{patch}"
              patch += 1
              if version == current_version or version in existing_versions:
                  continue
              history["versions"].append({
                  "version": version,
                  "language_id": module.quidra_version_id(version),
                  "source_run_id": f"synthetic-{version}",
                  "source_commit_sha": "0" * 40,
                  "primary_scores": {
                      "semantic_compression": 50.0 + len(synthetic_versions) / 10.0
                  },
                  "normalized_metric_scores": {
                      "semantic_compression": {
                          "metric.semantic_density":
                              40.0 + len(synthetic_versions) / 10.0
                      }
                  },
              })
              existing_versions.add(version)
              synthetic_versions.append(version)

              scores, order = module.versioned_scores_from_history(
                  fixed, "semantic_compression", version, history
              )
              expected = 9 + len(history["versions"])
              assert len(scores) == expected, (version, len(scores), expected)
              assert len(order) == expected, (version, len(order), expected)
              assert all(
                  str(row["language_id"]) in scores
                  for row in history["versions"]
              )

              current_metrics = {
                  "metric.semantic_density": {
                      "Quidra": 99.0,
                      "Python": 1.0,
                      "C++": 2.0,
                      "Rust": 3.0,
                      "Go": 4.0,
                      "Java": 5.0,
                      "TypeScript": 6.0,
                      "Kotlin": 7.0,
                      "Swift": 8.0,
                      "Zig": 9.0,
                  }
              }
              expanded_metrics = module.versioned_normalized_metric_scores(
                  current_metrics,
                  "semantic_compression",
                  version,
                  history,
              )
              density = expanded_metrics["metric.semantic_density"]
              assert len(density) == expected, (version, len(density), expected)
              assert all(
                  str(row["language_id"]) in density
                  for row in history["versions"]
              )

          # Same project.toml version owns one immutable Quidra generation even
          # when target implementation/docs drift. Benchmark-owned scientific
          # conditions still invalidate reuse.
          payload = {
              "schema_version": 1,
              "cache_schema_version": 1,
              "evaluation": "llm_learnability",
              "work_unit_id": "learnability-i3-i4--quidra",
              "requirement_ids": ["condition.i3", "condition.i4"],
              "assigned_languages": ["Quidra"],
              "provider": "anthropic-messages",
              "model": "claude-sonnet-5",
              "frozen_sampling": {"effort": "high"},
              "unit_input_hashes": {"primary_config": "same"},
              "runtime_toolchain_pins": {"Quidra": {}},
              "cache_epoch": "stable",
              "exact_task_packet_sha256": "old",
              "readable_input_content_hashes": {"repo/docs": "old"},
              "quidra_target": {"version": current_version, "language_version": "0.2"},
          }
          changed_implementation = json.loads(json.dumps(payload))
          changed_implementation["exact_task_packet_sha256"] = "new"
          changed_implementation["readable_input_content_hashes"] = {"repo/docs": "new"}
          changed_implementation["quidra_target"]["language_version"] = "999"
          assert module.same_version_cache_payload_compatible(
              changed_implementation, payload
          ), "same project version must reuse/skip Quidra"

          changed_version = json.loads(json.dumps(changed_implementation))
          changed_version["quidra_target"]["version"] = (
              "999.999.998" if current_version != "999.999.998" else "999.999.997"
          )
          assert not module.same_version_cache_payload_compatible(
              changed_version, payload
          ), "new project version must create a new Quidra generation"

          changed_model = json.loads(json.dumps(changed_implementation))
          changed_model["model"] = "different-model"
          assert not module.same_version_cache_payload_compatible(
              changed_model, payload
          ), "scientific benchmark-condition changes must still invalidate reuse"
          PY

      - name: Certified cache reuse contract
        run: python tests/benchmark_cache_tests.py

      - name: Validate template and CLI
        run: |
          python -m py_compile benchmark/template/scripts/benchmark.py
          python -m py_compile benchmark/template/scripts/micro_measure.py
          python -m py_compile benchmark/template/scripts/adversarial_measure.py
          python -m py_compile benchmark/template/scripts/inference_gateway.py
          python -m py_compile benchmark/template/scripts/gateway_client.py
          python -m py_compile benchmark/template/scripts/sandbox_agent.py
          python -m py_compile benchmark/template/scripts/sandbox_launcher.py
          python -m py_compile benchmark/template/scripts/synthetic_run.py
          python -m py_compile benchmark/template/scripts/production_run.py
          python benchmark/template/scripts/production_run.py budget-plan --help >/dev/null
          python -m py_compile benchmark/template/runtime/verify_toolchains.py
          bash -n benchmark/template/runtime/install_toolchains.sh
          python benchmark/template/scripts/check_metadata.py
          python benchmark/template/scripts/micro_measure.py --help >/dev/null
          python benchmark/template/scripts/adversarial_measure.py --help >/dev/null
          python -m json.tool benchmark/template/config/benchmark_metadata.json >/dev/null
          python -m json.tool benchmark/template/config/primary.json >/dev/null
          python -m json.tool benchmark/template/config/evaluation_requirements.json >/dev/null
          python -m json.tool benchmark/template/config/execution_ownership.json >/dev/null
          python -m json.tool benchmark/template/config/work_plan_templates.json >/dev/null
          python -m json.tool benchmark/template/config/aggregation.json >/dev/null
          python -m json.tool benchmark/template/config/semantic_compression_comparability.json >/dev/null
          python -m json.tool benchmark/template/config/inference_gateway.json >/dev/null
          python -m json.tool benchmark/template/config/sandbox_agent.json >/dev/null
          python -m json.tool benchmark/template/config/cache_policy.json >/dev/null
          python -m json.tool benchmark/config.json >/dev/null
          python -m json.tool benchmark/2026-09-25-5dc8989-gh25/versioned_scores.json >/dev/null
          python -m json.tool benchmark/cache/v1/semantic-compression/generation_raw_seed.json >/dev/null
          for generation in benchmark/cache/v1/*/*_v*/generation.json; do
            python -m json.tool "$generation" >/dev/null
          done
          python -m json.tool benchmark/template/runtime/toolchains.json >/dev/null
          python -m json.tool benchmark/template/reuse/catalog.json >/dev/null
          python benchmark/template/scripts/benchmark.py --help >/dev/null
          python benchmark/template/scripts/inference_gateway.py --help >/dev/null
          python benchmark/template/scripts/gateway_client.py --help >/dev/null
          python benchmark/template/scripts/sandbox_agent.py --help >/dev/null
          python benchmark/template/scripts/sandbox_launcher.py --help >/dev/null
          python benchmark/template/scripts/sandbox_launcher.py contract >/dev/null

          python - <<'PY'
          from pathlib import Path
          import importlib.util
          import json
          import tempfile

          spec = importlib.util.spec_from_file_location(
              "benchmark_cli", "benchmark/template/scripts/benchmark.py"
          )
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          ranking = module.deterministic_ranking(
              {"A": 80.004, "B": 80.003, "C": 79.99},
              ["A", "B", "C"],
          )
          assert [row["rank"] for row in ranking] == [1, 1, 3], ranking
          assert [row["score"] for row in ranking] == [80.0, 80.0, 79.99], ranking

          current_version = module.project_version(Path("."))
          assert current_version
          history = module.load_quidra_version_history_from_cache(Path("benchmark/cache"))
          history_ids = [str(row["language_id"]) for row in history["versions"]]
          assert len(history_ids) == len(set(history_ids)), history_ids

          root = Path("benchmark/template")
          required = [
              root / "methodology" / "worker_core.md",
              root / "methodology" / "common.md",
              root / "methodology" / "execution_policy.md",
              root / "methodology" / "orchestration.md",
              root / "methodology" / "semantic_compression.md",
              root / "methodology" / "llm_learnability.md",
              root / "methodology" / "language_quality.md",
              root / "methodology" / "ecosystem.md",
              root / "methodology" / "llm_proficiency.md",
              root / "config" / "aggregation.json",
              root / "config" / "work_plan_templates.json",
              root / "config" / "execution_ownership.json",
              root / "config" / "quidra_representation_schema.json",
              root / "config" / "semantic_compression_comparability.json",
              root / "programs" / "python" / "micro" / "mb01.py",
              root / "programs" / "python" / "micro" / "mb00.py",
              root / "fixtures" / "micro" / "reference",
              root / "validators" / "micro" / "check_micro.py",
              root / "methodology-assets" / "semantic_compression" / "capability_universe.json",
              root / "methodology-assets" / "semantic_compression" / "semantic_site_matrix.json",
              root / "methodology-assets" / "llm_proficiency" / "workloads.json",
          ]
          missing = [str(path) for path in required if not path.exists()]
          assert not missing, missing

          requirements = json.loads(
              (root / "config" / "evaluation_requirements.json").read_text()
          )["evaluations"]
          ownership = json.loads(
              (root / "config" / "execution_ownership.json").read_text()
          )["evaluations"]
          assert set(requirements) == set(module.PRIMARY_NAMES), requirements
          assert set(ownership) == set(module.PRIMARY_NAMES), ownership
          for evaluation in module.PRIMARY_NAMES:
              required_ids = set(requirements[evaluation]["required"])
              row = ownership[evaluation]
              runner = set(row.get("runner_command_requirements", []))
              agent = set(row.get("agent_requirements", []))
              prefixes = tuple(row.get("agent_requirement_prefixes", []))
              assert not (runner & agent), (evaluation, runner & agent)
              missing_ownership = sorted(
                  rid for rid in required_ids
                  if rid not in runner
                  and rid not in agent
                  and not any(rid.startswith(prefix) for prefix in prefixes)
              )
              assert not missing_ownership, (
                  "execution ownership does not cover required IDs",
                  evaluation,
                  missing_ownership,
              )

          lq_required = requirements["language_quality"]["required"]
          lq_ownership = module.execution_ownership_for(
              root.parent, "language_quality", lq_required
          )
          try:
              module.validate_requirement_execution_ownership(
                  "negative-runner-owned",
                  ["metric.native_execution_performance"],
                  "agent",
                  lq_ownership,
              )
          except module.BenchmarkError:
              pass
          else:
              raise AssertionError(
                  "runner-owned requirement accepted as agent work"
              )
          try:
              module.validate_requirement_execution_ownership(
                  "negative-agent-owned",
                  ["metric.readability"],
                  "command",
                  lq_ownership,
              )
          except module.BenchmarkError:
              pass
          else:
              raise AssertionError(
                  "LLM-owned requirement accepted as command work"
              )

          catalog = json.loads((root / "reuse" / "catalog.json").read_text())
          module.validate_reuse_catalog(catalog)
          assert catalog["schema_version"] == 3
          assert len(catalog["artifacts"]) >= 20
          assert not any(
              "source_run_id" in a
              or "source_run_relative_path" in a
              or "validation_summary" in a
              for a in catalog["artifacts"]
          )
          assert not any(
              "expected_git_object_sha1" in a
              for a in catalog["artifacts"]
          )
          comparison_slugs = {
              "python", "cpp", "rust", "go", "java",
              "typescript", "kotlin", "swift", "zig",
          }
          for slug in comparison_slugs:
              assert (root / "programs" / slug / "micro" / {
                  "python":"mb00.py","cpp":"mb00.cpp","rust":"mb00.rs",
                  "go":"mb00.go","java":"mb00.java","typescript":"mb00.ts",
                  "kotlin":"mb00.kt","swift":"mb00.swift","zig":"mb00.zig",
              }[slug]).is_file(), slug
          micro_tree_destinations = {
              a["destination"] for a in catalog["artifacts"]
              if a.get("kind") == "tree" and a.get("workload") == "micro"
          }
          assert {
              f"programs/{slug}/micro" for slug in comparison_slugs
          } <= micro_tree_destinations
          assert "programs/quidra/micro" not in micro_tree_destinations
          broken = json.loads(json.dumps(catalog))
          broken["artifacts"][1]["id"] = broken["artifacts"][0]["id"]
          try:
              module.validate_reuse_catalog(broken)
          except module.BenchmarkError:
              pass
          else:
              raise AssertionError("duplicate reusable artifact IDs must be rejected")

          quidra_reuse = json.loads(json.dumps(catalog))
          quidra_reuse["artifacts"].append({
              "id": "forbidden-quidra-program",
              "kind": "tree",
              "destination": "programs/quidra/micro",
              "language": "Quidra",
              "workload": "micro",
              "validated_toolchain": None,
              "reuse_dependencies": [],
          })
          try:
              module.validate_reuse_catalog(quidra_reuse)
          except module.BenchmarkError:
              pass
          else:
              raise AssertionError("Quidra program reuse must be rejected")

          master = Path("benchmark/master_prompt.md").read_text()
          assert "deterministic-plan" in master
          assert "benchmark.py prepare" in master
          assert "Past run directories" in master
          assert str(module.CANONICAL_WORKSPACE) == "/quidra-benchmark"
          assert str(module.HOST_WORKSPACE_RELATIVE) == ".quidra-benchmark"
          assert module.HOST_SENTINEL_NAME == "quidra-benchmark-host.json"
          assert "/.quidra-benchmark/" in Path(".gitignore").read_text()
          primary_cfg = json.loads((root / "config" / "primary.json").read_text())
          assert primary_cfg["workspace_root"] == "/quidra-benchmark"
          sample = "read /quidra-benchmark/repo only"
          assert module.render_workspace_paths(sample, Path("/tmp/host-a")) == sample
          assert module.render_workspace_paths(sample, Path("/tmp/host-b")) == sample
          assert module.render_workspace_paths(
              "read ./.quidra-benchmark/repo only", Path("/Users/example/project")
          ) == sample
          assert module.render_workspace_paths(
              "read /tmp/host-a/repo only", Path("/tmp/host-a")
          ) == sample
          assert module.render_workspace_paths(
              "read /tmp/host-b/repo only", Path("/tmp/host-b")
          ) == sample
          assert module.privacy_match_is_safe(
              "host_temp_path", "/quidra-benchmark/repo", Path("/quidra-benchmark")
          )
          assert not module.privacy_match_is_safe(
              "unix_home", "/Users/example/", Path("/Users/example/project/.quidra-benchmark")
          )
          assert len(master) < 20_000

          # Canonical Semantic Compression owner inputs are atomic: comparison
          # languages must never hash/embed Quidra docs, while the target sees
          # only the language-spec tree rather than unrelated repository docs.
          work_templates = json.loads((root / "config" / "work_plan_templates.json").read_text())
          sc_owner = next(
              unit for unit in work_templates["evaluations"]["semantic_compression"]["units"]
              if unit["id"] == "sc-canonical-fragment"
          )
          assert sc_owner["read_paths"] == []
          assert sc_owner["target_only_read_paths"] == ["repo/docs/spec"]

          # Semantic support adjudication must carry the whole canonical record,
          # not only a level. Otherwise comparability falls back to stale shard
          # prose and can reject a correction that was already made.
          full = {
              "level": "FULL", "fragment": "x()", "partial_reasons": [],
              "none_reason": None, "justification": "all numbered requirements",
              "citation": "frozen docs",
          }
          partial = {
              "level": "PARTIAL", "fragment": "wrapper(x)", "partial_reasons": ["P-a"],
              "none_reason": None, "justification": "standard substitution",
              "citation": "standard library docs",
          }
          none = {
              "level": "NONE", "fragment": None, "partial_reasons": [],
              "none_reason": "N-2", "justification": "requires external build",
              "citation": "frozen toolchain contract",
          }
          assert module.sc_adjudicated_record(full)["level"] == "FULL"
          assert module.sc_adjudicated_record(partial)["partial_reasons"] == ["P-a"]
          assert module.sc_adjudicated_record(none)["none_reason"] == "N-2"
          assert module.sc_adjudicated_record({"level": "PARTIAL"}) is None

          by_language = {"Python": {"F08.P1": {
              "support": "NONE", "rationale": "stale", "fragment": "stale()"
          }}}
          owner_rows = {"Python": {"F08.P1": {"support": "NONE"}}}
          owner = {
              "fields": ["support"], "levels": {"FULL":1.0,"PARTIAL":0.5,"NONE":0.0}
          }
          module.sc_reconcile_support(
              by_language, owner_rows, owner,
              {"F08.P1": {"Python": partial}},
          )
          row = by_language["Python"]["F08.P1"]
          assert row["support"] == "PARTIAL" and "fragment" not in row
          assert row["support_reason_codes"] == ["P-a"]
          assert row["support_adjudication"] == {
              "level": "PARTIAL",
              "partial_reasons": ["P-a"],
              "none_reason": None,
          }
          assert row["support_source"] == "cohort_adjudication_or_repair"
          assert "rationale" not in row

          with tempfile.TemporaryDirectory() as repair_td:
              repair_root = Path(repair_td)
              (repair_root / "work/root").mkdir(parents=True)
              matrix_path = (
                  repair_root / "template/methodology-assets/semantic_compression"
                  / "semantic_site_matrix.json"
              )
              matrix_path.parent.mkdir(parents=True)
              module.json_dump(matrix_path, {
                  "schema_version": 1,
                  "probes": [{
                      "probe_id": "F10.P1",
                      "family": "10. synthetic conversion family",
                  }],
              })
              module.json_dump(
                  matrix_path.parent / "capability_universe.json",
                  module.json_load(
                      root / "methodology-assets/semantic_compression/capability_universe.json"
                  ),
              )
              module.json_dump(
                  repair_root / "template/config/benchmark_metadata.json",
                  module.json_load(root / "config/benchmark_metadata.json"),
              )
              module.json_dump(
                  repair_root / module.COMPARABILITY_BLINDING_RELATIVE,
                  {"schema_version":1,"labels":{"Python":"E"}},
              )
              module.json_dump(
                  repair_root / module.COMPARABILITY_SAMPLE_RELATIVE,
                  {
                      "schema_version":1,
                      "probes":[{
                          "probe_id":"F10.P1",
                          "annotations":[{
                              "label":"E",
                              "support":"PARTIAL",
                              "fragment":"wrapper(x)",
                          }],
                      }],
                  },
              )
              repair_partial = {
                  "level": "PARTIAL",
                  "fragment": "wrapper(x)",
                  "partial_reasons": ["P-b"],
                  "none_reason": None,
                  "justification": "synthetic repair exercises a non-R9 partial reason",
                  "citation": "frozen synthetic evidence",
              }
              result = {
                  "evidence": {
                      "gate_result": {
                          "affected_pairs_requiring_revalidation": [
                              {"probe_id":"F10.P1","label":"E"}
                          ]
                      },
                      "repair_directives": [{
                          "probe_id":"F10.P1","label":"E","record":repair_partial
                      }],
                  }
              }
              assert module.persist_comparability_repairs(repair_root, result) == 1
              assert module.persist_comparability_repairs(repair_root, result) == 0
              repairs = module.sc_comparability_repairs(repair_root)
              assert repairs["F10.P1"]["Python"]["level"] == "PARTIAL"
              # This isolated fixture has no cohort-adjudication record, so the
              # validated pair-specific repair must still become authoritative.
              merged = module.sc_adjudicated_annotations(repair_root)
              assert merged["F10.P1"]["Python"]["fragment"] == "wrapper(x)"
              levels = module.sc_adjudicated_levels(repair_root)
              assert levels["F10.P1"]["Python"] == "PARTIAL"

          lq = (root / "methodology" / "language_quality.md").read_text()
          assert "3 unscored warm-up runs" not in lq
          assert "all 10 raw scored measurements" not in lq
          assert "all 10 individual scored measurements" not in lq
          assert "W = timing.warmups_per_cell" in lq
          assert "R = timing.measured_runs_per_cell" in lq
          ecosystem = (root / "methodology" / "ecosystem.md").read_text()
          assert "previous published run" not in ecosystem
          assert "must not be a threshold, direct score" in ecosystem

          forbidden_legacy = (
              "quidra_interpreter",
              "Quidra Interpreter",
              "Quidra interpreter",
              "quidra_mode_rule",
              "Startup / REPL",
              "Compiler / Interpreter Robustness",
              "compiler_interpreter_robustness",
          )
          text_files = [
              Path("benchmark/master_prompt.md"),
              *[
                  p for p in root.rglob("*")
                  if p.is_file() and p.suffix in {".md", ".json", ".py"}
              ],
          ]
          for path in text_files:
              text = path.read_text(errors="ignore")
              for token in forbidden_legacy:
                  assert token not in text, (path, token)

          forbidden_history = (
              "DEFECT CORRECTED",
              "Remediation changelog",
              "previous value",
          )
          historical_run_id = __import__("re").compile(
              r"\b20\d{2}-\d{2}-\d{2}-[0-9a-f]{7,}(?:\(latest\))?\b"
          )
          methodology_files = [
              p for p in root.rglob("*")
              if p.is_file()
              and p.suffix in {".md", ".json"}
              and "prompts" not in p.relative_to(root).parts
          ]
          for path in methodology_files:
              text = path.read_text(errors="ignore")
              for token in forbidden_history:
                  assert token not in text, (path, token)
              run_ids = historical_run_id.findall(text)
              assert not run_ids, (path, run_ids)

          micro_spec = importlib.util.spec_from_file_location(
              "micro_measure", "benchmark/template/scripts/micro_measure.py"
          )
          micro = importlib.util.module_from_spec(micro_spec)
          micro_spec.loader.exec_module(micro)

          with tempfile.TemporaryDirectory() as td:
              test_root = Path(td)
              (test_root / "template" / "config").mkdir(parents=True)
              (test_root / "template" / "config" / "quidra_representation_schema.json").write_text(
                  (root / "config" / "quidra_representation_schema.json").read_text()
              )
              (test_root / "repo" / "docs" / "spec").mkdir(parents=True)
              (test_root / "repo" / "docs" / "spec" / "language.md").write_text(
                  "current synthetic Quidra docs\n"
              )
              (test_root / "run.json").write_text(json.dumps({
                  "evaluated": {"commit_sha": "abc123"}
              }))
              valid_representation = {
                  "schema_version": 1,
                  "evaluated_commit_sha": "abc123",
                  "numeric_arrays": {"choice": "current-docs"},
                  "string_buffer": {"choice": "current-docs"},
                  "file_io": {"choice": "current-docs"},
                  "collections": {"choice": "current-docs"},
                  "monotonic_clock": {"choice": "current-docs"},
                  "runtime_checks": {"choice": "current-docs"},
                  "documentation_evidence": ["repo/docs/spec/language.md#current"],
              }
              rep = test_root / "quidra_representation.json"
              rep.write_text(json.dumps(valid_representation))
              assert micro.validate_quidra_representation(
                  test_root, rep
              )["evaluated_commit_sha"] == "abc123"

              bad = dict(valid_representation)
              bad["evaluated_commit_sha"] = "different"
              rep.write_text(json.dumps(bad))
              try:
                  micro.validate_quidra_representation(test_root, rep)
              except micro.MeasureError:
                  pass
              else:
                  raise AssertionError("representation commit mismatch must fail")

              bad = dict(valid_representation)
              bad["documentation_evidence"] = []
              rep.write_text(json.dumps(bad))
              try:
                  micro.validate_quidra_representation(test_root, rep)
              except micro.MeasureError:
                  pass
              else:
                  raise AssertionError("representation evidence omission must fail")

          original_wait = micro.wait_for_host_window
          try:
              micro.wait_for_host_window = lambda: (False, [9.0])
              calls = []
              host_checks = []
              unresolved = micro.run_host_gated_batches(
                  ["a", "b"], "synthetic", calls.append, host_checks
              )
              assert unresolved == {"a", "b"}
              assert calls == []
              assert sum(
                  1 for row in host_checks
                  if row.get("na_reason") == "host_contention_unresolved"
              ) == 2
          finally:
              micro.wait_for_host_window = original_wait
          PY

      - name: Report certified-cache impact without paid work
        run: |
          set +e
          python benchmark/template/scripts/benchmark.py cache-impact \
            --source-repo "$GITHUB_WORKSPACE" | tee "$RUNNER_TEMP/cache-impact.json"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then exit "$rc"; fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          summary = json.loads(Path(os.environ["RUNNER_TEMP"], "cache-impact.json").read_text())
          print(json.dumps({
              "valid": int(summary.get("valid", 0) or 0),
              "invalid": len(summary.get("invalid", [])),
              "invalid_by_evaluation": summary.get("invalid_by_evaluation", {}),
          }, indent=2, sort_keys=True))
          PY

      - name: Verify self-contained template bootstrap
        run: |
          python - <<'PY'
          from pathlib import Path
          import importlib.util
          import tempfile

          spec = importlib.util.spec_from_file_location(
              "benchmark_cli", "benchmark/template/scripts/benchmark.py"
          )
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          source = Path.cwd()
          with tempfile.TemporaryDirectory() as td:
              dest = Path(td) / "template"
              module.copy_tracked_tree(source, "benchmark/template", dest)
              records = module.materialize_reuse_catalog(source, dest)
              assert len(records) >= 20
              mat = module.json_load(dest / "reuse" / "materialized.json")
              assert mat["schema_version"] == 3
              assert not any("source_run_id" in a for a in mat["artifacts"])
              assert all(
                  len(a.get("content_git_object_sha1", "")) == 40
                  for a in mat["artifacts"]
              )
              assert (dest / "programs/python/micro/mb01.py").is_file()
              assert (dest / "programs/python/micro/mb00.py").is_file()
              assert (dest / "config/quidra_representation_schema.json").is_file()
              assert not (dest / "programs/quidra/micro").exists()
              assert (dest / "fixtures/micro/reference").is_dir()
              assert (dest / "validators/micro/check_micro.py").is_file()
          PY

      # Fast, independent contracts for paid-call durability run before the
      # expensive deterministic integration pass. This keeps trial-checkpoint
      # regressions visible even when a newer develop push cancels the long job.
      - name: Credential-less gateway and sandbox-agent isolation
        run: python tests/benchmark_isolation_tests.py

      - name: Exercise deterministic runner
        env:
          QUIDRA_BENCHMARK_WORKER_GATEWAY_ATTESTED: packet-gateway-v1
          QUIDRA_BENCHMARK_PACKET_WORKER_LOCAL_TOOLS: disabled
          QUIDRA_BENCHMARK_SANDBOX_AGENT_LAUNCHER_ATTESTED: inside-sandbox-v1
          QUIDRA_BENCHMARK_SYNTHETIC_COMMANDS: "1"
        run: |
          TMP="$PWD/.benchmark-template-test"
          rm -rf "$TMP"
          mkdir -p             "$TMP/work/root" "$TMP/work/agents" "$TMP/raw" "$TMP/results"             "$TMP/prompts/by-hash" "$TMP/prompts/components/by-hash" "$TMP/prompts/manifests"             "$TMP/home" "$TMP/tmp" "$TMP/repo/docs"

          python - <<'PY'
          from pathlib import Path
          import importlib.util
          import json

          root = Path(".benchmark-template-test")
          spec = importlib.util.spec_from_file_location(
              "benchmark_cli", "benchmark/template/scripts/benchmark.py"
          )
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          module.copy_tracked_tree(Path.cwd(), "benchmark/template", root / "template")
          module.materialize_reuse_catalog(Path.cwd(), root / "template")
          master = Path("benchmark/master_prompt.md").read_bytes()
          master_hash = module.sha256_bytes(master)
          (root / "prompts" / "by-hash" / f"{master_hash}.md").write_bytes(master)
          (root / "run.json").write_text(json.dumps({
              "schema_version": 1,
              "run_id": "synthetic-e2e",
              "workspace_root": "/quidra-benchmark",
              "evaluated": {"commit_sha": "synthetic"},
              "master_prompt_sha256": master_hash,
              "primary_config_sha256": module.sha256_file(
                  root / "template" / "config" / "primary.json"
              ),
              "template_tree_sha256": module.sha256_tree(root / "template"),
          }, indent=2) + "\n")
          (root / "results" / "reuse_status.json").write_text(
              json.dumps({"schema_version":1,"audit_required":[]}) + "\n"
          )
          PY

          python benchmark/template/scripts/benchmark.py privacy-check --workspace "$TMP"
          python benchmark/template/scripts/benchmark.py deterministic-plan --workspace "$TMP"
          python - <<'PY'
          from pathlib import Path
          import json
          root = Path(".benchmark-template-test")
          prof = json.loads(
              (root / "work/root/plans/llm_proficiency.json").read_text()
          )
          prof_trials = [
              u for u in prof["work_units"]
              if u["id"].startswith("proficiency-trials--")
          ]
          assert len(prof_trials) == 10, [u["id"] for u in prof_trials]
          assert all(len(u.get("assigned_languages", [])) == 1 for u in prof_trials)
          learn = json.loads(
              (root / "work/root/plans/llm_learnability.json").read_text()
          )
          assert len([
              u for u in learn["work_units"]
              if u["id"].startswith("learnability-i1-i2--")
          ]) == 10
          primary = json.loads((root / "template/config/primary.json").read_text())
          repairs_l = 1 + primary["llm_learnability"]["max_repair_turns"]
          expected_i12 = (
              primary["llm_learnability"]["keyword_anonymization_seeds"]
              + primary["llm_learnability"]["vocabulary_anonymization_seeds"]
          ) * repairs_l
          i12 = [
              u for u in learn["work_units"]
              if u["id"].startswith("learnability-i1-i2--")
          ]
          assert all(u["max_llm_calls"] == expected_i12 for u in i12)
          sc = json.loads(
              (root / "work/root/plans/semantic_compression.json").read_text()
          )
          repairable = {
              u["id"] for u in sc["work_units"]
              if u["id"].startswith("sc-support-adjudication--")
          }
          expected_repairable = {
              f"sc-support-adjudication--f{i:02d}-p1" for i in range(1, 21)
          }
          assert repairable == expected_repairable, sorted(repairable)
          comparability = next(
              u for u in sc["work_units"] if u["id"] == "sc-comparability"
          )
          assert expected_repairable <= set(comparability["dependencies"])

          repairs_p = 1 + primary["llm_proficiency"]["max_repair_turns"]
          expected_prof = (
              len(primary["llm_proficiency"]["primary_workloads"])
              * len(primary["llm_proficiency"]["primary_scenarios"])
              * primary["llm_proficiency"]["independent_trials_per_replicated_cell"]
              * repairs_p
          )
          assert all(u["max_llm_calls"] == expected_prof for u in prof_trials)

          sc = json.loads(
              (root / "work/root/plans/semantic_compression.json").read_text()
          )
          assert len([
              u for u in sc["work_units"]
              if u["id"].startswith("sc-metrics-local--part-1--")
          ]) == 10
          eco = json.loads(
              (root / "work/root/plans/ecosystem.json").read_text()
          )
          assert len([
              u for u in eco["work_units"]
              if u["id"].startswith("ecosystem-external--part-1--")
          ]) == 10

          lq = json.loads(
              (root / "work/root/plans/language_quality.json").read_text()
          )
          by_id = {u["id"]: u for u in lq["work_units"]}
          # Quidra's programs live in the evaluated snapshot; the plan carries a
          # single mechanical audit unit instead of model-authored shards.
          audit = by_id["lq-quidra-audit"]
          assert audit["execution_kind"] == "command"
          assert audit["runner_action"] == "quidra-audit"
          assert audit["requirement_ids"] == ["gate.quidra_programs_current"]
          # Read paths that do not exist in this plan-only workspace are dropped
          # by the planner, so the snapshot location is checked on the goal.
          assert "tests/benchmark/quidra" in audit["goal"]
          assert not any(u["id"].startswith("lq-qudra-") for u in lq["work_units"])

          raw_micro = [
              unit for unit in lq["work_units"]
              if unit["id"].startswith("lq-micro-raw--")
          ]
          assert len(raw_micro) == 10, [unit["id"] for unit in raw_micro]
          assert all(unit["runner_action"] == "micro-measure-raw" for unit in raw_micro)
          assert all(len(unit["assigned_languages"]) == 1 for unit in raw_micro)
          assert all(unit["requirement_ids"] == [] for unit in raw_micro)
          quidra_raw = by_id["lq-micro-raw--quidra"]
          assert "lq-quidra-audit" in quidra_raw["dependencies"], quidra_raw

          mechanical = by_id["lq-micro-mechanical"]
          assert mechanical["execution_kind"] == "command"
          assert mechanical["runner_action"] == "micro-normalize"
          assert set(mechanical["dependencies"]) == {
              unit["id"] for unit in raw_micro
          }
          assert set(mechanical["requirement_ids"]) == {
              "metric.native_execution_performance",
              "metric.long_running_performance",
              "metric.compile_build_performance",
              "metric.startup_latency",
              "metric.memory_efficiency",
              "metric.runtime_overhead",
              "metric.source_code_size",
              "metric.binary_artifact_size",
          }
          # The attempt limit comes from the runtime configuration, where it
          # re-keys no certified record; a command unit's declared limit stays.
          runtime = json.loads(
              (root / "template/config/sandbox_agent.json").read_text()
          )
          agent_unit = by_id["lq-language-development--part-1--quidra"]
          assert agent_unit["max_attempts"] == runtime["max_attempts_per_work_unit"] == 5, (
              agent_unit["max_attempts"], runtime["max_attempts_per_work_unit"]
          )
          assert audit["max_attempts"] == 1, audit["max_attempts"]
          PY
          python benchmark/template/scripts/benchmark.py manifest-merge --workspace "$TMP"
          python benchmark/template/scripts/benchmark.py plan --workspace "$TMP" --strict

          # Missing toolchains become explicit infrastructure blockers for only
          # the affected execution-heavy Primaries; unrelated evaluations still advance.
          # This is a fault-injection test: preserve the main synthetic ledger so
          # the deliberate Zig outage cannot poison later Primary smoke checks.
          cp "$TMP/work/root/ledger.json" "$TMP/work/root/ledger.before-toolchain-blocker.json"
          python - <<'PY'
          from pathlib import Path
          import json
          root = Path(".benchmark-template-test")
          (root / "results/toolchains.json").write_text(json.dumps({
              "schema_version": 1,
              "missing": ["Zig"],
              "toolchains": {},
              "ok": False,
          }) + "\n")
          PY
          python benchmark/template/scripts/benchmark.py toolchain-blockers --workspace "$TMP"
          python - <<'PY'
          from pathlib import Path
          import json
          ledger = json.loads(Path(".benchmark-template-test/work/root/ledger.json").read_text())
          # Static coverage gates do not need a compiler and therefore must not
          # be converted into toolchain blockers. Only execution-heavy language
          # shards are blocked by the deliberately missing Zig toolchain.
          assert ledger["units"]["lq-coverage"]["status"] == "PENDING"
          assert ledger["units"]["learnability-coverage"]["status"] == "PENDING"
          assert ledger["units"]["proficiency-coverage"]["status"] == "PENDING"
          assert ledger["units"]["sc-coverage"]["status"] == "PENDING"
          assert ledger["units"]["sc-structure-gates--part-1a"]["status"] == "PENDING"
          assert ledger["units"]["ecosystem-gates--part-1"]["status"] == "PENDING"
          PY
          mv "$TMP/work/root/ledger.before-toolchain-blocker.json" "$TMP/work/root/ledger.json"
          rm -f "$TMP/results/toolchains.json" "$TMP/results/toolchain_blockers.json"

          # This fixture is exercising Semantic Compression only. Advancing the
          # whole manifest here would execute unrelated Language Quality command
          # units in the intentionally incomplete synthetic toolchain workspace.
          python benchmark/template/scripts/benchmark.py advance --workspace "$TMP" --evaluation semantic_compression

          # Canonical fragment ownership is probe × language. No quality-metric
          # consumer may dispatch before all 44 leaves for its language are COMPLETE.
          test -f "$TMP/results/dispatch_queue.json"
          grep -q '"agent_id": "worker-sc-canonical-fragment--quidra--f01-p1"' "$TMP/results/dispatch_queue.json"
          if grep -q '"agent_id": "worker-sc-metrics-local--part-1--quidra"' "$TMP/results/dispatch_queue.json"; then
            echo "semantic metric consumer dispatched before canonical probe leaves" >&2
            exit 1
          fi
          python benchmark/template/scripts/benchmark.py task-render \
            --workspace "$TMP" --id worker-sc-canonical-fragment--quidra--f01-p1 \
            > "$TMP/rendered-owner-task.md"
          grep -q "Embedded input: worker_core.md" "$TMP/rendered-owner-task.md"
          grep -q "probe × language" "$TMP/rendered-owner-task.md"
          grep -q "/quidra-benchmark" "$TMP/rendered-owner-task.md"
          if grep -Fq "$TMP" "$TMP/rendered-owner-task.md"; then
            echo "physical synthetic workspace leaked into rendered Task Packet" >&2
