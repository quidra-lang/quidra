               done
           done
          cat > "$TMP/time-numeric-kinds.qui"'''.replace('               done','     done').replace('           done',' done').replace('              for','    for').replace('               do','     do').replace('                  finite_cli','        finite_cli').replace('                  [[','        [['))])
          name='tests/nonfinite_tests.sh'
          def rep(a,b): edit(name,[(a,b)])
          rep('''# No visible NaN or infinity: a fixed-width real operation whose result is not
          # finite stops the program (REAL_OVERFLOW, or DIVISION_BY_ZERO for a zero
          # divisor) at the operation; the first failing operation of an expression is
          # the one reported, with or without the merging of its checks; constant
          # expressions fail at compile time; parsing rejects non-finite text; finite
          # results are unchanged.''',
          '''# Signed infinity is valid, but NaN never becomes observable. The first
          # indeterminate operation reports NONFINITE_RESULT (DIVISION_BY_ZERO for
          # zero/zero), with or without merged checks. Constant expressions enforce
          # the same policy. Finite results and parsing range checks are unchanged.''')
          rep('real64 big = 1.0e308\nprint("before")\nprint(big * 10.0)','real64 big = inf\nprint("before")\nprint(big * 0.0)')
          rep("fails multiply 101 REAL_OVERFLOW 'real64 multiplication overflow'","fails multiply 101 NONFINITE_RESULT 'real64 multiplication produced NaN'")
          rep('real32 big = real32(3.0e38)\nreal32 sum = big + big','real32 big = inf\nreal32 sum = big + -big')
          rep("fails add32 101 REAL_OVERFLOW 'real32 addition overflow'","fails add32 101 NONFINITE_RESULT 'real32 addition produced NaN'")
