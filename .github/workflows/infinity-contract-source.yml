          rep("fails divide_overflow 101 REAL_OVERFLOW 'real64 division overflow'","fails divide_overflow 101 NONFINITE_RESULT 'real64 division produced NaN'")
          rep('real32 one = 1.0\nreal32 zero = 0.0\nprint(one / zero)','real32 one = 0.0\nreal32 zero = 0.0\nprint(one / zero)')
          rep("fails power 101 REAL_OVERFLOW 'real64 power overflow' '3:7'",'''[[ "$("$QUIDRA" run "$TMP/power.qui")" == "inf" ]]''')
          rep('real64 value = 1.0e300\nvalue *= 1.0e10','real64 value = inf\nvalue *= 0.0')
          rep("fails compound 101 REAL_OVERFLOW 'real64 multiplication overflow'","fails compound 101 NONFINITE_RESULT 'real64 multiplication produced NaN'")
          rep('''# Two overflowing operands in one expression: the earlier one is reported,
          # at its own location; a finite operand whose consumer overflows reports the
          # consumer.''','''# Two indeterminate operands: the earlier operation is reported at its own
          # location. Valid infinite operands whose consumer makes NaN report the consumer.''')
          rep('real64 big = 1.0e308\nreal64 r = big * 2.0 - big * 3.0','real64 big = inf\nreal64 r = big * 0.0 - big * 0.0')
          rep("fails first 101 REAL_OVERFLOW 'real64 multiplication overflow'","fails first 101 NONFINITE_RESULT 'real64 multiplication produced NaN'")
          rep('real64 big = 1.0e308\nreal64 one = 1.0\nreal64 r = one * 2.0 - big * 3.0','real64 big = inf\nreal64 one = 1.0\nreal64 r = one * 2.0 - big * 0.0')
          rep("fails second 101 REAL_OVERFLOW 'real64 multiplication overflow'","fails second 101 NONFINITE_RESULT 'real64 multiplication produced NaN'")
          rep('real64 big = 1.0e308\nreal64 r = big * 1.5 + big * 1.5','real64 big = inf\nreal64 r = big * 1.5 - big * 1.5')
          rep("fails consumer 101 REAL_OVERFLOW 'real64 addition overflow'","fails consumer 101 NONFINITE_RESULT 'real64 subtraction produced NaN'")
          rep('    real64 s = 0.0\n    for 0 <= nat8 i < 4','    real64 s = -inf\n    for 0 <= nat8 i < 4')
          rep('print(total(1.0e308))','print(total(inf))')
          rep("fails merged 101 REAL_OVERFLOW 'real64 addition overflow'","fails merged 101 NONFINITE_RESULT 'real64 addition produced NaN'")
          rep("$(printf '5.0\\n2.0')","$(printf '5.0\\n-inf')")
          rep('''grep -q '"code": "REAL_OVERFLOW"' "$TMP/json.err"''','''grep -q '"code": "NONFINITE_RESULT"' "$TMP/json.err"''')
          s=texts[name];a=s.index('# Constant expressions are computed');b=s.index('# Parsing never makes',a)
          texts[name]=s[:a]+'''# Constant overflow/division obey the same infinity policy as runtime values.
          cat > "$TMP/constant_infinity.qui" <<'QUI'
          real64 a = 1.0e308 * 10.0
          real32 b = 3.0e38 + 3.0e38
