name: sanitizers

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim unused sanitizer runner storage
        run: |
          df -h /
          for path in /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL; do
            if [ -d "$path" ]; then sudo rm -rf -- "$path"; fi
          done
          df -h /
      - name: Install compiler cache
        run: sudo apt-get update && sudo apt-get install -y ccache llvm clang lld ninja-build
      - name: Restore compiler cache
        id: sanitizer-ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-clang-sanitizers-${{ hashFiles('CMakeLists.txt', 'src/**', 'include/**') }}
          restore-keys: |
            ccache-${{ runner.os }}-clang-sanitizers-
      - name: Install native dependencies
        run: sudo apt-get install -y llvm libcurl4-openssl-dev
      - name: Limit sanitizer cache disk usage
        run: ccache --max-size 2G
      - name: Configure ASan/UBSan
        run: >-
          cmake -S . -B build-san -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_CXX_FLAGS_DEBUG="-O0 -gline-tables-only"
          -DQUIDRA_WARNINGS_AS_ERRORS=ON
          -DQUIDRA_SANITIZE_RUNTIME=ON
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined -fuse-ld=lld"
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build and cache sanitized compiler core
        # Save instrumented compilation before long links; a runner shutdown
        # must not discard every ccache object from the unsuccessful run.
        run: |
          free -h
          cmake --build build-san --target quidra_core --parallel 1
      - name: Persist sanitized compiler cache
        if: steps.sanitizer-ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-clang-sanitizers-${{ hashFiles('CMakeLists.txt', 'src/**', 'include/**') }}
      - name: Build
        run: cmake --build build-san --parallel 1
      - name: Tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --test-dir build-san --output-on-failure --parallel ${{ runner.os == 'macOS' && 3 || 4 }}
      - name: Preserve failed sanitizer test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-test-logs-${{ github.sha }}
          path: |
            build-san/Testing/Temporary/LastTest.log
            build-san/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: ignore
          retention-days: 7
