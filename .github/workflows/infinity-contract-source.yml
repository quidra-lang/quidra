name: infinity-contract-source

# Temporary transport of reviewed test/documentation updates. This verifies
# exact preimages and outputs, executes the real compiler, and stores blobs
# only. A separate HEAD-leased source commit removes this workflow.
on:
  push:
    branches: [develop]
    paths: [.github/workflows/infinity-contract-source.yml]
permissions:
  contents: write
  actions: read
jobs:
  verify-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 39056414592
          name: array-contract-compiler-0610120ec680508bc19a9557963b2e8c0f78f5c7
          path: recorded
      - name: Restore verified production compiler
        run: |
          set -euo pipefail
          (cd recorded && sha256sum -c SHA256SUMS)
          test "$(cat recorded/core.sha)" = 0610120ec680508bc19a9557963b2e8c0f78f5c7
          tar -xzf recorded/compiler.tar.gz
          sudo apt-get update -qq && sudo apt-get install -y clang llvm libcurl4-openssl-dev
          mkdir contract-results
      - name: Verify and update reviewed contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          records = {
          'tests/runtime_diagnostics_tests.sh': ('f0ac375cc8b1a5f4376cc7c6acba940727ae1d3cd1670d2155a77b866f53013c','844f75be0400bfb6f31b3c22efd183c1c59d94afdf3863e574ae23a955dfb289','c57201d8b4a020aca13c7307767d3b4104aa3072'),
          'tests/c_export_tests.sh': ('10693ca464a7e5d4bd85a8c76bf7578b0c8d41e13de584e95cae45806ac68099','0eea4e312523edc37a1cc6dedf2f792a3cb68837f7c0fce77d4ece6d2625c6e1','f31efbd0e470d4d6ef6c2163370194187b84bbe1'),
          'tests/half_precision_tests.sh': ('fed7b0fdfe95271e60bb1d7a41eb7e79986c191050404ae526aa0e408b10f00b','5c50f997c1e7d7bb842667415a8c6b454e0c2d66782a446c793599a0f9313889','ecc5b75a94f470064df9a1e2ee69f7ca032869c6'),
          'tests/complex_tests.sh': ('e57d978298536dee528d62c333a6e808523d64ac59537c5c89f400449e4820d5','21dda9ec0af9fdd99b4fe678f0f39af457a1d25fb3f17a8f852da79a77e217dd','ed6ba614ad1d269ce479996bc3de6aff6e62506a'),
          'tests/stdlib_tests.sh': ('e771049c01eadac394f05dfd9c1c81843eb659743bc51159703be621998e24df','edbc4b15e66048cf9791266165fdb6e672c1ec641c9b79a94bdcbb7ea8f5e996','e848969c2fc742ac67891d48d7c1d6ec3bc43e32'),
          'tests/nonfinite_tests.sh': ('71fd8967346bc5206cca9a8d4a7059b6de36715656779fc90841d9373bea1721','625d336eeeda437d8dad2af595bd98fb7ce9884fc85ad3059e87d347c4ea5947','79e7d86d9243a0d9930b2c4b2212bf4ab2ea2784'),
          'docs/spec/language.md': ('bf0e71cc078a27d7b072767fc6458b4412f00cd6e3d52a4de4dbd344d01f4fce','091cb66a40e61d552a83d9d5ae9f3dadfffe4c3fa83c653f37f62a15ffa2476a','81addca18411c6bf62fe63f5a1e6dc069660620d'),
          'docs/spec/numeric-and-bin.md': ('dafa5c64c3645cb47da0f514c33b1820731896f509b2d045f0d32cd6a70bc6e9','da829ddec0a52698bc20c181e6082e5fba16bb762b5401638d68077f37da0594','295e8b360bde7f3c43f7d0c8ddc138e7a5fa1b6b'),
          'docs/spec/diagnostics.md': ('244a6c0e01b652dadec1769bbd2803f7996618d889a8c3c645d500aa1b456253','aaa7c6156cc78108cdf8febeab55375036210cc6257f7fa1e729f622430bbad5','05fb9add72a9f3f36c48e6760126e05251acccc9'),
          'docs/spec/llm-guide.md': ('652b395667436b9f849ce4be7249d428b07359bbad0d409b4f4ced6ea827430e','a8c05c9059ad84ff0cc42ef1810cc2cfcd670f3b334f53ad598d38f999bc17af','bde55a3a932547a9a0c3a8ea9686b03b644873c3'),
          'docs/packages.md': ('bc4375181a03d0d453d70e3c203a7ef55d0a25d19113572382c8467d96ed04be','01413f80677decaba05d5e3688ca3604381427aa229af4880ae5d776da861bb8','f0846eda259573249dc940980366d1486dd2c7c5')}
          texts={}
          for name,(before,after,blob) in records.items():
              data=Path(name).read_bytes()
              assert hashlib.sha256(data).hexdigest()==before, ('source changed',name)
              texts[name]=data.decode('utf-8')
          def edit(name,changes):
              text=texts[name]
              for old,new in changes:
                  assert text.count(old)==1,(name,text.count(old),old[:120])
                  text=text.replace(old,new)
              texts[name]=text
          edit('tests/runtime_diagnostics_tests.sh',[(
          '''# No real value is an infinity, so no scalar conversion meets one: the
          # division that would make it stops first (an export's argument from C is
          # the scalar NON_FINITE case, tests/c_export_tests.sh).
          row real-division-by-zero 101 3 7 "real64 division by zero" code=DIVISION_BY_ZERO <<'QUI'
          real64 zero = 0.0
          print("before" + NL)
          print(1.0 / zero)''',
          '''# Signed infinity is valid. Indeterminate 0 / 0 must still stop before
          # producing NaN (C-supplied NaN is tested in tests/c_export_tests.sh).
          row real-division-by-zero 101 3 7 "real64 division by zero" code=DIVISION_BY_ZERO <<'QUI'
          real64 zero = 0.0
          print("before" + NL)
          print(0.0 / zero)''')])
          edit('tests/c_export_tests.sh',[(
          '''# No real value from C is NaN or an infinity: a non-finite argument of an
          # exported function stops the program at the function's declaration before
          # its body runs (NUMERIC_CONVERSION, NON_FINITE), and a non-finite result of
          # an extern function stops it at the call (NONFINITE_RESULT).''',
          '''# Signed infinities cross the C ABI unchanged. NaN arguments stop before
          # the exported body (NUMERIC_CONVERSION); NaN extern results stop at the
          # call (NONFINITE_RESULT).'''),
          ('return which == 0 ? 2.5f : INFINITY;','return which == 0 ? 2.5f : NAN;'),
          ("extern 'make_value' produced a non-finite real32 value","extern 'make_value' produced a NaN real32 value"),
          ('# An exported function that leaves a failing deferred GPU check behind',
          '''# Both directions of the C ABI preserve the sign of infinity.
          cat > "$TMP/infinity_roundtrip.qui" <<'QUI'
          export "C" real64 halve_infinity(real64 value)
              return value / 2.0
          extern real32 native_infinity(int32 negative) = "native_infinity"
          extern void infinity_driver() = "infinity_driver"
          infinity_driver()
          print(native_infinity(0))
          print(" ")
          print(native_infinity(1))
          QUI
          cat > "$TMP/infinity_roundtrip_driver.c" <<'C'
          #include <math.h>
          #include <stdint.h>
          #include <stdlib.h>
          double halve_infinity(double);
          float native_infinity(int32_t negative) { return negative ? -INFINITY : INFINITY; }
          void infinity_driver(void) {
              double positive = halve_infinity(INFINITY);
              double negative = halve_infinity(-INFINITY);
              if (!isinf(positive) || signbit(positive) || !isinf(negative) || !signbit(negative)) abort();
          }
          C
          if compile infinity_roundtrip_driver && build infinity_roundtrip --link "$TMP/infinity_roundtrip_driver.o"; then
              run infinity_roundtrip
              if [[ "$rc" -ne 0 || "$(cat "$TMP/infinity_roundtrip.out")" != "inf -inf" ]]; then
                  fail "infinity_roundtrip: signed infinity did not cross the C ABI"
                  cat "$TMP/infinity_roundtrip.out" "$TMP/infinity_roundtrip.err"
              fi
          else
              fail "infinity_roundtrip: build failed"
          fi

          # An exported function that leaves a failing deferred GPU check behind''')])
          edit('tests/half_precision_tests.sh',[
          ('# their range checks, the finite checks, arrays, CPU tensors and their','# their range checks, infinity and NaN checks, arrays, CPU tensors and their'),
          ('# No visible infinity: overflow stops the program at the operation.','# Overflow and nonzero division by zero produce infinity; NaN remains an error.'),
