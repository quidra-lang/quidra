      - name: Verify repaired production checker and generated guards
        shell: bash
        run: |
          set -euo pipefail
          flags="-std=c++20 -O0 -g0 -Iinclude -Isrc -Ibuild-infinity/generated"
          clang++ $flags -Wall -Wextra -Werror -c src/checker.cpp -o checker-objects/checker.o
          clang++ checker-objects/*.o -o checker-after
          ./checker-after | tee infinity-results/checker-after.log
          grep -Fx '50/50 constant infinity contracts passed' infinity-results/checker-after.log
          clang++ $flags -ffunction-sections -fdata-sections tests/device_infinity_source_tests.cpp -Wl,--gc-sections -ldl -o generator-after
          ./generator-after | tee infinity-results/generator-after.log
          grep -Fx '60/60 generated infinity contracts passed' infinity-results/generator-after.log
      - name: Verify the actual runtime source and strengthened negative tests
        shell: bash
        run: |
          set -euo pipefail
          for source in runtime device_backend; do
            clang++ -std=c++20 -O1 -g0 -fPIC -Wall -Wextra -Wpedantic -Werror -ffunction-sections -fdata-sections -DQUIDRA_ENABLE_TEST_GPU_BACKEND=1 -Iinclude -Isrc -Ibuild-infinity/generated -c "src/$source.cpp" -o "$source.cpp.o"
          done
          cp recorded/build-gpu-contracts/libquidra_runtime.a .
          ar r libquidra_runtime.a runtime.cpp.o device_backend.cpp.o
          for test in tensor_infinity infinity_package_validation device_infinity exact_infinity fixed_infinity numeric_formats runtime_string; do
            clang++ -std=c++20 -O0 -Iinclude -Isrc -Ibuild-infinity/generated "tests/${test}_tests.cpp" libquidra_runtime.a -lcurl -ldl -pthread -o "$test"
            QUIDRA_TEST_FAKE_GPU_COUNT=1 "./$test" > "infinity-results/$test.log" 2>&1
            cat "infinity-results/$test.log"
          done
          python3 tests/infinity_runtime_failure_tests.py --exact ./exact_infinity --fixed ./fixed_infinity --tensor ./tensor_infinity --package ./infinity_package_validation | tee infinity-results/failure-contracts.log
          python3 -m py_compile tests/infinity_tests.py tests/infinity_runtime_failure_tests.py
      - name: Store verified file blobs without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYSTORE'
          from pathlib import Path
          import hashlib, json, os, urllib.request
          records = json.loads(Path('infinity-results/sources.json').read_text())
          for name, record in records.items():
              data = Path(name).read_bytes()
              assert hashlib.sha256(data).hexdigest() == record['after']
              expected = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert expected == record['blob'], name
              request = urllib.request.Request('https://api.github.com/repos/quidra-lang/quidra/git/blobs', data=json.dumps({'content': data.decode('utf-8'), 'encoding': 'utf-8'}).encode(), headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}, method='POST')
              with urllib.request.urlopen(request, timeout=60) as response:
                  stored = json.load(response)
              assert stored['sha'] == expected, name
              print(name, expected)
          PYSTORE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infinity-kernel-source
          path: infinity-results/
          if-no-files-found: error
          retention-days: 1
