name: patch-png-msvc

on:
  push:
    branches:
      - chatgpt/image-dtypes-20260917
    paths:
      - tools/patch_png_msvc_setjmp.py
      - .github/workflows/patch-png-msvc.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply PNG MSVC warning patch
        run: python3 tools/patch_png_msvc_setjmp.py
      - name: Check patch
        run: git diff --check
      - name: Commit patch
        run: |
          git config user.name "quidra-ci"
          git config user.email "actions@users.noreply.github.com"
          git add src/runtime_image.cpp
          if git diff --cached --quiet; then
            echo "No PNG MSVC patch needed"
          else
            git commit -m "fix: suppress MSVC setjmp warning for PNG"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
