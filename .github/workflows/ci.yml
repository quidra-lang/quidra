name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Needs no compiler, so it reports a hand-edited generated file or a second
  # copy of an SSOT value in seconds rather than after a full build.
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Project metadata derives from project.toml
        run: python3 tests/metadata_ssot_tests.py
      - name: Issue AI triage helper tests
        run: python3 tests/issue_triage_tests.py
      - name: Playground helper tests
        run: python3 tests/playground_tests.py

  release-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
            standard: 20
          - compiler: clang
            cc: clang
            cxx: clang++
            standard: 20
          - compiler: gcc-cxx23
            cc: gcc
            cxx: g++
            standard: 23
          - compiler: clang-cxx23
            cc: clang
            cxx: clang++
            standard: 23
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler cache
        run: sudo apt-get update && sudo apt-get install -y ccache llvm
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ matrix.compiler }}-cxx${{ matrix.standard }}-${{ hashFiles('CMakeLists.txt', 'src/**', 'include/**') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.compiler }}-cxx${{ matrix.standard }}-
      - name: Install native dependencies
        run: sudo apt-get install -y llvm libcurl4-openssl-dev libpng-dev libjpeg-dev libtiff-dev libwebp-dev ffmpeg libavformat-dev libavcodec-dev libavutil-dev libswscale-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=${{ matrix.standard }} -DQUIDRA_WARNINGS_AS_ERRORS=ON -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build --parallel
      - name: Tests
        run: ctest --test-dir build --output-on-failure --parallel 4
      - name: Benchmark programs stay current with the compiler
        if: matrix.compiler == 'clang' && matrix.standard == 20
        run: |
          # The Quidra side of the Language Quality benchmark lives in
          # tests/benchmark/quidra and is measured by the compiler built from
          # this tree, so a language change that breaks or invalidates one of
          # those programs must fail the commit that made it.
          tests/benchmark_programs.sh build/quidra
      - name: Package smoke
        if: matrix.compiler == 'gcc'
        run: |
          cpack --config build/CPackConfig.cmake -G DEB -B dist
          package="$(find dist -maxdepth 1 -name 'quidra_*_amd64.deb' -print -quit)"
          test -n "$package"
          dpkg-deb --contents "$package" | grep -q '/usr/bin/quidra'
          dpkg-deb --contents "$package" | grep -q '/usr/lib/quidra/libquidra_runtime.a'
          dpkg-deb --contents "$package" | grep -Eq '/usr/lib/quidra/libquidra_runtime_jit\.so$'
          dpkg-deb --contents "$package" | grep -q '/usr/share/doc/quidra/quidra.manifest.json'


  release-ubuntu-22-04:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install release-equivalent dependencies
        run: sudo apt-get update && sudo apt-get install -y clang-15 llvm-15 cmake ninja-build git curl xz-utils libcurl4-openssl-dev libpng-dev libjpeg-dev libtiff-dev libwebp-dev ffmpeg libavformat-dev libavcodec-dev libavutil-dev libswscale-dev
      - name: Configure
        run: cmake -S . -B build-release-compat -G Ninja -DCMAKE_BUILD_TYPE=Release -DQUIDRA_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build-release-compat --parallel
      - name: Tests
        run: ctest --test-dir build-release-compat --output-on-failure --parallel 4
      - name: Native smoke
        run: bash scripts/native-smoke.sh ./build-release-compat/quidra "$PWD"

  # The browser frontend is a first-class target, so it is built and actually
  # exercised on every push. A build that nobody runs rots into a fork.
  wasm-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.7
          actions-cache-folder: emsdk-cache
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Configure the frontend-only build
        run: >-
          emcmake cmake -S . -B build-wasm
          -DCMAKE_BUILD_TYPE=Release
          -DQUIDRA_WARNINGS_AS_ERRORS=ON
      - name: Confirm no native runtime dependency was pulled in
        run: |
          # The frontend build must not require CURL/PNG/JPEG/TIFF/WebP/FFmpeg.
          # None of them are installed on this runner, so a successful configure
          # above is the assertion; this step makes the intent explicit.
          ! grep -q "CURL_INCLUDE_DIR" build-wasm/CMakeCache.txt
      - name: Build
        run: cmake --build build-wasm --target quidra_wasm --parallel
      - name: Report artifact size
        run: |
          raw=$(stat -c%s build-wasm/quidra-core.wasm)
          gz=$(gzip -9 -c build-wasm/quidra-core.wasm | wc -c)
          echo "quidra-core.wasm: ${raw} bytes raw, ${gz} bytes gzip" >> "$GITHUB_STEP_SUMMARY"
      - name: Exercise the WebAssembly API
        run: node tests/wasm_api_tests.mjs build-wasm

  gpu-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler cache
        run: sudo apt-get update && sudo apt-get install -y ccache llvm
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-gpu-contracts-${{ hashFiles('CMakeLists.txt', 'src/**', 'include/**') }}
          restore-keys: |
            ccache-${{ runner.os }}-gpu-contracts-
      - name: Install native dependencies
        run: sudo apt-get install -y llvm libcurl4-openssl-dev libpng-dev libjpeg-dev libtiff-dev libwebp-dev ffmpeg libavformat-dev libavcodec-dev libavutil-dev libswscale-dev
      - name: Configure test-only fake GPU backend
        run: cmake -S . -B build-gpu-contracts -DCMAKE_BUILD_TYPE=Release -DQUIDRA_WARNINGS_AS_ERRORS=ON -DQUIDRA_ENABLE_TEST_GPU_BACKEND=ON -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build-gpu-contracts --parallel
      - name: GPU backend unit tests
        run: ctest --test-dir build-gpu-contracts -R quidra_device_backend_tests --output-on-failure
      - name: GPU placement contracts
        run: ctest --test-dir build-gpu-contracts -R quidra_gpu_contracts --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler cache
        run: sudo apt-get update && sudo apt-get install -y ccache llvm
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-sanitizers-${{ hashFiles('CMakeLists.txt', 'src/**', 'include/**') }}
          restore-keys: |
            ccache-${{ runner.os }}-sanitizers-
      - name: Install native dependencies
        run: sudo apt-get install -y llvm libcurl4-openssl-dev libpng-dev libjpeg-dev libtiff-dev libwebp-dev ffmpeg libavformat-dev libavcodec-dev libavutil-dev libswscale-dev
      - name: Configure ASan/UBSan
        run: >-
          cmake -S . -B build-san -DCMAKE_BUILD_TYPE=Debug
          -DQUIDRA_WARNINGS_AS_ERRORS=ON
          -DQUIDRA_SANITIZE_RUNTIME=ON
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build-san --parallel
      - name: Tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --test-dir build-san --output-on-failure --parallel 4


  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore macOS compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-macos-${{ hashFiles('CMakeLists.txt', 'src/**', 'include/**') }}
          restore-keys: |
            ccache-${{ runner.os }}-macos-
      - name: Install native dependencies
        run: brew install ccache llvm curl libpng jpeg-turbo libtiff webp ffmpeg
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DQUIDRA_WARNINGS_AS_ERRORS=ON -DCMAKE_PREFIX_PATH="$(brew --prefix curl);$(brew --prefix libpng);$(brew --prefix jpeg-turbo);$(brew --prefix libtiff);$(brew --prefix webp);$(brew --prefix ffmpeg)" -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build --parallel
      - name: Tests
        run: ctest --test-dir build --output-on-failure --parallel 4
      - name: Real Metal GPU numerical integration
        env:
          QUIDRA_REQUIRE_REAL_GPU: "1"
          QUIDRA_REQUIRE_GPU_BACKEND: "Metal"
        run: ctest --test-dir build -R quidra_real_gpu_integration --output-on-failure
      - name: Native smoke
        run: |
          printf 'print("Hello from macOS")\n' > build/platform-smoke.qui
          test "$(build/quidra build/platform-smoke.qui)" = "Hello from macOS"
          test "$(build/quidra run build/platform-smoke.qui)" = "Hello from macOS"
      - name: Package smoke
        run: cpack --config build/CPackConfig.cmake -G TGZ -B dist

  windows:
    runs-on: windows-latest
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite"
    steps:
      # Benchmark evidence can contain POSIX-valid names such as "aux" that
      # Win32 refuses to materialize. Core CI does not consume benchmark runs,
      # so keep the frozen evidence untouched and omit it from this checkout.
      - uses: actions/checkout@v4
        env:
          # Git for Windows rejects reserved DOS names anywhere in the index
          # before sparse rules can omit them. The excluded benchmark tree is
          # never materialized, so disable only that pre-check for this step.
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.protectNTFS
          GIT_CONFIG_VALUE_0: "false"
        with:
          sparse-checkout: |
            .github
            assets
            docs
            examples
            include
            scripts
            src
            tests
      - name: Identify vcpkg binary cache ABI
        id: vcpkg-cache-abi
        shell: pwsh
        run: |
          $vcpkgRevision = (git -C "$env:VCPKG_INSTALLATION_ROOT" rev-parse HEAD).Trim()
          if (-not $vcpkgRevision) { throw "Could not determine the vcpkg revision" }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installationPath = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if (-not $installationPath) { throw "Could not locate Visual Studio" }

          $msvcRoot = Join-Path $installationPath "VC\Tools\MSVC"
          $msvcVersion = (Get-ChildItem $msvcRoot -Directory | Sort-Object Name -Descending | Select-Object -First 1).Name
          if (-not $msvcVersion) { throw "Could not determine the MSVC toolset version" }

          "vcpkg_revision=$vcpkgRevision" >> $env:GITHUB_OUTPUT
          "msvc_version=$msvcVersion" >> $env:GITHUB_OUTPUT
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .vcpkg-binary-cache
          # vcpkg packages are ABI-sensitive. Keep cache reuse within the
          # exact hosted MSVC toolset and vcpkg revision so a stale Actions
          # cache cannot report a hit while vcpkg restores zero packages.
          key: vcpkg-windows-x64-${{ runner.os }}-msvc${{ steps.vcpkg-cache-abi.outputs.msvc_version }}-vcpkg${{ steps.vcpkg-cache-abi.outputs.vcpkg_revision }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            vcpkg-windows-x64-${{ runner.os }}-msvc${{ steps.vcpkg-cache-abi.outputs.msvc_version }}-vcpkg${{ steps.vcpkg-cache-abi.outputs.vcpkg_revision }}-
      - name: Prepare vcpkg binary cache
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path .vcpkg-binary-cache | Out-Null
      - name: Install native dependencies
        shell: pwsh
        run: vcpkg install curl:x64-windows libpng:x64-windows libjpeg-turbo:x64-windows tiff:x64-windows libwebp:x64-windows ffmpeg:x64-windows
      - name: Ensure LLVM JIT runner
        shell: pwsh
        run: |
          if (-not (Get-Command lli.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path "C:\Program Files\LLVM\bin\lli.exe")) {
            choco install llvm -y --no-progress
          }
      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build -A x64
          -DQUIDRA_WARNINGS_AS_ERRORS=ON
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure --parallel 4
      - name: Native smoke
        shell: pwsh
        run: |
          Set-Content -Path build/platform-smoke.qui -Value 'print("Hello from Windows")'
          $jitOutput = & build/Release/quidra.exe build/platform-smoke.qui
          if (($jitOutput -join "`n").Trim() -ne "Hello from Windows") { throw "JIT smoke failed: $jitOutput" }
          $output = & build/Release/quidra.exe run build/platform-smoke.qui
          if (($output -join "`n").Trim() -ne "Hello from Windows") { throw "native smoke failed: $output" }
          $pieces = ((1..64) | ForEach-Object { '"x"' }) -join ' + '
          Set-Content -Path build/binary-smoke.qui -Value "string value = $pieces`nprint(len(value))"
          & build/Release/quidra.exe check build/binary-smoke.qui | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "binary expression check failed with exit code $LASTEXITCODE" }
          & build/Release/quidra.exe llvm build/binary-smoke.qui | Out-File -Encoding utf8 build/binary-smoke.ll
          if ($LASTEXITCODE -ne 0) { throw "binary expression LLVM emission failed with exit code $LASTEXITCODE" }
          $binary = & build/Release/quidra.exe run build/binary-smoke.qui
          if ($LASTEXITCODE -ne 0) { throw "binary expression run failed with exit code $LASTEXITCODE" }
          if (($binary -join "`n").Trim() -ne "64") { throw "binary expression smoke failed: $binary" }
          Set-Content -Path build/json-smoke.qui -Value @'
          string source = "{{" + QUOTE + "name" + QUOTE + ":" + QUOTE + "Quidra" + QUOTE + "," + QUOTE + "items" + QUOTE + ":[1,2]}}"
          auto parsed = json.parse(source)
          match parsed
              json.Value root
                  auto name = root.get("name")
                  match name
                      json.Value value
                          auto text = value.text()
                          match text
                              string result
                                  print(result)
                              error problem
                                  print(problem)
                      none
                          print("missing")
                      error problem
                          print(problem)
                  print(root.encode())
              error problem
                  print(problem)
          '@
          $json = & build/Release/quidra.exe run build/json-smoke.qui
          $jsonActual = ($json -join [Environment]::NewLine).Trim()
          $jsonExpected = @'
          Quidra
          {"name":"Quidra","items":[1,2]}
          '@
          if ($jsonActual -ne $jsonExpected.Trim()) { throw "json smoke failed: $json" }
          Set-Content -Path build/process-smoke.qui -Value @'
          process.Result result = process.run("cmd", ["/c", "echo", "quidra-process"])
          print(result.started)
          print(result.status)
          '@
          $process = & build/Release/quidra.exe run build/process-smoke.qui
          if (($process -join "`n").Trim() -ne "true`n0") { throw "process smoke failed: $process" }
          Set-Content -Path build/process-shell-smoke.qui -Value @'
          process.Result result = process.shell("echo quidra shell")
          print(result.started)
          print(result.status)
          print(result.output.trim())
          '@
          $processShell = & build/Release/quidra.exe run build/process-shell-smoke.qui
          $expectedProcessShell = "true`n0`nquidra shell"
          if (($processShell -join "`n").Trim() -ne $expectedProcessShell) { throw "process.shell smoke failed: $processShell" }
          Set-Content -Path build/neural-smoke.qui -Value @'
          class WindowsNeuralModel
              neural.Parameter<float32> weight

          WindowsNeuralModel model
          model.weight = neural.Parameter<float32>(value = tensor.ones<float32>([1]))

          neural<float32> first_prediction = model.weight.track()
          neural<float32> first_loss = neural.mean(
              first_prediction * first_prediction
          )
          neural.Gradients first_gradients = neural.grad(first_loss)
          neural.update(&model, first_gradients, rate = 0.1)
          float32 saved = model.weight.raw()[0].item()
          neural.save(model, path = "build/windows-neural.quistate")

          neural<float32> second_prediction = model.weight.track()
          neural<float32> second_loss = neural.mean(
              second_prediction * second_prediction
          )
          neural.Gradients second_gradients = neural.grad(second_loss)
          neural.update(&model, second_gradients, rate = 0.1)
          print(model.weight.raw()[0].item() != saved)

          neural.load(&model = &model, path = "build/windows-neural.quistate")
          print(model.weight.raw()[0].item() == saved)
          neural.save(model, path = "build/windows-neural.quistate")
          '@
          & build/Release/quidra.exe check build/neural-smoke.qui | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "neural smoke check failed with exit code $LASTEXITCODE" }
          & build/Release/quidra.exe ir build/neural-smoke.qui | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "neural smoke IR lowering failed with exit code $LASTEXITCODE" }
          & build/Release/quidra.exe llvm build/neural-smoke.qui | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "neural smoke LLVM emission failed with exit code $LASTEXITCODE" }
          & build/Release/quidra.exe build build/neural-smoke.qui -o build/neural-smoke.exe
          if ($LASTEXITCODE -ne 0) { throw "neural smoke build failed with exit code $LASTEXITCODE" }
          $neural = & build/neural-smoke.exe
          $neuralExit = $LASTEXITCODE
          if ($neuralExit -ne 0) { throw "neural smoke executable failed with exit code $neuralExit" }
          if (($neural -join "`n").Trim() -ne "true`ntrue") { throw "neural smoke output mismatch: $neural" }
      - name: Package smoke
        run: cpack --config build/CPackConfig.cmake -C Release -G ZIP -B dist

  # BEGIN BENCHMARK CLEANUP ONCE
  benchmark-cleanup-once:
    name: benchmark-cleanup-once
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      BENCHMARK_IMAGE: quidra-benchmark/runtime:production
      BENCHMARK_MODEL: claude-sonnet-5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Freeze current develop head
        run: |
          set -euo pipefail
          echo "START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          test ! -e benchmark/.run-production

      - name: Build canonical exact-key cleanup candidate locally
        run: |
          set -euo pipefail
          python .github/scripts/benchmark_cleanup_once.py
          python -m py_compile \
            benchmark/template/scripts/benchmark.py \
            benchmark/template/scripts/production_run.py \
            benchmark/template/scripts/sandbox_launcher.py
          test "$(find benchmark/cache/v1 -type f -name '*.json' | wc -l)" -eq 687

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Stage canonical benchmark cache for replay validation"
          test -z "$(git status --porcelain=v1)"

      - name: Run benchmark cache contract tests
        run: |
          set -euo pipefail
          python tests/benchmark_cache_tests.py
          python tests/benchmark_semantic_compression_tests.py

      - name: Check structural cache impact
        run: |
          set -euo pipefail
          set +e
          python benchmark/template/scripts/benchmark.py cache-impact \
            --source-repo "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/cache-impact.json" > /dev/null
          rc=$?
          set -e
          cat "$RUNNER_TEMP/cache-impact.json"
          test "$rc" -eq 0
          python - "$RUNNER_TEMP/cache-impact.json" <<'PY'
          import json, sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text())
          assert int(report.get("valid", 0) or 0) == 687, report
          assert not report.get("invalid"), report.get("invalid")
          assert not report.get("superseded"), report.get("superseded")
          PY

      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Build exact pinned benchmark image
        run: |
          set -euo pipefail
          python benchmark/template/runtime/check_pins.py
          python benchmark/template/scripts/sandbox_launcher.py build-image \
            --target toolchains --image "$BENCHMARK_IMAGE"
          python benchmark/template/scripts/sandbox_launcher.py doctor \
            --image "$BENCHMARK_IMAGE"

      - name: Prove exact-only clean replay is zero paid and formally complete
        run: |
          set -euo pipefail
          rm -rf .quidra-benchmark
          python benchmark/template/scripts/benchmark.py init \
            --source-repo "$GITHUB_WORKSPACE" \
            --sandbox-mode container \
            --run-id canonical-cache-replay \
            --provider anthropic-messages \
            --model "$BENCHMARK_MODEL"

          python benchmark/template/scripts/sandbox_launcher.py run \
            --source-repo "$GITHUB_WORKSPACE" \
            --image "$BENCHMARK_IMAGE" \
            --provider fake \
            -- python3 /quidra-benchmark/template/scripts/benchmark.py prepare

          python benchmark/template/scripts/production_run.py budget-plan \
            --workspace "$GITHUB_WORKSPACE/.quidra-benchmark" \
            --model "$BENCHMARK_MODEL" \
            --available-usd 0 \
            --safety-multiplier 1.25 \
            --smoke-reserve-usd 0 \
            --output "$RUNNER_TEMP/budget-plan.json" > /dev/null

          python - "$RUNNER_TEMP/budget-plan.json" \
            "$GITHUB_WORKSPACE/.quidra-benchmark/results/cache_status.json" <<'PY'
          import collections, json, sys
          from pathlib import Path
          plan = json.loads(Path(sys.argv[1]).read_text())
          cache = json.loads(Path(sys.argv[2]).read_text())
          report = {
              "cache_hits": len(cache.get("hits", {})),
              "cache_misses": len(cache.get("misses", {})),
              "cache_invalidated": len(cache.get("invalidated", {})),
              "paid_calls_upper_bound": int(plan.get("expected_paid_api_calls_upper_bound", 0) or 0),
              "recommended_budget_usd": float(plan.get("recommended_budget_usd", 0) or 0),
          }
          print(json.dumps(report, indent=2, sort_keys=True))
          if cache.get("invalidated"):
              reasons = collections.Counter(
                  str(row.get("reason") or "")
                  for row in cache["invalidated"].values()
              )
              print("invalidated reasons:")
              print(json.dumps(reasons, indent=2, sort_keys=True))
          assert not plan.get("hard_blockers"), plan.get("hard_blockers")
          assert report["paid_calls_upper_bound"] == 0, report
          assert report["recommended_budget_usd"] == 0.0, report
          assert report["cache_misses"] == 0, report
          assert report["cache_invalidated"] == 0, report
          PY

          python benchmark/template/scripts/sandbox_launcher.py run \
            --source-repo "$GITHUB_WORKSPACE" \
            --image "$BENCHMARK_IMAGE" \
            --provider fake \
            -- python3 /quidra-benchmark/template/scripts/benchmark.py advance

          python benchmark/template/scripts/sandbox_launcher.py run \
            --source-repo "$GITHUB_WORKSPACE" \
            --image "$BENCHMARK_IMAGE" \
            --provider fake \
            -- python3 /quidra-benchmark/template/scripts/benchmark.py finalize

          python - "$GITHUB_WORKSPACE/.quidra-benchmark/results/finalization.json" <<'PY'
          import json, sys
          from pathlib import Path
          result = json.loads(Path(sys.argv[1]).read_text())
          assert result.get("formal_complete") is True, result
          print(json.dumps({
              "formal_complete": True,
              "status": result.get("status"),
          }, indent=2))
          PY

      - name: Remove all one-shot machinery and amend candidate
        run: |
          set -euo pipefail
          rm -rf .quidra-benchmark
          rm -f .github/scripts/benchmark_cleanup_once.py
          rm -f .github/scripts/canonicalize_benchmark_cache_once.py
          rm -f scripts/canonicalize_benchmark_cache_once.py
          rm -f .github/workflows/benchmark-cleanup-once.yml
          rm -f .github/workflows/benchmark-cache-canonicalize-once.yml
          python - <<'PY'
          from pathlib import Path
          path = Path(".github/workflows/ci.yml")
          text = path.read_text()
          marker = "\n  # BEGIN BENCHMARK CLEANUP ONCE\n"
          assert marker in text
          path.write_text(text.split(marker, 1)[0].rstrip() + "\n")
          PY
          git add -A
          git diff --cached --check
          git commit --amend --no-edit
          test -z "$(git status --porcelain=v1)"

      - name: Push verified cleanup onto latest develop
        run: |
          set -euo pipefail
          git fetch origin develop --prune
          remote_sha="$(git rev-parse origin/develop)"
          if [ "$remote_sha" != "$START_SHA" ]; then
            git rebase origin/develop
          fi
          test -z "$(git status --porcelain=v1)"
          git push origin HEAD:develop
  # END BENCHMARK CLEANUP ONCE

