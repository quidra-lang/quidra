name: infinity-kernel-source

# Temporary transport: verify real source edits, store content-addressed blobs,
# and leave all branch movement to a separate HEAD-leased source commit.
on:
  push:
    branches: [develop]
    paths: [.github/workflows/infinity-kernel-source.yml]
permissions:
  contents: write
  actions: read
jobs:
  verify-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 39046749694
          name: array-contract-compiler-25d921a34df6dd91972135365158e99c1a10a2de
          path: recorded
      - name: Prepare the recorded runtime and generated headers
        shell: bash
        run: |
          set -euo pipefail
          (cd recorded && sha256sum -c SHA256SUMS && tar -xzf compiler.tar.gz)
          test "$(cat recorded/core.sha)" = 25d921a34df6dd91972135365158e99c1a10a2de
          sudo apt-get update -qq && sudo apt-get install -y libcurl4-openssl-dev
          cmake -S . -B build-infinity -DBUILD_TESTING=OFF -DQUIDRA_BUILD_WASM_FRONTEND=ON
          mkdir -p infinity-results checker-objects
      - name: Record source preimages
        run: |
          python3 - <<'PYHASH'
          from pathlib import Path
          import hashlib, json
          records = {'src/runtime.cpp': {'before': '4fce31cd3bf57c330e5cd0b202bd493c373cfd41023b05fdedc0635c19598610', 'after': '9503578ce004d82bd58c1be989969c5f9e91a3bfbacd10aa6ae3e36ce7a5ec46', 'blob': '0658cf5dd645e41c9e01bfb5a924a26e3a2631ee'}, 'src/checker.cpp': {'before': 'dc93fc68b769abf076146c8cbaf8c517ba9c2e24680f7705ab395ec36c057fc3', 'after': '670b6337c46b009a8b5354d1ed5c1bf118d7fd812cc752df17b7a7fb5e24da21', 'blob': '1910f86fdbd2937ab3438708ee4df0632b5f131e'}, 'src/device_compute.inc': {'before': '90df4f6aa0588838dc40bd169ccf2b92d88ba2ed5a4553fff54eb0ba1dc3f67a', 'after': '0ec12f6389dfe7aed36822597c591fbbce975c9c68425930975e5b3457e2241c', 'blob': '2ee8a33b2db41de1494f394718f1293ddf36d6fd'}, 'CMakeLists.txt': {'before': 'b3e3eb14cf2c0c8d17aa6cd97f3ee4feddfa45437f62a7e6d9d44cb35c31c0ca', 'after': '7ada87dce080c8d2e5e79b5e77457657196daf44a0c6d5187b4236a0f62394c1', 'blob': 'a5651bd322c4b6937289ae6bf2be8549ec4c0dfb'}, '.github/workflows/ptx-gather-contract.yml': {'before': 'e2e0084f33e81ce4dd338e8b0f9777dfa31524d40a1c9964e2651ff50cec4501', 'after': '204357f7d1a50ae306b12b317d5144014df25e57ec0943745b5aef41fe5046ff', 'blob': 'b17c06083e21ba21b5c6e9a5489a60ee7e1f7d4a'}, 'tests/infinity_tests.py': {'before': '75e957c466573484eb2d3985e934ba3793df23c500e842a37f61341afd23aedc', 'after': '86eb83fe9da53ffdcd97c52c98cfce9e33840a34767fa0a743bdfa84da4058a1', 'blob': '8f352dd75fc064bb1fd2e34183e56ca80d308048'}, 'tests/tensor_infinity_tests.cpp': {'before': '10ed8ea81e3f08ef47c033d6fece98015f67265f55522f705b8e65f7a9c548f4', 'after': 'c51db3cabab70d24253af9a10ac621f3b7dc5994a32a761ae905c530c272ac66', 'blob': 'ab303f07c035440ba9d6012cebc25bd3bf1fc4cc'}, 'tests/infinity_package_validation_tests.cpp': {'before': 'b8dfc8441b14a6f559a3ed84edd02f39898c5fc00cce8df8d81c6dd0f5a43743', 'after': 'f0c170c6b9f39045dd90341719cfec36b5570395b5f0cc923ecae654e2c01f4a', 'blob': '9b7d0476dcac2e6c1efe292d64945bba957d67fe'}, 'tests/infinity_runtime_failure_tests.py': {'before': '2f541a1a96c126020e7ba056ea848c03d7d3c2f637bd6aa1e2b6aa5d580b4f2f', 'after': 'f5c0adf7e0955a106c4fbfecd5add65f8380f907f66204706188adefdec636fd', 'blob': '2686ea4a333fa2dd7d9fce9034d39553ec40e474'}}
          for name, record in records.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == record['before'], ('source changed', name)
          Path('infinity-results/sources.json').write_text(json.dumps(records, indent=2) + '\n')
          PYHASH
      - name: Reproduce checker and kernel generator failures
        shell: bash
        run: |
          set -euo pipefail
          flags="-std=c++20 -O0 -g0 -Iinclude -Isrc -Ibuild-infinity/generated"
          for source in checker_shapes lexer parser class_initialization parallel_for_check traversal_plan semantics/binding_entry ir/facts/tensor semantics/effect_summary semantics/tensor_extents semantics/mutation_markers semantics/storage_path semantics/parallel_effects checker; do
            clang++ $flags -c "src/$source.cpp" -o "checker-objects/${source//\//_}.o"
          done
          clang++ $flags -c tests/infinity_constant_tests.cpp -o checker-objects/test.o
          clang++ checker-objects/*.o -o checker-before
          clang++ $flags -ffunction-sections -fdata-sections tests/device_infinity_source_tests.cpp -Wl,--gc-sections -ldl -o generator-before
          set +e
          ./checker-before > infinity-results/checker-before.log 2>&1
          checker_status=$?
          ./generator-before > infinity-results/generator-before.log 2>&1
          generator_status=$?
          set -e
          test "$checker_status" -eq 1 && test "$generator_status" -eq 1
          grep -Fx '16/50 constant infinity contracts passed' infinity-results/checker-before.log
          grep -Fx '2/60 generated infinity contracts passed' infinity-results/generator-before.log
