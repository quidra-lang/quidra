name: benchmark-paid-state-keepalive

# Paid model-call checkpoints can contain hidden evaluation material, so they
# must never be committed to the public repository. Refresh the newest private,
# content-addressed artifact before its 90-day public-repository retention limit.
on:
  schedule:
    - cron: "17 4 1 1,3,5,7,9,11 *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: benchmark-paid-state-keepalive
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Restore newest unexpired private paid-call artifact
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/benchmark-paid-state"
          artifact_id="$(gh api \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=quidra-benchmark-paid-state&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty')"
          if [ -z "$artifact_id" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No paid-call artifact exists yet; nothing to refresh."
            exit 0
          fi
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
            > "$RUNNER_TEMP/benchmark-paid-state.zip"
          unzip -q -o "$RUNNER_TEMP/benchmark-paid-state.zip" \
            -d "$RUNNER_TEMP/benchmark-paid-state"
          test -n "$(find "$RUNNER_TEMP/benchmark-paid-state" -type f -print -quit)"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "source_artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"

      - name: Refresh private retention window
        if: ${{ steps.restore.outputs.found == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: quidra-benchmark-paid-state
          path: ${{ runner.temp }}/benchmark-paid-state
          if-no-files-found: error
          retention-days: 90
